<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>VICKS MARKET | منصة تجارة عالمية</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --orange: #ff6600;
            --orange-dark: #e55d00;
            --orange-light: #fff7ed;
            --green: #25D366;
            --telegram: #0088cc;
            --bg: #f5f5f5;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-sub: #6b7280;
            --border: #e5e7eb;
            --input-bg: #f3f4f6;
            --shadow: 0 2px 8px rgba(0,0,0,0.08);
            --radius: 14px;
        }
        body.dark {
            --bg: #0a0a0a;
            --card-bg: #141414;
            --text-main: #f0f0f0;
            --text-sub: #aaaaaa;
            --border: #2a2a2a;
            --orange-light: #1a0f06;
            --input-bg: #1e1e1e;
            --shadow: 0 2px 8px rgba(255,255,255,0.04);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
            background: var(--bg);
            color: var(--text-main);
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            overflow-x: hidden;
            transition: background .3s, color .3s;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .app { display:flex; flex-direction:column; height:100vh; }

        /* ===== HEADER ===== */
        .header {
            flex-shrink:0;
            display:flex; align-items:center; justify-content:space-between;
            padding: 10px 14px;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            position: sticky; top:0; z-index:30;
            box-shadow: var(--shadow);
        }
        .header-logo {
            display:flex; align-items:center; gap:7px;
            font-size:1.1rem; font-weight:800; color:var(--orange);
        }
        .header-logo .bag-icon {
            width:32px; height:32px;
            background:var(--orange); border-radius:8px;
            display:flex; align-items:center; justify-content:center;
            color:white; font-size:1rem;
        }
        .header-actions { display:flex; align-items:center; gap:6px; }
        .icon-btn {
            width:34px; height:34px; border-radius:50%;
            background:var(--input-bg); border:none; cursor:pointer;
            display:flex; align-items:center; justify-content:center;
            font-size:.95rem; color:var(--text-sub); transition:.2s;
            flex-shrink:0;
        }
        .icon-btn:active { transform:scale(.9); }

        /* ===== SEARCH BAR ===== */
        .search-bar {
            background:var(--card-bg); padding:10px 14px;
            border-bottom:1px solid var(--border); flex-shrink:0;
        }
        .search-wrap {
            display:flex; align-items:center; gap:8px;
            background:var(--input-bg); border-radius:24px;
            padding:0 12px; border:1px solid var(--border);
        }
        .search-wrap input {
            flex:1; border:none; background:transparent;
            padding:10px 4px; outline:none; font-size:.9rem; color:var(--text-main);
        }
        .search-wrap input::placeholder { color:var(--text-sub); }

        /* ===== CATEGORY CHIPS ===== */
        .cat-scroll {
            display:flex; gap:7px; overflow-x:auto; padding:9px 14px;
            scrollbar-width:none; background:var(--card-bg);
            border-bottom:1px solid var(--border); flex-shrink:0;
        }
        .cat-scroll::-webkit-scrollbar { display:none; }
        .cat-chip {
            padding:6px 15px; border-radius:20px;
            border:1px solid var(--border); cursor:pointer;
            white-space:nowrap; font-size:.78rem; font-weight:600;
            background:var(--card-bg); color:var(--text-sub);
            transition:.2s; flex-shrink:0;
        }
        .cat-chip.active { background:var(--orange); color:white; border-color:var(--orange); }

        /* ===== VIEW BAR ===== */
        .view-bar {
            display:flex; align-items:center; gap:8px; padding:8px 14px;
            background:var(--card-bg); border-bottom:1px solid var(--border); flex-shrink:0;
        }
        .view-toggle { display:flex; gap:4px; }
        .view-btn {
            width:32px; height:32px; border-radius:8px;
            border:1px solid var(--border); background:var(--input-bg);
            cursor:pointer; display:flex; align-items:center; justify-content:center;
            font-size:.85rem; color:var(--text-sub);
        }
        .view-btn.active { background:var(--orange); color:white; border-color:var(--orange); }
        .view-bar-spacer { flex:1; }
        .vip-quick-btn {
            padding:6px 14px; border-radius:20px;
            background:linear-gradient(135deg,#f59e0b,#d97706);
            color:white; border:none; cursor:pointer;
            font-size:.78rem; font-weight:700; white-space:nowrap;
        }
        .offers-quick-btn {
            padding:6px 14px; border-radius:20px;
            background:var(--orange); color:white; border:none; cursor:pointer;
            font-size:.78rem; font-weight:700; white-space:nowrap;
        }

        /* ===== CONTENT SCROLL ===== */
        .content-scroll { flex:1; overflow-y:auto; overflow-x:hidden; padding-bottom:70px; -webkit-overflow-scrolling:touch; }

        /* ===== PRODUCT GRID / LIST ===== */
        .product-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; padding:10px; }
        .product-list { display:flex; flex-direction:column; gap:8px; padding:8px; }

        /* ===== PRODUCT CARD ===== */
        .product-card {
            background:var(--card-bg); border:1px solid var(--border);
            border-radius:var(--radius); overflow:hidden; cursor:pointer;
            transition:.2s; position:relative; display:flex; flex-direction:column;
            box-shadow:var(--shadow);
        }
        .product-card:active { transform:scale(.97); }
        .product-card.list-mode { flex-direction:row; padding:10px; gap:10px; align-items:flex-start; }

        .prod-img {
            background:var(--input-bg); display:flex; align-items:center;
            justify-content:center; font-size:3.5rem;
            position:relative; overflow:hidden; transition:.2s;
        }
        .prod-img img { width:100%; height:100%; object-fit:cover; }
        .grid-mode .prod-img { height:130px; }
        .list-mode .prod-img { width:80px; height:80px; font-size:2.2rem; border-radius:10px; flex-shrink:0; }

        .cond-badge {
            position:absolute; top:7px; right:7px;
            background:var(--orange); color:white;
            font-size:.65rem; font-weight:700; padding:2px 8px;
            border-radius:10px; z-index:2;
        }

        .card-body { flex:1; display:flex; flex-direction:column; padding:8px 10px; gap:4px; min-width:0; }
        .list-mode .card-body { padding:0; }

        .prod-name {
            font-weight:700; font-size:.85rem; color:var(--text-main);
            white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
            text-align:center; line-height:1.3;
        }
        .list-mode .prod-name { text-align:right; font-size:.82rem; }

        .prod-price-wrap { display:flex; align-items:center; justify-content:center; gap:6px; flex-wrap:wrap; }
        .list-mode .prod-price-wrap { justify-content:flex-start; }
        .prod-price { font-weight:800; color:var(--orange); font-size:.95rem; white-space:nowrap; }
        .prod-old-price { text-decoration:line-through; color:var(--text-sub); font-size:.72rem; }

        /* Action Buttons Row */
        .card-actions {
            display:flex; align-items:center; gap:5px;
            margin-top:4px; justify-content:center;
        }
        .list-mode .card-actions { justify-content:flex-start; }
        .act-btn {
            width:30px; height:30px; border-radius:50%; border:none; cursor:pointer;
            display:flex; align-items:center; justify-content:center;
            font-size:.8rem; transition:.2s;
        }
        .act-btn:active { transform:scale(.85); }
        .act-like { background:#fee2e2; color:#ef4444; }
        .act-like.liked { background:#ef4444; color:white; }
        .act-chat { background:#e0f2fe; color:#0284c7; }
        .act-tg { background:#e0f9ff; color:var(--telegram); }
        .act-wa { background:#dcfce7; color:var(--green); }

        /* Store info row */
        .store-row {
            display:flex; align-items:center; gap:5px;
            margin-top:3px; justify-content:flex-start; flex-wrap:wrap;
        }
        .store-avatar-sm {
            width:18px; height:18px; border-radius:50%;
            background:var(--orange); color:white;
            display:flex; align-items:center; justify-content:center;
            font-size:.6rem; font-weight:700; flex-shrink:0;
        }
        .store-name-sm { font-size:.7rem; color:var(--text-sub); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .stars-sm { display:flex; gap:1px; direction:ltr; }
        .stars-sm i { font-size:.65rem; color:#fbbf24; }

        /* ===== BOTTOM NAV ===== */
        .bottom-nav {
            position:fixed; bottom:0; left:50%; transform:translateX(-50%);
            width:100%; max-width:480px;
            background:var(--card-bg); border-top:1px solid var(--border);
            display:flex; z-index:40; box-shadow:0 -2px 10px rgba(0,0,0,.08);
        }
        .nav-item {
            flex:1; display:flex; flex-direction:column; align-items:center;
            justify-content:center; padding:8px 0; cursor:pointer;
            color:var(--text-sub); font-size:.6rem; gap:3px; transition:.2s;
            border:none; background:none;
        }
        .nav-item i { font-size:1.1rem; }
        .nav-item.active { color:var(--orange); }
        .nav-item span { font-size:.62rem; }

        /* ===== FLOATING AI BTN ===== */
        .float-ai {
            position:fixed; bottom:70px; left:16px;
            width:52px; height:52px; border-radius:50%;
            background:var(--orange); color:white; border:none; cursor:pointer;
            z-index:35; display:flex; align-items:center; justify-content:center;
            font-size:1.4rem; box-shadow:0 4px 16px rgba(255,102,0,.5);
            animation: pulseO 2.5s infinite;
        }
        @keyframes pulseO {
            0%,100% { box-shadow:0 0 0 0 rgba(255,102,0,.7); }
            50% { box-shadow:0 0 0 12px rgba(255,102,0,0); }
        }

        /* ===== OVERLAY / MODAL BASE ===== */
        .overlay-bg {
            position:fixed; inset:0; background:rgba(0,0,0,.55);
            z-index:60; display:flex; align-items:flex-end; justify-content:center;
            animation:fadeIn .2s;
        }
        @keyframes fadeIn { from{opacity:0} to{opacity:1} }
        .sheet {
            background:var(--card-bg); border-radius:18px 18px 0 0;
            width:100%; max-width:480px; overflow:hidden;
            animation:slideUp .3s ease;
        }
        @keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
        .sheet-header {
            display:flex; align-items:center; justify-content:space-between;
            padding:14px 16px; border-bottom:1px solid var(--border); flex-shrink:0;
        }
        .sheet-title { font-weight:700; font-size:.95rem; }

        /* ===== FULLSCREEN PAGE ===== */
        .fullscreen {
            position:fixed; inset:0; z-index:50;
            background:var(--bg); display:flex; flex-direction:column;
            animation:fadeIn .2s;
        }
        .page-header {
            flex-shrink:0; display:flex; align-items:center; gap:10px;
            padding:12px 16px; background:var(--card-bg);
            border-bottom:1px solid var(--border);
        }
        .page-title { font-weight:700; font-size:1rem; flex:1; }
        .back-btn { background:none; border:none; color:var(--text-sub); font-size:1.1rem; cursor:pointer; padding:4px; }

        /* ===== LOGIN / REGISTER ===== */
        .auth-page {
            flex:1; overflow-y:auto; padding:24px 20px 40px; display:flex; flex-direction:column; gap:16px;
        }
        .auth-logo-row {
            display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;
        }
        .auth-logo { display:flex; align-items:center; gap:8px; }
        .auth-logo .bag { width:36px; height:36px; background:var(--orange); border-radius:10px; display:flex; align-items:center; justify-content:center; color:white; font-size:1.1rem; }
        .auth-logo span { font-weight:800; font-size:1rem; }
        .auth-logo .brand-v { color:var(--orange); }
        .auth-logo .brand-rest { color:#1a6b3a; }
        .auth-title { font-size:1.15rem; font-weight:800; color:var(--text-main); }
        .form-group { display:flex; flex-direction:column; gap:6px; }
        .form-label { font-size:.8rem; font-weight:600; color:var(--text-sub); }
        .form-input {
            width:100%; padding:12px 14px; border-radius:12px;
            border:1.5px solid var(--border); background:var(--input-bg);
            font-size:.9rem; color:var(--text-main); outline:none; transition:.2s;
            font-family:inherit;
        }
        .form-input:focus { border-color:var(--orange); }
        .form-input::placeholder { color:var(--text-sub); }
        .btn-primary {
            width:100%; padding:13px; border-radius:14px;
            background:var(--orange); color:white; border:none;
            font-weight:700; font-size:.95rem; cursor:pointer; transition:.2s;
            font-family:inherit;
        }
        .btn-primary:active { background:var(--orange-dark); transform:scale(.98); }
        .social-btn {
            display:flex; align-items:center; justify-content:center; gap:8px;
            width:100%; padding:11px; border-radius:12px; cursor:pointer;
            border:1.5px solid var(--border); background:var(--card-bg);
            color:var(--text-main); font-size:.85rem; font-weight:600;
            transition:.2s; font-family:inherit;
        }
        .social-btn:active { background:var(--input-bg); }
        .social-google { border-color:#ea4335; color:#ea4335; }
        .social-facebook { border-color:#1877f2; color:#1877f2; }
        .social-email { border-color:var(--orange); color:var(--orange); }
        .sep-text { text-align:center; color:var(--text-sub); font-size:.78rem; }
        .link-btn { background:none; border:none; cursor:pointer; color:var(--orange); font-weight:700; font-family:inherit; font-size:.85rem; }
        .forgot-wrap { text-align:center; }
        .join-text { text-align:center; font-size:.83rem; color:var(--text-sub); }
        /* Account type toggle */
        .acc-type-wrap { display:flex; gap:0; border-radius:12px; overflow:hidden; border:1.5px solid var(--border); }
        .acc-type-btn {
            flex:1; padding:11px; border:none; cursor:pointer;
            font-size:.88rem; font-weight:700; background:var(--input-bg); color:var(--text-sub);
            transition:.2s; font-family:inherit; display:flex; align-items:center; justify-content:center; gap:6px;
        }
        .acc-type-btn.active { background:var(--orange); color:white; }
        .acc-type-label { font-size:.75rem; color:var(--text-sub); font-weight:600; margin-bottom:4px; }

        /* ===== PROFILE PAGE ===== */
        .profile-page { flex:1; overflow-y:auto; padding-bottom:20px; }
        .profile-top-bar {
            display:flex; align-items:center; justify-content:space-between;
            padding:10px 14px; background:var(--card-bg); border-bottom:1px solid var(--border);
        }
        .profile-top-actions { display:flex; gap:6px; align-items:center; }
        .currency-btn {
            display:flex; align-items:center; gap:4px;
            padding:4px 10px; border-radius:14px; border:1px solid var(--border);
            background:var(--input-bg); font-size:.75rem; font-weight:600; cursor:pointer;
            color:var(--text-main);
        }
        .profile-avatar-wrap { display:flex; flex-direction:column; align-items:center; padding:20px 16px 14px; background:var(--card-bg); }
        .avatar-circle {
            width:80px; height:80px; border-radius:50%;
            background:#e5e7eb; display:flex; align-items:center; justify-content:center;
            font-size:2.5rem; position:relative; margin-bottom:10px;
            border:3px solid var(--border);
        }
        .avatar-badge {
            position:absolute; bottom:0; right:0;
            width:22px; height:22px; border-radius:50%; background:#1d9bf0;
            display:flex; align-items:center; justify-content:center; color:white; font-size:.7rem;
            border:2px solid var(--card-bg);
        }
        .avatar-crown { position:absolute; top:-14px; left:50%; transform:translateX(-50%); font-size:1.5rem; }
        .profile-name { font-weight:800; font-size:1.1rem; color:var(--text-main); margin-bottom:6px; }
        .profile-info-row { display:flex; align-items:center; gap:6px; font-size:.8rem; color:var(--text-sub); margin-bottom:3px; }
        .profile-tabs {
            display:flex; background:var(--card-bg); border-bottom:1px solid var(--border);
            border-top:1px solid var(--border); flex-shrink:0;
        }
        .prof-tab {
            flex:1; padding:10px; border:none; background:transparent; cursor:pointer;
            font-size:.8rem; font-weight:600; color:var(--text-sub); transition:.2s; font-family:inherit;
        }
        .prof-tab.active { color:var(--orange); border-bottom:2px solid var(--orange); }

        /* Admin tools */
        .admin-section { padding:12px 14px; }
        .admin-section-title { font-weight:700; font-size:.9rem; margin-bottom:10px; text-align:right; }
        .admin-tool-card {
            background:var(--card-bg); border-radius:12px; padding:12px;
            border:1px solid var(--border); margin-bottom:10px; display:flex; flex-direction:column; gap:8px;
        }
        .admin-row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
        .admin-label { font-size:.78rem; color:var(--text-sub); font-weight:600; margin-bottom:4px; }
        .admin-input {
            flex:1; padding:8px 12px; border-radius:10px;
            border:1.5px solid var(--border); background:var(--input-bg);
            font-size:.82rem; color:var(--text-main); outline:none; min-width:0;
            font-family:inherit;
        }
        .admin-btn {
            padding:8px 16px; border-radius:10px; border:none; cursor:pointer;
            font-weight:700; font-size:.82rem; transition:.2s; font-family:inherit;
        }
        .btn-ban { background:#ef4444; color:white; }
        .btn-send { background:var(--orange); color:white; }
        .btn-plus { background:#22c55e; color:white; }
        .btn-minus { background:#ef4444; color:white; }
        .btn-activate { background:#1d9bf0; color:white; }
        .days-select {
            padding:7px 10px; border-radius:10px; border:1.5px solid var(--border);
            background:var(--input-bg); font-size:.8rem; color:var(--text-main);
            outline:none; font-family:inherit;
        }
        .currency-points-row { display:flex; gap:6px; }

        /* ===== VIP PAGE ===== */
        .vip-page { flex:1; overflow-y:auto; padding-bottom:20px; }
        .vip-hero {
            background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);
            padding:24px 16px; text-align:center; color:white;
        }
        .vip-logo { font-size:1.4rem; font-weight:900; letter-spacing:1px; margin-bottom:4px; }
        .vip-sub { font-size:.8rem; opacity:.7; }
        .vip-avatar-wrap { display:flex; flex-direction:column; align-items:center; padding:14px 0 0; }
        .vip-badge-label {
            background:linear-gradient(135deg,#f59e0b,#d97706);
            color:white; font-size:.75rem; font-weight:700; padding:3px 14px;
            border-radius:10px; margin-top:6px;
        }
        .vip-section { padding:12px 14px; }
        .vip-section-title { font-weight:700; font-size:.9rem; margin-bottom:10px; text-align:right; border-right:3px solid var(--orange); padding-right:8px; }
        .vip-card { background:var(--card-bg); border-radius:12px; padding:12px; border:1px solid var(--border); margin-bottom:10px; }
        .badge-select-row { display:flex; gap:6px; margin-bottom:10px; }
        .badge-opt {
            flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
            padding:8px 4px; border-radius:10px; border:1.5px solid var(--border);
            cursor:pointer; font-size:.7rem; font-weight:600; transition:.2s;
        }
        .badge-opt.active { border-color:var(--orange); background:var(--orange-light); color:var(--orange); }
        .badge-opt .badge-icon { font-size:1.2rem; }
        .duration-row { display:flex; gap:5px; flex-wrap:wrap; }
        .dur-btn {
            padding:6px 12px; border-radius:20px; border:1.5px solid var(--border);
            background:var(--input-bg); cursor:pointer; font-size:.75rem; font-weight:700;
            color:var(--text-sub); transition:.2s; font-family:inherit;
        }
        .dur-btn.active { background:var(--orange); color:white; border-color:var(--orange); }
        .discount-slider { width:100%; accent-color:var(--orange); }
        .packages-row { display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; scrollbar-width:none; }
        .packages-row::-webkit-scrollbar { display:none; }
        .pkg-card {
            flex-shrink:0; width:120px; border-radius:12px; padding:10px;
            border:1.5px solid var(--border); background:var(--card-bg);
            display:flex; flex-direction:column; align-items:center; gap:5px; text-align:center;
        }
        .pkg-avatar { width:40px; height:40px; border-radius:50%; background:var(--input-bg); font-size:1.3rem; display:flex; align-items:center; justify-content:center; }
        .pkg-name { font-size:.72rem; font-weight:700; color:var(--text-main); }
        .pkg-desc { font-size:.65rem; color:var(--text-sub); line-height:1.3; }
        .pkg-pts { font-size:.7rem; font-weight:700; color:#f59e0b; }
        .pts-input-row { display:flex; gap:8px; align-items:center; }
        .pts-input { flex:1; padding:10px 14px; border-radius:12px; border:1.5px solid var(--border); background:var(--input-bg); font-size:.85rem; color:var(--text-main); outline:none; font-family:inherit; }
        .pts-cost { font-size:.8rem; color:var(--text-sub); margin-top:4px; }

        /* ===== CHAT PAGE ===== */
        .chat-page { flex:1; overflow:hidden; display:flex; flex-direction:column; }
        .chat-header { background:var(--orange); color:white; padding:12px 16px; display:flex; align-items:center; gap:10px; flex-shrink:0; }
        .chat-header-logo { font-size:.95rem; font-weight:800; flex:1; }
        .chat-messages { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; -webkit-overflow-scrolling:touch; }
        .chat-center-logo { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px 16px; gap:8px; }
        .chat-center-logo .big-logo { font-size:2rem; font-weight:900; color:var(--text-main); }
        .chat-center-logo .bag-big { font-size:2.2rem; }
        .msg {
            max-width:80%; padding:10px 14px; font-size:.82rem; line-height:1.5;
            border-radius:16px; word-break:break-word;
        }
        .msg-user { background:var(--orange); color:white; align-self:flex-end; border-radius:16px 16px 4px 16px; }
        .msg-bot { background:var(--input-bg); color:var(--text-main); border:1px solid var(--border); align-self:flex-start; border-radius:16px 16px 16px 4px; }
        .chat-input-bar {
            flex-shrink:0; display:flex; gap:8px; align-items:center;
            padding:10px 14px; border-top:1px solid var(--border);
            background:var(--card-bg);
        }
        .chat-input-bar input {
            flex:1; padding:10px 14px; border-radius:22px; border:1px solid var(--border);
            background:var(--input-bg); outline:none; font-size:.85rem; color:var(--text-main);
            font-family:inherit;
        }
        .chat-send-btn { width:38px; height:38px; border-radius:50%; background:var(--orange); color:white; border:none; cursor:pointer; font-size:.9rem; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
        .chat-extra-btn { background:none; border:none; color:var(--text-sub); font-size:1rem; cursor:pointer; padding:4px; }

        /* ===== COMMENTS PANEL ===== */
        .comments-list { overflow-y:auto; max-height:28vh; padding:10px 16px; display:flex; flex-direction:column; gap:8px; }
        .comment-bub { background:var(--input-bg); padding:8px 12px; border-radius:12px; font-size:.8rem; color:var(--text-main); align-self:flex-start; border:1px solid var(--border); max-width:90%; }
        .comment-input-row { display:flex; gap:8px; padding:10px 16px; border-top:1px solid var(--border); align-items:center; }
        .comment-input-row input { flex:1; padding:9px 13px; border-radius:20px; border:1px solid var(--border); background:var(--input-bg); outline:none; font-size:.8rem; color:var(--text-main); font-family:inherit; }

        /* ===== PRODUCT DETAIL ===== */
        .detail-img { width:100%; height:220px; background:var(--input-bg); display:flex; align-items:center; justify-content:center; font-size:6rem; flex-shrink:0; }
        .detail-body { padding:16px; display:flex; flex-direction:column; gap:12px; flex:1; overflow-y:auto; }
        .detail-name { font-size:1.2rem; font-weight:800; color:var(--text-main); }
        .detail-price { font-size:1.5rem; font-weight:900; color:var(--orange); }
        .detail-actions { display:flex; gap:10px; }
        .det-act-btn { flex:1; padding:12px; border-radius:12px; border:none; cursor:pointer; font-weight:700; font-size:.9rem; display:flex; align-items:center; justify-content:center; gap:6px; font-family:inherit; }
        .det-wa { background:var(--green); color:white; }
        .det-tg { background:var(--telegram); color:white; }
        .detail-store-card { display:flex; gap:10px; align-items:center; padding:12px; background:var(--input-bg); border-radius:12px; border:1px solid var(--border); }
        .detail-desc { font-size:.85rem; color:var(--text-sub); line-height:1.6; }

        /* ===== TOAST ===== */
        .toast {
            position:fixed; bottom:80px; left:50%; transform:translateX(-50%);
            background:#1f2937; color:white; padding:10px 20px;
            border-radius:20px; font-size:.8rem; z-index:200;
            animation:toastIn .3s ease, toastOut .3s ease 1.8s forwards;
            pointer-events:none; white-space:nowrap;
        }
        @keyframes toastIn { from{opacity:0;transform:translateX(-50%) translateY(20px)} to{opacity:1;transform:translateX(-50%) translateY(0)} }
        @keyframes toastOut { from{opacity:1} to{opacity:0;transform:translateX(-50%) translateY(-10px)} }

        /* ===== EMPTY STATE ===== */
        .empty-state { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px 20px; gap:12px; }
        .empty-state .empty-icon { font-size:3rem; opacity:.4; }
        .empty-state p { color:var(--text-sub); font-size:.85rem; }

        /* ===== OFFERS PAGE ===== */
        .offers-banner { margin:10px; border-radius:14px; background:linear-gradient(135deg,var(--orange),#e55d00); padding:16px; color:white; display:flex; align-items:center; gap:12px; }
        .offers-banner .offer-icon { font-size:2.5rem; }
        .offers-banner .offer-info .title { font-weight:800; font-size:1rem; }
        .offers-banner .offer-info .sub { font-size:.78rem; opacity:.85; margin-top:2px; }

        /* scrollbar */
        ::-webkit-scrollbar { width:4px; }
        ::-webkit-scrollbar-thumb { background:var(--border); border-radius:4px; }
    </style>
</head>
<body>
<div id="root"></div>

<script>
(function(){
    // ===================== STATE =====================
    const STORAGE_KEY = 'vicks_v5';
    const THEME_KEY = 'vicks_theme_v5';
    const GUEST_LIKES = 'vicks_guest_likes_v5';

    function makeInitial() {
        const sellers = {
            admin0: { id:'admin0', email:'mom1113694362@gmail.com', password:'momMOM2023#', storeName:'VICKS MARKET', ownerName:'Z҉E҉R҉O҉', phone:'01113694362', points:Infinity, verified:true, subscription:'platinum', country:'مصر', emoji:'👑', verifiedBadge:true, accountType:'admin', maxProducts:Infinity },
            admin1: { id:'admin1', email:'admin@vicks.com', password:'admin123', storeName:'VICKS MARKET', ownerName:'محمد المالك', phone:'01113694362', points:50000, verified:true, subscription:'platinum', country:'مصر', emoji:'👑', verifiedBadge:true, accountType:'seller', maxProducts:Infinity },
            s1: { id:'s1', email:'seller1@test.com', password:'123456', storeName:'متجر النور', ownerName:'أحمد', phone:'01012345678', points:350, verified:true, subscription:'silver', country:'مصر', emoji:'🌟', verifiedBadge:true, accountType:'seller', maxProducts:Infinity },
            s2: { id:'s2', email:'seller2@test.com', password:'123456', storeName:'سوبر ماركت الفرح', ownerName:'فاطمة', phone:'01198765432', points:120, verified:false, subscription:'free', country:'السعودية', emoji:'🛒', verifiedBadge:false, accountType:'seller', maxProducts:10 },
            c1: { id:'c1', email:'customer@test.com', password:'123456', storeName:'', ownerName:'محمد', phone:'+20 123 456 789', points:50, verified:false, subscription:'free', country:'مصر', emoji:'👤', verifiedBadge:false, accountType:'customer' }
        };
        const products = {};
        const demoProducts = [
            { name:'ايفون 14 Pro', price:18000, cat:'electronics', emoji:'📱', cond:'used', sid:'s1', rating:5, oldPrice:22000 },
            { name:'شاشة سامسونج 55 بوصة', price:4500, cat:'electronics', emoji:'📺', cond:'used', sid:'s1', rating:4, oldPrice:6000 },
            { name:'زيت زيتون طبيعي', price:220, cat:'supermarket', emoji:'🫒', cond:'new', sid:'s2', rating:4 },
            { name:'بلاي ستيشن 5', price:12500, cat:'games', emoji:'🎮', cond:'new', sid:'s2', rating:5 },
            { name:'عطر فاخر', price:890, cat:'beauty', emoji:'🧴', cond:'new', sid:'s1', rating:4, oldPrice:1200 },
            { name:'ساعة ذكية', price:2400, cat:'accessories', emoji:'⌚', cond:'used', sid:'s2', rating:3, oldPrice:3500 },
            { name:'طقم مطبخ', price:1750, cat:'home', emoji:'🍳', cond:'new', sid:'s1', rating:4 },
            { name:'لابتوب لينوفو', price:9800, cat:'electronics', emoji:'💻', cond:'used', sid:'s1', rating:5, oldPrice:12000 },
            { name:'سماعات سوني', price:1200, cat:'accessories', emoji:'🎧', cond:'new', sid:'s2', rating:5 },
            { name:'كريم مرطب', price:180, cat:'beauty', emoji:'🧴', cond:'new', sid:'s2', rating:3 },
        ];
        demoProducts.forEach((p, i) => {
            const pid = 'p'+(i+1);
            products[pid] = { id:pid, name:p.name, price:p.price, oldPrice:p.oldPrice||null, category:p.cat, condition:p.cond, emoji:p.emoji, sellerId:p.sid, likes:(i*7)%19, likedBy:[], comments:['جيد جداً 👍','ممتاز وسرعة في التوصيل','سعر مناسب وجودة عالية'].slice(0,(i%3)+1), rating:p.rating||3, description:'منتج عالي الجودة متوفر للبيع. يمكن التواصل للاستفسار عن التفاصيل.' };
        });
        return { sellers, products, currentUserId:null, chatMessages:[{ role:'bot', text:'أهلاً بك في VICKS MARKET! كيف أقدر أساعدك اليوم؟' }] };
    }

    let S = (() => { try { const r = localStorage.getItem(STORAGE_KEY); return r ? JSON.parse(r) : makeInitial(); } catch { return makeInitial(); } })();
    function save() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(S)); } catch {} }

    // Guest likes
    function getGuestLikes() { try { return JSON.parse(localStorage.getItem(GUEST_LIKES)||'[]'); } catch { return []; } }
    function isLiked(pid) { const u = S.currentUserId; return u ? (S.products[pid]?.likedBy||[]).includes(u) : getGuestLikes().includes(pid); }
    function toggleLike(pid) {
        const p = S.products[pid]; if(!p) return;
        if(S.currentUserId) {
            const i = p.likedBy.indexOf(S.currentUserId);
            if(i>=0) p.likedBy.splice(i,1); else p.likedBy.push(S.currentUserId);
            p.likes = p.likedBy.length;
        } else {
            const gl = getGuestLikes(), i = gl.indexOf(pid);
            if(i>=0) gl.splice(i,1); else gl.push(pid);
            localStorage.setItem(GUEST_LIKES, JSON.stringify(gl));
        }
        save();
    }

    // ===================== APP STATE =====================
    let page = 'home'; // home | login | register | profile | vip | offers | chat | detail | comments
    let viewMode = 'grid';
    let activeCat = 'all';
    let searchQ = '';
    let showSearch = false;
    let selectedProduct = null;
    let profileTab = 'offers';
    let profileViewUser = null; // user id to view profile of
    let vipBadge = 'gold';
    let vipVerDur = '1m';
    let vipPriDur = 'day';
    let vipDiscount = 50;
    let registerType = 'customer'; // customer | seller
    let bannedIds = [];
    let priorityProducts = [];
    let offerProducts = [];

    const root = document.getElementById('root');

    // ===================== RENDER =====================
    function render() {
        root.innerHTML = '';
        // apply theme
        if(localStorage.getItem(THEME_KEY)==='dark') document.body.classList.add('dark');
        else document.body.classList.remove('dark');

        const app = el('div','app');
        if(page==='chat') { app.appendChild(buildChat()); }
        else if(page==='login') { app.appendChild(buildLogin()); }
        else if(page==='register') { app.appendChild(buildRegister()); }
        else if(page==='vip') { app.appendChild(buildVIP()); }
        else if(page==='offers') { app.appendChild(buildOffers()); }
        else if(page==='profile') { app.appendChild(buildProfile()); }
        else if(page==='detail') { app.appendChild(buildDetail()); }
        else {
            app.appendChild(buildHeader());
            if(showSearch) app.appendChild(buildSearchBar());
            app.appendChild(buildCatBar());
            app.appendChild(buildViewBar());
            app.appendChild(buildProductsContent());
            app.appendChild(buildBottomNav());
            app.appendChild(buildFloatAI());
        }
        root.appendChild(app);
    }

    // ===================== ELEMENTS =====================
    function el(tag, cls, html) { const e=document.createElement(tag); if(cls)e.className=cls; if(html)e.innerHTML=html; return e; }
    function txt(tag, cls, text) { const e=el(tag,cls); e.textContent=text; return e; }

    // ===================== HEADER =====================
    function buildHeader() {
        const h = el('div','header');
        // Left actions
        const la = el('div','header-actions');
        const cu = S.currentUserId ? S.sellers[S.currentUserId] : null;
        const profBtn = el('button','icon-btn'); profBtn.innerHTML=`<i class="fas fa-${cu?'user-circle':'user'}"></i>`; profBtn.onclick=()=>{if(cu){profileViewUser=cu.id;page='profile';render();}else{page='login';render();}};
        const darkBtn = el('button','icon-btn'); darkBtn.innerHTML=`<i class="fas fa-moon"></i>`; darkBtn.onclick=toggleDark;
        const searchBtn = el('button','icon-btn'); searchBtn.innerHTML=`<i class="fas fa-search"></i>`; searchBtn.onclick=()=>{showSearch=!showSearch;render();};
        la.appendChild(profBtn); la.appendChild(darkBtn); la.appendChild(searchBtn);

        // Logo
        const logo = el('div','header-logo');
        logo.innerHTML=`<div class="bag-icon"><i class="fas fa-shopping-bag"></i></div> VICKS MARKET`;

        h.appendChild(la);
        h.appendChild(logo);
        return h;
    }

    function toggleDark() {
        const d = document.body.classList.toggle('dark');
        localStorage.setItem(THEME_KEY, d?'dark':'light');
    }

    // ===================== SEARCH BAR =====================
    function buildSearchBar() {
        const d = el('div','search-bar');
        const w = el('div','search-wrap');
        const searchIcon = el('i','fas fa-search'); searchIcon.style.color='var(--text-sub)';
        const inp = el('input'); inp.placeholder='ابحث عن منتج...'; inp.value=searchQ;
        inp.oninput = e=>{searchQ=e.target.value; render();};
        const clearBtn = el('button','icon-btn'); clearBtn.innerHTML='<i class="fas fa-times"></i>'; clearBtn.style.cssText='width:28px;height:28px;font-size:.8rem;flex-shrink:0;'; clearBtn.onclick=()=>{searchQ='';render();};
        w.appendChild(searchIcon); w.appendChild(inp); w.appendChild(clearBtn);
        d.appendChild(w);
        setTimeout(()=>inp.focus(),50);
        return d;
    }

    // ===================== CATEGORY BAR =====================
    function buildCatBar() {
        const cats = [
            {k:'all', l:'الكل 🛒'}, {k:'used', l:'مستعمل 🏷️'}, {k:'supermarket', l:'سوبر ماركت 🛍️'},
            {k:'beauty', l:'جمال وعناية 🌿'}, {k:'electronics', l:'إلكترونيات 📱'},
            {k:'games', l:'ألعاب 🎮'}, {k:'accessories', l:'اكسسوار ⌚'}, {k:'home', l:'المنزل 🏠'}
        ];
        const bar = el('div','cat-scroll');
        cats.forEach(c=>{
            const chip = txt('div','cat-chip'+(c.k===activeCat?' active':''), c.l);
            chip.onclick=()=>{activeCat=c.k;render();};
            bar.appendChild(chip);
        });
        return bar;
    }

    // ===================== VIEW BAR =====================
    function buildViewBar() {
        const bar = el('div','view-bar');
        const tog = el('div','view-toggle');
        const lBtn = el('button','view-btn'+(viewMode==='list'?' active':'')); lBtn.innerHTML='<i class="fas fa-list"></i>'; lBtn.onclick=()=>{viewMode='list';render();};
        const gBtn = el('button','view-btn'+(viewMode==='grid'?' active':'')); gBtn.innerHTML='<i class="fas fa-grip-vertical"></i>'; gBtn.onclick=()=>{viewMode='grid';render();};
        tog.appendChild(lBtn); tog.appendChild(gBtn);
        const spacer = el('div','view-bar-spacer');
        const vipBtn = el('button','vip-quick-btn'); vipBtn.innerHTML='<i class="fas fa-crown"></i> VIP'; vipBtn.onclick=()=>{page='vip';render();};
        const offBtn = el('button','offers-quick-btn'); offBtn.innerHTML='<i class="fas fa-tag"></i> عروض'; offBtn.onclick=()=>{page='offers';render();};
        bar.appendChild(tog); bar.appendChild(spacer); bar.appendChild(vipBtn); bar.appendChild(offBtn);
        return bar;
    }

    // ===================== PRODUCTS CONTENT =====================
    function buildProductsContent() {
        const wrap = el('div','content-scroll');
        let prods = Object.values(S.products);
        if(activeCat==='used') prods=prods.filter(p=>p.condition==='used');
        else if(activeCat!=='all') prods=prods.filter(p=>p.category===activeCat);
        if(searchQ.trim()) { const q=searchQ.toLowerCase(); prods=prods.filter(p=>p.name.toLowerCase().includes(q)||p.category.toLowerCase().includes(q)); }
        // priority first
        prods.sort((a,b)=>priorityProducts.includes(b.id)?1:priorityProducts.includes(a.id)?-1:0);

        if(!prods.length) {
            const es=el('div','empty-state'); es.innerHTML='<div class="empty-icon">🔍</div><p>لم يتم العثور على منتجات</p>'; wrap.appendChild(es); return wrap;
        }
        const grid = el('div', viewMode==='grid'?'product-grid':'product-list');
        prods.forEach(p=>{ grid.appendChild(buildProductCard(p)); });
        wrap.appendChild(grid);
        return wrap;
    }

    // ===================== PRODUCT CARD =====================
    function buildProductCard(prod) {
        const seller = S.sellers[prod.sellerId]||{};
        const liked = isLiked(prod.id);
        const isOffer = offerProducts.includes(prod.id);

        const card = el('div','product-card '+(viewMode==='list'?'list-mode':'grid-mode'));
        card.onclick=(e)=>{ if(e.target.closest('.act-btn'))return; selectedProduct=prod.id; page='detail'; render(); };

        // Image
        const imgDiv = el('div','prod-img');
        imgDiv.textContent = prod.emoji||'📦';
        if(prod.condition==='used') { const b=txt('span','cond-badge','استعمال'); imgDiv.appendChild(b); }
        if(isOffer) { const ob=txt('span','cond-badge','عرض'); ob.style.right='auto'; ob.style.left='7px'; ob.style.background='#22c55e'; imgDiv.appendChild(ob); }
        card.appendChild(imgDiv);

        // Body
        const body = el('div','card-body');
        body.appendChild(txt('div','prod-name', prod.name));

        // Price
        const priceWrap = el('div','prod-price-wrap');
        if(prod.oldPrice) { const op=txt('span','prod-old-price',prod.oldPrice.toLocaleString()+' ج.م'); priceWrap.appendChild(op); }
        priceWrap.appendChild(txt('span','prod-price',prod.price.toLocaleString()+' ج.م'));
        body.appendChild(priceWrap);

        // Actions
        const actions = el('div','card-actions');
        // Like
        const likeBtn = el('button','act-btn act-like'+(liked?' liked':''));
        likeBtn.innerHTML=`<i class="${liked?'fas':'far'} fa-heart"></i>`;
        likeBtn.onclick=e=>{ e.stopPropagation(); toggleLike(prod.id); render(); };
        // Comments
        const chatBtn = el('button','act-btn act-chat');
        chatBtn.innerHTML='<i class="far fa-comment"></i>';
        chatBtn.onclick=e=>{ e.stopPropagation(); selectedProduct=prod.id; showComments(prod); };
        // Telegram
        const tgBtn = el('button','act-btn act-tg');
        tgBtn.innerHTML='<i class="fab fa-telegram-plane"></i>';
        tgBtn.onclick=e=>{ e.stopPropagation(); window.open('https://t.me/vicks_market','_blank'); };
        // Whatsapp
        const waBtn = el('button','act-btn act-wa');
        waBtn.innerHTML='<i class="fab fa-whatsapp"></i>';
        waBtn.onclick=e=>{ e.stopPropagation(); window.open('https://wa.me/'+(seller.phone||'').replace(/\D/g,''),'_blank'); };
        actions.appendChild(likeBtn); actions.appendChild(chatBtn); actions.appendChild(tgBtn); actions.appendChild(waBtn);
        body.appendChild(actions);

        // Store row
        const storeRow = el('div','store-row');
        const av = el('div','store-avatar-sm'); av.textContent=(seller.emoji||'م');
        const sn = txt('span','store-name-sm', seller.storeName||'متجر');
        const stars = el('div','stars-sm');
        for(let i=1;i<=5;i++){ const s=el('i',i<=prod.rating?'fas fa-star':'far fa-star'); stars.appendChild(s); }
        storeRow.appendChild(av); storeRow.appendChild(sn); storeRow.appendChild(stars);
        body.appendChild(storeRow);

        card.appendChild(body);
        return card;
    }

    // ===================== PRODUCT DETAIL =====================
    function buildDetail() {
        const prod = S.products[selectedProduct];
        if(!prod) { page='home'; render(); return el('div'); }
        const seller = S.sellers[prod.sellerId]||{};
        const liked = isLiked(prod.id);

        const page_el = el('div','fullscreen');
        const ph = el('div','page-header');
        const back = el('button','back-btn'); back.innerHTML='<i class="fas fa-arrow-right"></i>'; back.onclick=()=>{page='home';render();};
        const t = txt('div','page-title', prod.name);
        const likeH = el('button','icon-btn'); likeH.innerHTML=`<i class="${liked?'fas':'far'} fa-heart" style="color:${liked?'#ef4444':''}"></i>`; likeH.onclick=()=>{ toggleLike(prod.id); render(); };
        ph.appendChild(back); ph.appendChild(t); ph.appendChild(likeH);
        page_el.appendChild(ph);

        const body = el('div'); body.style.cssText='flex:1;overflow-y:auto;display:flex;flex-direction:column;';
        const img = el('div','detail-img'); img.textContent=prod.emoji;
        if(prod.condition==='used') { const b=txt('span','cond-badge','استعمال'); img.appendChild(b); }
        body.appendChild(img);

        const content = el('div','detail-body');
        content.appendChild(txt('div','detail-name',prod.name));
        const priceRow = el('div'); priceRow.style.cssText='display:flex;align-items:center;gap:10px;flex-wrap:wrap;';
        content.appendChild(priceRow);
        const dp = txt('div','detail-price', prod.price.toLocaleString()+' ج.م');
        priceRow.appendChild(dp);
        if(prod.oldPrice){ const op=txt('span','prod-old-price',prod.oldPrice.toLocaleString()+' ج.م'); priceRow.appendChild(op); }

        // Stars
        const starsD = el('div','stars-sm'); starsD.style.cssText='display:flex;gap:2px;direction:ltr;';
        for(let i=1;i<=5;i++){ const s=el('i',i<=prod.rating?'fas fa-star':'far fa-star'); s.style.fontSize='.9rem'; starsD.appendChild(s); }
        content.appendChild(starsD);

        // Seller card
        const sc = el('div','detail-store-card');
        const sav = el('div'); sav.style.cssText='width:42px;height:42px;border-radius:50%;background:var(--orange);display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0;';
        sav.textContent=seller.emoji||'🏪';
        const sinfo = el('div'); sinfo.style.cssText='display:flex;flex-direction:column;gap:2px;flex:1;min-width:0;';
        const sname = txt('div','',seller.storeName||'المتجر'); sname.style.cssText='font-weight:700;font-size:.9rem;color:var(--text-main);';
        const sowner = txt('div','',seller.ownerName||'البائع'); sowner.style.cssText='font-size:.78rem;color:var(--text-sub);';
        if(seller.verifiedBadge){ const vb=el('i','fas fa-circle-check'); vb.style.color='#1d9bf0'; sname.appendChild(vb); }
        sinfo.appendChild(sname); sinfo.appendChild(sowner);
        sc.appendChild(sav); sc.appendChild(sinfo);
        content.appendChild(sc);

        if(prod.description) content.appendChild(txt('p','detail-desc',prod.description));

        // Action buttons
        const acts = el('div','detail-actions');
        const waA = el('button','det-act-btn det-wa'); waA.innerHTML='<i class="fab fa-whatsapp"></i> واتساب'; waA.onclick=()=>window.open('https://wa.me/'+(seller.phone||'').replace(/\D/g,''),'_blank');
        const tgA = el('button','det-act-btn det-tg'); tgA.innerHTML='<i class="fab fa-telegram-plane"></i> تيليجرام'; tgA.onclick=()=>window.open('https://t.me/vicks_market','_blank');
        acts.appendChild(waA); acts.appendChild(tgA);
        content.appendChild(acts);

        // Comments
        const cmTitle = txt('div','','التعليقات'); cmTitle.style.cssText='font-weight:700;font-size:.9rem;border-right:3px solid var(--orange);padding-right:8px;';
        content.appendChild(cmTitle);
        const cmList = el('div'); cmList.style.cssText='display:flex;flex-direction:column;gap:6px;';
        (prod.comments||[]).forEach(c=>{ const cb=txt('div','comment-bub',c); cmList.appendChild(cb); });
        content.appendChild(cmList);

        body.appendChild(content);

        return page_el;

    // ===================== COMMENTS OVERLAY =====================
    function showComments(prod) {
        const existing = document.getElementById('comments-overlay');
        if(existing) existing.remove();
        const overlay = el('div','overlay-bg'); overlay.id='comments-overlay';
        overlay.onclick=e=>{ if(e.target===overlay)overlay.remove(); };
        const sheet = el('div','sheet');
        const sh = el('div','sheet-header');
        sh.appendChild(txt('div','sheet-title','التعليقات ('+prod.name+')'));
        const closeBtn = el('button','icon-btn'); closeBtn.innerHTML='<i class="fas fa-times"></i>'; closeBtn.style.cssText='width:28px;height:28px;font-size:.8rem;'; closeBtn.onclick=()=>overlay.remove();
        sh.appendChild(closeBtn); sheet.appendChild(sh);
        const list = el('div','comments-list');
        (prod.comments||[]).forEach(c=>{ list.appendChild(txt('div','comment-bub',c)); });
        sheet.appendChild(list);
        const inputRow = el('div','comment-input-row');
        const inp = el('input'); inp.placeholder='أضف تعليقاً...';
        const sendBtn = el('button','chat-send-btn'); sendBtn.innerHTML='<i class="fas fa-paper-plane"></i>';
        sendBtn.onclick=()=>{
            const t=inp.value.trim(); if(!t)return;
            prod.comments = prod.comments||[];
            prod.comments.push(t); save(); inp.value='';
            const nb=txt('div','comment-bub',t); list.appendChild(nb); list.scrollTop=list.scrollHeight;
            showToast('تم إضافة التعليق');
        };
        inputRow.appendChild(inp); inputRow.appendChild(sendBtn);
        sheet.appendChild(inputRow); overlay.appendChild(sheet);
        document.body.appendChild(overlay);
    }
