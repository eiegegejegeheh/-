<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>VICKS MARKET | منصة تجارة عالمية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #f9fafb;
            transition: background-color 0.2s, color 0.2s;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        body.dark {
            background-color: #000000;
        }
        body.dark .bg-white {
            background-color: #121212 !important;
        }
        body.dark .bg-gray-50, body.dark .bg-gray-100 {
            background-color: #1e1e1e !important;
        }
        body.dark .text-gray-800, body.dark .text-gray-600, body.dark .text-gray-500,
        body.dark .text-blue-600, body.dark span, body.dark p, body.dark h1, body.dark h2, body.dark h3,
        body.dark .product-name, body.dark .seller-name, body.dark .price {
            color: #ff6600 !important;
        }
        body.dark .border, body.dark .border-gray-100, body.dark .border-t {
            border-color: #ff6600 !important;
            border-width: 0.5px;
        }
        .chat-watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2.5rem;
            font-weight: bold;
            opacity: 0.08;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 8px;
            pointer-events: none;
            z-index: 5;
        }
        body.dark .chat-watermark {
            opacity: 0.12;
            color: #ff6600;
        }
        .chat-input-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: white;
            border-top: 1px solid #e5e7eb;
            padding: 10px 12px;
            display: flex;
            gap: 10px;
            align-items: center;
            z-index: 20;
        }
        body.dark .chat-input-bar {
            background-color: #121212;
            border-top-color: #ff6600;
        }
        .chat-input {
            flex: 1;
            padding: 10px 16px;
            border-radius: 28px;
            background-color: #f3f4f6;
            border: none;
            font-size: 0.95rem;
            outline: none;
        }
        body.dark .chat-input {
            background-color: #2a2a2a;
            color: #ff6600;
        }
        .chat-icon-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f3f4f6;
            color: #4b5563;
            transition: 0.2s;
            cursor: pointer;
        }
        body.dark .chat-icon-btn {
            background-color: #2a2a2a;
            color: #ff6600;
        }
        .send-btn {
            background-color: #ff6600;
            color: white;
        }
        body.dark .send-btn {
            background-color: #ff6600;
            color: #000000;
        }
        .message-bubble-user {
            background-color: #ff6600;
            color: white;
            border-radius: 20px 20px 4px 20px;
        }
        .message-bubble-bot {
            background-color: #e5e7eb;
            color: #1f2937;
            border-radius: 20px 20px 20px 4px;
        }
        body.dark .message-bubble-bot {
            background-color: #2a2a2a;
            color: #ff6600;
        }
        .messages-container {
            overflow-y: auto;
            padding: 16px 12px;
            padding-bottom: 85px;
        }
        .product-actions {
            display: flex;
            gap: 4px;
        }
        .product-actions button {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f3f4f6;
        }
        .seller-avatar-mini {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background-color: #e5e7eb;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
        }
        .verified-badge {
            color: #3b82f6;
            font-size: 10px;
            margin-right: 2px;
        }
        body.dark .verified-badge {
            color: #3b82f6;
        }
    </style>
</head>
<body class="bg-gray-50 font-sans antialiased">
    <div id="root"></div>

    <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>

    <script type="text/babel" data-presets="react,typescript">
        const { useState, useEffect, useRef } = React;

        // ---------- بيانات ثابتة ----------
        const STORAGE_KEY = 'vicks_market_final_v2';
        const THEME_KEY = 'vicks_theme_v2';
        const ADMIN_EMAIL = 'mom1113694362@gmail.com';
        const ADMIN_PASS = 'momMOM2023#';
        const ADMIN_ID = '10000000000';
        function genId() { return Math.random().toString(36).slice(2) + Date.now().toString(36); }

        const initialSellers = {
            admin: {
                id: ADMIN_ID, email: ADMIN_EMAIL, password: ADMIN_PASS,
                storeName: 'VICKS MARKET', ownerName: 'محمد المالك', phone: '01113694362',
                points: 50000, verified: true, subscription: 'platinum', products: [],
                createdAt: Date.now(), country: 'مصر', isAdmin: true, avatar: '👑', verificationBadge: true
            },
            s1: {
                id: 's1', email: 'seller1@test.com', password: '123456',
                storeName: 'متجر النور', ownerName: 'أحمد', phone: '01012345678',
                points: 350, verified: true, subscription: 'silver', products: [],
                country: 'مصر', isAdmin: false, avatar: '🌟', verificationBadge: true
            },
            s2: {
                id: 's2', email: 'seller2@test.com', password: '123456',
                storeName: 'سوبر ماركت الفرح', ownerName: 'فاطمة', phone: '01198765432',
                points: 120, verified: false, subscription: 'free', products: [],
                country: 'السعودية', isAdmin: false, avatar: '🛒', verificationBadge: false
            }
        };

        const productNames = ['ايفون 14 Pro', 'زيت زيتون', 'شاشة سامسونج', 'بلاي ستيشن 5', 'لاب توب ديل', 'عطر فاخر', 'ساعة ذكية', 'سماعة لاسلكية'];
        const emojis = ['📱', '🫒', '📺', '🎮', '💻', '🧴', '⌚', '🎧'];
        const initialProducts = {};
        for (let i = 1; i <= 12; i++) {
            const sellerId = i % 2 === 0 ? 's2' : 's1';
            initialProducts[`p${i}`] = {
                id: `p${i}`,
                name: productNames[i % productNames.length] + (i > 6 ? ` ${i}` : ''),
                price: 100 + i * 45,
                category: i % 3 === 0 ? 'electronics' : (i % 2 === 0 ? 'fashion' : 'home'),
                emoji: emojis[i % emojis.length],
                sellerId,
                sellerName: sellerId === 's1' ? 'متجر النور' : 'سوبر ماركت الفرح',
                sellerCountry: sellerId === 's1' ? 'مصر' : 'السعودية',
                likes: (i * 7) % 19,
                likedBy: [],
                description: `وصف المنتج ${i}`,
                createdAt: Date.now() - i * 86400000,
                vip: false,
                comments: [],
                rating: i % 5
            };
        }
        initialSellers.s1.products = Object.keys(initialProducts).filter(id => initialProducts[id].sellerId === 's1');
        initialSellers.s2.products = Object.keys(initialProducts).filter(id => initialProducts[id].sellerId === 's2');

        function getInitialState() {
            return {
                sellers: JSON.parse(JSON.stringify(initialSellers)),
                products: JSON.parse(JSON.stringify(initialProducts)),
                currentSellerId: null,
                chatMessages: [{ id: '1', role: 'bot', text: 'أهلاً بك في VICKS MARKET! كيف أستطيع مساعدتك اليوم؟', ts: Date.now() }]
            };
        }

        function loadState() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (!raw) return getInitialState();
                const p = JSON.parse(raw);
                return (p && p.sellers && p.products) ? p : getInitialState();
            } catch { return getInitialState(); }
        }
        function saveState(s) { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); }
        function createSeller(data) {
            return { id: 's_' + genId(), ...data, points: 0, verified: false, subscription: 'free', products: [], createdAt: Date.now(), isAdmin: false, verificationBadge: false, avatar: '🛍️' };
        }
        function createProduct(data) {
            return { id: 'p_' + genId(), ...data, likes: 0, likedBy: [], createdAt: Date.now(), vip: false, comments: [], rating: 0 };
        }
        function addMessage(state, msg) { return { ...state, chatMessages: [...state.chatMessages, { ...msg, id: genId(), ts: Date.now() }] }; }
        function botReply(txt) {
            const m = txt.toLowerCase();
            if (m.includes('سعر')) return 'يمكنك الاطلاع على الأسعار في الصفحة الرئيسية.';
            if (m.includes('بائع')) return 'للانضمام كبائع: اضغط أيقونة المستخدم ثم "انضم كتاجر جديد".';
            if (m.includes('نقاط')) return 'يمكنك شراء النقاط من صفحة المتجر (حسابي ← المتجر والنقاط).';
            return 'شكراً لتواصلك! كيف يمكنني مساعدتك اليوم؟';
        }

        // ---------- مكونات الواجهة ----------
        function ChatPage({ messages, onSend, onBack }) {
            const [input, setInput] = useState('');
            const fileRef = useRef(null);
            const camRef = useRef(null);
            const endRef = useRef(null);

            const send = () => {
                if (input.trim()) { onSend(input.trim()); setInput(''); }
            };
            useEffect(() => { endRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [messages]);

            return (
                <div className="flex flex-col h-full relative bg-gray-50" style={{ height: '100vh', overflow: 'hidden' }}>
                    <div className="flex items-center p-4 border-b bg-white z-10">
                        <button onClick={onBack} className="hover:text-orange-500 ml-2"><i className="fas fa-arrow-right text-lg"></i></button>
                        <h1 className="flex-1 text-center font-bold text-lg"><i className="fas fa-robot text-orange-500 ml-2"></i> VICKS AI</h1>
                    </div>
                    <div className="chat-watermark">
                        <i className="fas fa-robot text-4xl"></i>
                        <span className="text-3xl font-bold">VICKS AI</span>
                    </div>
                    <div className="messages-container flex-1">
                        {messages.map(msg => (
                            <div key={msg.id} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'} mb-3`}>
                                <div className={`max-w-[75%] p-3 text-sm ${msg.role === 'user' ? 'message-bubble-user' : 'message-bubble-bot'}`}>
                                    {msg.text}
                                </div>
                            </div>
                        ))}
                        <div ref={endRef} />
                    </div>
                    <div className="chat-input-bar">
                        <div className="flex gap-2">
                            <button onClick={() => fileRef.current.click()} className="chat-icon-btn"><i className="fas fa-plus text-lg"></i></button>
                            <button onClick={() => camRef.current.click()} className="chat-icon-btn"><i className="fas fa-camera text-lg"></i></button>
                        </div>
                        <input
                            type="text"
                            className="chat-input"
                            placeholder="هيا نتحدث.."
                            value={input}
                            onChange={e => setInput(e.target.value)}
                            onKeyDown={e => e.key === 'Enter' && send()}
                        />
                        <button onClick={send} className="chat-icon-btn send-btn"><i className="fas fa-paper-plane text-lg"></i></button>
                        <input ref={fileRef} type="file" className="hidden" onChange={()=>{}} />
                        <input ref={camRef} type="file" capture="environment" className="hidden" onChange={()=>{}} />
                    </div>
                </div>
            );
        }

        function ProductCard({ prod, liked, onLike, onWhats, onClick, onComment, onRate, sellerAvatar, sellerVerification, onSellerClick, isList }) {
            const stars = Array(5).fill(0).map((_, i) =>
                <i key={i} className={`fas fa-star ${i < prod.rating ? 'text-yellow-400' : 'text-gray-300'} text-xs cursor-pointer`}
                   onClick={(e) => { e.stopPropagation(); onRate(i+1); }}></i>
            );
            const shortName = prod.sellerName.length > 12 ? prod.sellerName.slice(0,10)+'..' : prod.sellerName;

            if (isList) {
                return (
                    <div onClick={onClick} className="flex gap-3 p-3 bg-white rounded-xl border mb-2 cursor-pointer">
                        <div className="w-12 h-12 bg-gray-100 rounded-xl flex items-center justify-center text-3xl">{prod.emoji}</div>
                        <div className="flex-1">
                            <div className="font-semibold">{prod.name}</div>
                            <p className="text-blue-600 font-bold">{prod.price.toLocaleString()} ج.م</p>
                            <div className="flex items-center gap-1 mt-1">
                                <button onClick={(e)=>{e.stopPropagation(); onSellerClick();}} className="flex items-center gap-1">
                                    <span className="w-5 h-5 rounded-full bg-gray-200 flex items-center justify-center text-[10px]">{sellerAvatar || '🏪'}</span>
                                    <span className="text-[10px] text-gray-600">{shortName}</span>
                                    {sellerVerification && <i className="fas fa-check-circle verified-badge"></i>}
                                </button>
                                <div className="flex gap-1">{stars}</div>
                            </div>
                        </div>
                        <div className="flex gap-1">
                            <button onClick={(e)=>{e.stopPropagation(); onLike();}} className={`p-1 rounded-full ${liked?'bg-orange-500 text-white':'bg-gray-100'}`}><i className="fas fa-heart text-xs"></i></button>
                            <button onClick={(e)=>{e.stopPropagation(); onWhats();}} className="p-1 rounded-full bg-green-100"><i className="fab fa-whatsapp text-xs"></i></button>
                            <button onClick={(e)=>{e.stopPropagation(); onComment();}} className="p-1 rounded-full bg-blue-100"><i className="fas fa-comment text-xs"></i></button>
                        </div>
                    </div>
                );
            }
            return (
                <div onClick={onClick} className="p-2 bg-white rounded-xl border shadow-sm cursor-pointer w-[145px] flex-shrink-0">
                    <div className="h-20 flex items-center justify-center bg-gray-50 rounded-xl text-4xl">{prod.emoji}</div>
                    <h3 className="font-semibold text-xs mt-1">{prod.name}</h3>
                    <p className="text-blue-600 font-bold text-xs">{prod.price.toLocaleString()} ج.م</p>
                    <div className="flex justify-between items-center mt-1">
                        <button onClick={(e)=>{e.stopPropagation(); onSellerClick();}} className="flex items-center gap-1">
                            <span className="w-4 h-4 rounded-full bg-gray-200 flex items-center justify-center text-[8px]">{sellerAvatar || '🏪'}</span>
                            <span className="text-[8px] text-gray-500 max-w-[55px] truncate">{shortName}</span>
                            {sellerVerification && <i className="fas fa-check-circle verified-badge"></i>}
                        </button>
                        <div className="flex gap-1">
                            <button onClick={(e)=>{e.stopPropagation(); onLike();}} className={`p-1 rounded-full ${liked?'bg-orange-500 text-white':'bg-gray-100'}`}><i className="fas fa-heart text-[8px]"></i></button>
                            <button onClick={(e)=>{e.stopPropagation(); onWhats();}} className="p-1 rounded-full bg-green-100"><i className="fab fa-whatsapp text-[8px]"></i></button>
                            <button onClick={(e)=>{e.stopPropagation(); onComment();}} className="p-1 rounded-full bg-blue-100"><i className="fas fa-comment text-[8px]"></i></button>
                        </div>
                    </div>
                    <div className="flex justify-center gap-0.5 mt-1">{stars}</div>
                </div>
            );
        }

        function HomePage({ products, sellers, currSellerId, onLike, onWhats, onProductClick, onShowOffers, onShowVIP, onComment, onRate, onSellerProfile }) {
            const [view, setView] = useState('grid');
            const [cat, setCat] = useState('all');
            const filtered = Object.values(products).filter(p => cat === 'all' || p.category === cat);
            const isLiked = (p) => currSellerId ? p.likedBy.includes(currSellerId) : false;
            const half = Math.ceil(filtered.length / 2);
            const row1 = filtered.slice(0, half), row2 = filtered.slice(half);

            return (
                <div className="flex flex-col h-full">
                    <div className="sticky top-0 z-10 bg-white border-b px-2 py-1 overflow-x-auto">
                        <div className="flex gap-2">
                            {[{id:'all',label:'الجميع'},{id:'electronics',label:'إلكترونيات'},{id:'fashion',label:'موضة'},{id:'home',label:'منزل'}].map(c =>
                                <button key={c.id} onClick={() => setCat(c.id)} className={`px-3 py-1.5 rounded-full text-xs ${cat===c.id?'bg-orange-500 text-white':'bg-gray-100'}`}>{c.label}</button>
                            )}
                        </div>
                    </div>
                    <div className="flex items-center gap-3 px-3 py-2 bg-white border-b">
                        <button onClick={onShowOffers} className="text-xs bg-orange-50 text-orange-600 px-3 py-1.5 rounded-xl">🎁 عروض</button>
                        <button onClick={onShowVIP} className="text-xs bg-yellow-50 text-yellow-700 px-3 py-1.5 rounded-xl">👑 VIP</button>
                        <div className="flex-1"></div>
                        <button onClick={() => setView('grid')} className={`p-1.5 rounded-lg ${view==='grid'?'bg-orange-500 text-white':'bg-gray-100'}`}><i className="fas fa-th"></i></button>
                        <button onClick={() => setView('list')} className={`p-1.5 rounded-lg ${view==='list'?'bg-orange-500 text-white':'bg-gray-100'}`}><i className="fas fa-list-ul"></i></button>
                    </div>
                    <div className="flex-1 overflow-auto p-2">
                        {filtered.length === 0 && <div className="text-center py-12 text-gray-400">لا توجد منتجات</div>}
                        {view === 'grid' && (
                            <div className="space-y-2">
                                {row1.length > 0 && <div className="flex gap-2 overflow-x-auto pb-1">{row1.map(p => {
                                    const s = sellers[p.sellerId];
                                    return <ProductCard key={p.id} prod={p} liked={isLiked(p)} onLike={()=>onLike(p.id)} onWhats={()=>onWhats(p)} onClick={()=>onProductClick(p)} onComment={()=>onComment(p.id)} onRate={(r)=>onRate(p.id,r)} sellerAvatar={s?.avatar} sellerVerification={s?.verificationBadge} onSellerClick={()=>onSellerProfile(p.sellerId)} isList={false}/>
                                })}</div>}
                                {row2.length > 0 && <div className="flex gap-2 overflow-x-auto pb-1">{row2.map(p => {
                                    const s = sellers[p.sellerId];
                                    return <ProductCard key={p.id} prod={p} liked={isLiked(p)} onLike={()=>onLike(p.id)} onWhats={()=>onWhats(p)} onClick={()=>onProductClick(p)} onComment={()=>onComment(p.id)} onRate={(r)=>onRate(p.id,r)} sellerAvatar={s?.avatar} sellerVerification={s?.verificationBadge} onSellerClick={()=>onSellerProfile(p.sellerId)} isList={false}/>
                                })}</div>}
                            </div>
                        )}
                        {view === 'list' && (
                            <div className="flex flex-col gap-2">{filtered.map(p => {
                                const s = sellers[p.sellerId];
                                return <ProductCard key={p.id} prod={p} liked={isLiked(p)} onLike={()=>onLike(p.id)} onWhats={()=>onWhats(p)} onClick={()=>onProductClick(p)} onComment={()=>onComment(p.id)} onRate={(r)=>onRate(p.id,r)} sellerAvatar={s?.avatar} sellerVerification={s?.verificationBadge} onSellerClick={()=>onSellerProfile(p.sellerId)} isList={true}/>
                            })}</div>
                        )}
                    </div>
                </div>
            );
        }

        function LoginPage({ sellers, onLogin, onGoJoin, onBack }) {
            const [email, setEmail] = useState(''); const [pass, setPass] = useState(''); const [err, setErr] = useState('');
            const doLogin = () => {
                const em = email.trim(), pw = pass.trim();
                if (em === ADMIN_EMAIL && pw === ADMIN_PASS) {
                    const a = Object.values(sellers).find(s => s.email === ADMIN_EMAIL);
                    if (a) { onLogin(a); return; }
                }
                const s = Object.values(sellers).find(s => s.email === em && s.password === pw);
                if (s) onLogin(s); else setErr('بيانات غير صحيحة');
            };
            return (
                <div className="flex flex-col h-full bg-white">
                    <div className="flex items-center p-4 border-b"><button onClick={onBack}><i className="fas fa-arrow-right ml-2"></i> رجوع</button><h1 className="flex-1 text-center font-bold">تسجيل الدخول</h1></div>
                    <div className="p-6 space-y-4">
                        {err && <div className="bg-red-50 p-2 rounded-xl text-red-600 text-sm">{err}</div>}
                        <input className="w-full p-3 bg-gray-100 rounded-xl" placeholder="البريد" value={email} onChange={e=>setEmail(e.target.value)} />
                        <input type="password" className="w-full p-3 bg-gray-100 rounded-xl" placeholder="كلمة المرور" value={pass} onChange={e=>setPass(e.target.value)} onKeyDown={e=>e.key==='Enter'&&doLogin()} />
                        <button onClick={doLogin} className="w-full py-3 bg-orange-500 text-white rounded-xl">دخول</button>
                        <div className="text-center text-gray-400">أو</div>
                        <button onClick={onGoJoin} className="w-full py-3 border rounded-xl">انضم كتاجر جديد</button>
                    </div>
                </div>
            );
        }

        function JoinPage({ sellers, onRegister, onBack }) {
            const [form, setForm] = useState({ ownerName: '', phone: '', email: '', password: '', country: 'مصر' });
            const [err, setErr] = useState(''); const [otpSent, setOtpSent] = useState(false); const [otpCode, setOtpCode] = useState(''); const [userOtp, setUserOtp] = useState('');
            const sendOtp = () => {
                if (!form.email.trim()) { setErr('أدخل البريد'); return; }
                const code = Math.floor(100000 + Math.random() * 900000).toString();
                setOtpCode(code); setOtpSent(true); alert(`كود التفعيل: ${code}`);
            };
            const register = () => {
                if (!otpSent) { setErr('فعّل البريد'); return; }
                if (userOtp !== otpCode) { setErr('كود خاطئ'); return; }
                if (!form.ownerName.trim() || !form.phone.trim() || !form.email.trim() || !form.password.trim()) { setErr('جميع الحقول مطلوبة'); return; }
                if (Object.values(sellers).some(s => s.email === form.email.trim())) { setErr('البريد مستخدم'); return; }
                onRegister(createSeller({ ...form, storeName: form.ownerName + ' Store' }));
            };
            return (
                <div className="flex flex-col h-full bg-white">
                    <div className="flex p-4 border-b"><button onClick={onBack}><i className="fas fa-arrow-right ml-2"></i> رجوع</button><h1 className="flex-1 text-center font-bold">انضم كتاجر</h1></div>
                    <div className="p-4 overflow-auto space-y-3">
                        {err && <div className="bg-red-50 p-2 rounded-xl text-red-600 text-xs">{err}</div>}
                        <input placeholder="الاسم" className="w-full p-2 bg-gray-100 rounded-xl" value={form.ownerName} onChange={e=>setForm({...form,ownerName:e.target.value})} />
                        <input placeholder="الهاتف" className="w-full p-2 bg-gray-100 rounded-xl" value={form.phone} onChange={e=>setForm({...form,phone:e.target.value})} />
                        <div className="flex gap-2">
                            <input placeholder="البريد" className="flex-1 p-2 bg-gray-100 rounded-xl" value={form.email} onChange={e=>setForm({...form,email:e.target.value})} />
                            <button onClick={sendOtp} className="px-3 bg-orange-500 text-white rounded-xl text-xs">إرسال كود</button>
                        </div>
                        {otpSent && <input placeholder="الكود" className="w-full p-2 bg-gray-100 rounded-xl" value={userOtp} onChange={e=>setUserOtp(e.target.value)} />}
                        <input type="password" placeholder="كلمة المرور" className="w-full p-2 bg-gray-100 rounded-xl" value={form.password} onChange={e=>setForm({...form,password:e.target.value})} />
                        <select className="w-full p-2 bg-gray-100 rounded-xl" value={form.country} onChange={e=>setForm({...form,country:e.target.value})}>
                            <option>مصر</option><option>السعودية</option>
                        </select>
                        <button onClick={register} className="w-full py-2 bg-orange-500 text-white rounded-xl font-bold">تسجيل</button>
                    </div>
                </div>
            );
        }

        function SellerDashboard({ seller, products, onGoStore, onGoChat, onAddProduct, onEditProduct, onDeleteProduct, onLogout, onBack }) {
            const myProds = seller.products.map(pid => products[pid]).filter(p => p);
            return (
                <div className="flex flex-col h-full">
                    <div className="flex items-center p-3 border-b"><button onClick={onBack}><i className="fas fa-arrow-right ml-2"></i></button><h1 className="flex-1 text-center font-bold text-sm">{seller.storeName}</h1><button onClick={onLogout} className="text-red-500"><i className="fas fa-sign-out-alt"></i></button></div>
                    <div className="p-3 grid grid-cols-2 gap-2">
                        <button onClick={onGoStore} className="bg-indigo-50 p-2 rounded-xl text-xs">🏪 المتجر والنقاط</button>
                        <button onClick={onGoChat} className="bg-green-50 p-2 rounded-xl text-xs">💬 الدعم الذكي</button>
                        <button onClick={onAddProduct} className="bg-blue-50 p-2 rounded-xl text-xs">➕ إضافة منتج</button>
                    </div>
                    <div className="px-3 text-xs font-semibold">منتجاتي ({myProds.length})</div>
                    <div className="flex-1 overflow-auto p-3 space-y-2">
                        {myProds.map(p => (
                            <div key={p.id} className="flex gap-2 p-2 bg-white rounded-xl border text-xs">
                                <div className="text-2xl">{p.emoji}</div>
                                <div className="flex-1"><div>{p.name}</div><div className="text-blue-600">{p.price} ج.م</div></div>
                                <button onClick={()=>onEditProduct(p)}><i className="fas fa-edit"></i></button>
                                <button onClick={()=>onDeleteProduct(p.id)}><i className="fas fa-trash-alt text-red-500"></i></button>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function StorePoints({ seller, onBack, onPurchase }) {
            const buy = (pts, cost) => { if (confirm(`شراء ${pts} نقطة بـ ${cost} ج.م`)) onPurchase('points', cost, pts); };
            const verify = () => { if (confirm('شراء توثيق 150 ج.م')) onPurchase('verify', 150); };
            return (
                <div className="p-4">
                    <button onClick={onBack}><i className="fas fa-arrow-right ml-2"></i> رجوع</button>
                    <div className="bg-white rounded-2xl p-4 text-center mt-3">
                        <div className="text-3xl">⭐ {seller.points} نقطة</div>
                        <div className="text-xs">{seller.verified ? '✓ موثق' : 'غير موثق'}</div>
                        <div className="mb-2 text-xs">الباقة: {seller.subscription}</div>
                        <div className="space-y-2">
                            <button onClick={() => buy(100, 30)} className="w-full py-2 bg-amber-500 rounded-xl text-sm">100 نقطة - 30 ج.م</button>
                            <button onClick={() => buy(500, 120)} className="w-full py-2 bg-amber-600 rounded-xl text-sm">500 نقطة - 120 ج.م</button>
                            <button onClick={verify} className="w-full py-2 bg-blue-600 rounded-xl text-sm">توثيق المتجر - 150 ج.م</button>
                        </div>
                    </div>
                </div>
            );
        }

        function AddEditProduct({ onSave, onBack, edit, sellerCountry }) {
            const [name, setName] = useState(edit?.name || '');
            const [price, setPrice] = useState(edit?.price || '');
            const [cat, setCat] = useState(edit?.category || 'electronics');
            const [emoji, setEmoji] = useState(edit?.emoji || '📦');
            const [desc, setDesc] = useState(edit?.description || '');
            const [vip, setVip] = useState(edit?.vip || false);
            const submit = () => {
                if (!name || !price) return;
                onSave({ name, price: Number(price), category: cat, emoji, description: desc, vip, sellerCountry });
            };
            return (
                <div className="p-4">
                    <button onClick={onBack}><i className="fas fa-arrow-right ml-2"></i> رجوع</button>
                    <div className="bg-white p-4 rounded-2xl shadow mt-2 space-y-3">
                        <h2 className="text-base font-bold">{edit ? 'تعديل' : 'إضافة'} منتج</h2>
                        <input placeholder="الاسم" className="w-full p-2 border rounded-xl" value={name} onChange={e=>setName(e.target.value)} />
                        <input type="number" placeholder="السعر" className="w-full p-2 border rounded-xl" value={price} onChange={e=>setPrice(e.target.value)} />
                        <select className="w-full p-2 border rounded-xl" value={cat} onChange={e=>setCat(e.target.value)}>
                            <option value="electronics">إلكترونيات</option>
                            <option value="fashion">موضة</option>
                            <option value="home">منزل</option>
                        </select>
                        <input placeholder="رمز" className="w-full p-2 border rounded-xl" value={emoji} onChange={e=>setEmoji(e.target.value)} />
                        <textarea rows="2" placeholder="الوصف" className="w-full p-2 border rounded-xl" value={desc} onChange={e=>setDesc(e.target.value)}></textarea>
                        <label className="text-xs"><input type="checkbox" checked={vip} onChange={e=>setVip(e.target.checked)} /> منتج VIP</label>
                        <button onClick={submit} className="w-full py-2 bg-orange-500 text-white rounded-xl">حفظ</button>
                    </div>
                </div>
            );
        }

        function ProductDetailPage({ product, seller, isLiked, onLike, onBack, onComment, onRate }) {
            const [newC, setNewC] = useState('');
            const stars = Array(5).fill(0).map((_, i) =>
                <i key={i} className={`fas fa-star ${i < product.rating ? 'text-yellow-400' : 'text-gray-300'} text-xl cursor-pointer`}
                   onClick={() => onRate(i+1)}></i>
            );
            const add = () => { if (newC.trim()) { onComment(newC); setNewC(''); } };
            return (
                <div className="p-4">
                    <button onClick={onBack}><i className="fas fa-arrow-right ml-2"></i> رجوع</button>
                    <div className="bg-white rounded-2xl p-4 mt-2">
                        <div className="text-7xl text-center">{product.emoji}</div>
                        <h2 className="text-lg font-bold">{product.name}</h2>
                        <p className="text-2xl text-blue-600 font-bold">{product.price.toLocaleString()} ج.م</p>
                        <div className="flex justify-center gap-1 mt-1">{stars}</div>
                        <p className="text-gray-600 text-sm mt-2">{product.description || 'لا يوجد وصف'}</p>
                        <div className="flex justify-between mt-3">
                            <div><i className="fas fa-store"></i> {seller?.storeName}</div>
                            <div className="flex gap-2">
                                <button onClick={onLike} className={`px-3 py-1 rounded-full text-sm ${isLiked?'bg-orange-500 text-white':'bg-gray-100'}`}><i className="fas fa-heart"></i> {product.likes}</button>
                            </div>
                        </div>
                        <div className="mt-3">
                            <div className="flex gap-2">
                                <input className="flex-1 p-2 border rounded-lg text-sm" placeholder="اكتب تعليقك..." value={newC} onChange={e=>setNewC(e.target.value)} />
                                <button onClick={add} className="px-3 py-1 bg-green-500 text-white rounded-lg text-sm">نشر</button>
                            </div>
                            <h3 className="font-semibold mt-2">التعليقات:</h3>
                            {product.comments?.length === 0 ? <p className="text-gray-400 text-sm">لا توجد تعليقات</p> :
                                product.comments?.map((c, i) => <div key={i} className="border-t pt-1 mt-1 text-sm">{c}</div>)
                            }
                        </div>
                    </div>
                </div>
            );
        }

        // ---------- التطبيق الرئيسي ----------
        function App() {
            const [state, setState] = useState(null);
            const [page, setPage] = useState('home');
            const [editProd, setEditProd] = useState(null);
            const [detailProd, setDetailProd] = useState(null);
            const [dark, setDark] = useState(() => localStorage.getItem(THEME_KEY) === 'dark');

            useEffect(() => { setState(loadState()); }, []);
            useEffect(() => { if (state) saveState(state); }, [state]);
            useEffect(() => {
                document.body.classList.toggle('dark', dark);
                localStorage.setItem(THEME_KEY, dark ? 'dark' : 'light');
            }, [dark]);

            if (!state) return <div className="min-h-screen flex items-center justify-center"><div className="animate-pulse text-orange-500">جار التحميل...</div></div>;

            const currentSeller = state.currentSellerId ? state.sellers[state.currentSellerId] : null;
            const update = (up) => setState(prev => up(prev));

            const handleLogin = (s) => { update(st => ({ ...st, currentSellerId: s.id })); setPage(s.isAdmin ? 'profile' : 'seller'); };
            const handleRegister = (s) => { update(st => ({ ...st, sellers: { ...st.sellers, [s.id]: s }, currentSellerId: s.id })); setPage('seller'); };
            const handleLogout = () => { update(st => ({ ...st, currentSellerId: null })); setPage('home'); };
            const handleLike = (pid) => {
                if (!currentSeller) return;
                update(s => {
                    const p = s.products[pid];
                    const liked = p.likedBy.includes(currentSeller.id);
                    const nl = liked ? p.likedBy.filter(id => id !== currentSeller.id) : [...p.likedBy, currentSeller.id];
                    return { ...s, products: { ...s.products, [pid]: { ...p, likes: liked ? p.likes-1 : p.likes+1, likedBy: nl } } };
                });
            };
            const handleWhats = (p) => {
                const phone = state.sellers[p.sellerId]?.phone?.replace(/\D/g, '') || '201113694362';
                const msg = encodeURIComponent(`مهتم بـ ${p.name} بسعر ${p.price} ج.م`);
                window.open(`https://wa.me/2${phone}?text=${msg}`, '_blank');
            };
            const handleAdd = (data) => {
                if (!currentSeller) return;
                if (editProd) {
                    update(s => ({ ...s, products: { ...s.products, [editProd.id]: { ...s.products[editProd.id], ...data } } }));
                } else {
                    const np = createProduct({ ...data, sellerId: currentSeller.id, sellerName: currentSeller.storeName, sellerCountry: currentSeller.country });
                    update(s => ({
                        ...s,
                        products: { ...s.products, [np.id]: np },
                        sellers: { ...s.sellers, [currentSeller.id]: { ...s.sellers[currentSeller.id], products: [...(s.sellers[currentSeller.id]?.products || []), np.id] } }
                    }));
                }
                setEditProd(null); setPage('seller');
            };
            const handleDelete = (pid) => {
                if (!confirm('حذف المنتج؟')) return;
                update(s => {
                    const np = { ...s.products }; delete np[pid];
                    const ns = { ...s.sellers };
                    if (ns[currentSeller.id]) ns[currentSeller.id].products = ns[currentSeller.id].products.filter(id => id !== pid);
                    return { ...s, products: np, sellers: ns };
                });
            };
            const handleSend = (txt) => { update(s => { let ns = addMessage(s, { role: 'user', text: txt }); return addMessage(ns, { role: 'bot', text: botReply(txt) }); }); };
            const handlePurchase = (type, amt, pts) => {
                update(s => {
                    const sel = s.sellers[currentSeller.id];
                    return { ...s, sellers: { ...s.sellers, [currentSeller.id]: { ...sel, points: sel.points + (pts || 0), verified: type === 'verify' ? true : sel.verified } } };
                });
            };
            const handleComment = (pid, text) => {
                update(s => {
                    const p = s.products[pid];
                    return { ...s, products: { ...s.products, [pid]: { ...p, comments: [...(p.comments || []), text] } } };
                });
            };
            const handleRate = (pid, rating) => {
                update(s => {
                    const p = s.products[pid];
                    return { ...s, products: { ...s.products, [pid]: { ...p, rating } } };
                });
            };

            return (
                <div className="min-h-screen flex flex-col">
                    {page === 'home' && (
                        <>
                            <header className="sticky top-0 z-20 bg-white border-b px-3 py-2 flex items-center justify-between">
                                <div className="flex items-center gap-2">
                                    <i className="fas fa-store text-orange-500 text-base"></i>
                                    <span className="text-sm font-bold text-orange-600">VICKS MARKET</span>
                                </div>
                                <div className="flex gap-2">
                                    <button onClick={() => setDark(!dark)} className="p-1.5 rounded-lg bg-gray-100">
                                        <i className={`fas fa-${dark ? 'sun' : 'moon'} text-sm`}></i>
                                    </button>
                                    <button onClick={() => currentSeller ? (currentSeller.isAdmin ? setPage('profile') : setPage('seller')) : setPage('login')}
                                            className="p-1.5 rounded-lg bg-gray-100">
                                        <i className="fas fa-user-circle text-sm"></i>
                                    </button>
                                </div>
                            </header>
                            <main className="flex-1 overflow-hidden">
                                <HomePage
                                    products={state.products}
                                    sellers={state.sellers}
                                    currSellerId={state.currentSellerId}
                                    onLike={handleLike}
                                    onWhats={handleWhats}
                                    onProductClick={p => { setDetailProd(p); setPage('detail'); }}
                                    onShowOffers={() => setPage('offers')}
                                    onShowVIP={() => setPage('vip')}
                                    onComment={(pid) => { const c = prompt('تعليقك:'); if (c) handleComment(pid, c); }}
                                    onRate={handleRate}
                                    onSellerProfile={(sid) => { /* يمكن فتح ملف التاجر */ }}
                                />
                            </main>
                            <button onClick={() => setPage('chat')} className="fixed bottom-4 right-4 w-10 h-10 rounded-full bg-orange-500 text-white shadow-lg flex items-center justify-center z-30">
                                <i className="fas fa-robot text-base"></i>
                            </button>
                        </>
                    )}
                    {page === 'login' && <LoginPage sellers={state.sellers} onLogin={handleLogin} onGoJoin={() => setPage('join')} onBack={() => setPage('home')} />}
                    {page === 'join' && <JoinPage sellers={state.sellers} onRegister={handleRegister} onBack={() => setPage('login')} />}
                    {page === 'seller' && currentSeller && !currentSeller.isAdmin && (
                        <SellerDashboard
                            seller={currentSeller} products={state.products}
                            onGoStore={() => setPage('store')} onGoChat={() => setPage('chat')}
                            onAddProduct={() => { setEditProd(null); setPage('addProduct'); }}
                            onEditProduct={p => { setEditProd(p); setPage('addProduct'); }}
                            onDeleteProduct={handleDelete} onLogout={handleLogout}
                            onBack={() => setPage('home')}
                        />
                    )}
                    {page === 'store' && currentSeller && <StorePoints seller={currentSeller} onBack={() => setPage('seller')} onPurchase={handlePurchase} />}
                    {page === 'chat' && <ChatPage messages={state.chatMessages} onSend={handleSend} onBack={() => setPage(currentSeller ? (currentSeller.isAdmin ? 'profile' : 'seller') : 'home')} />}
                    {page === 'addProduct' && currentSeller && (
                        <AddEditProduct onSave={handleAdd} onBack={() => { setEditProd(null); setPage('seller'); }} edit={editProd} sellerCountry={currentSeller.country} />
                    )}
                    {page === 'detail' && detailProd && (
                        <ProductDetailPage
                            product={state.products[detailProd.id] || detailProd}
                            seller={state.sellers[detailProd.sellerId] || null}
                            isLiked={currentSeller ? (state.products[detailProd.id] || detailProd).likedBy.includes(currentSeller.id) : false}
                            onLike={() => handleLike(detailProd.id)}
                            onBack={() => setPage('home')}
                            onComment={(txt) => handleComment(detailProd.id, txt)}
                            onRate={(r) => handleRate(detailProd.id, r)}
                        />
                    )}
                    {page === 'profile' && currentSeller?.isAdmin && (
                        <div className="p-4">
                            <button onClick={() => setPage('home')}><i className="fas fa-arrow-right ml-2"></i> رجوع</button>
                            <div className="text-center mt-4">
                                <div className="text-6xl">👑</div>
                                <h2 className="text-xl font-bold">{currentSeller.ownerName}</h2>
                                <p className="text-gray-500">مالك المنصة</p>
                                <button onClick={handleLogout} className="mt-4 px-4 py-2 bg-red-500 text-white rounded-xl">تسجيل الخروج</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(App));
    </script>
</body>
    </html>
