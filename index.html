<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>VICKS MARKET | منصة تجارة عالمية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
    <style>
        /* ========== أنماط عامة وأساسية ========== */
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        /* ========== الوضع الليلي (جميع النصوص برتقالية، بدون حدود بيضاء) ========== */
        body.dark {
            background-color: #000000;
        }
        body.dark .bg-white,
        body.dark .bg-gray-50,
        body.dark .bg-gray-100,
        body.dark .bg-card {
            background-color: #121212 !important;
        }
        body.dark,
        body.dark .text-gray-800,
        body.dark .text-gray-600,
        body.dark .text-gray-500,
        body.dark .text-blue-600,
        body.dark .text-black,
        body.dark span,
        body.dark p,
        body.dark h1,
        body.dark h2,
        body.dark h3,
        body.dark label,
        body.dark .seller-name,
        body.dark .product-price {
            color: #ff6600 !important;
        }
        body.dark .fas.fa-star.text-yellow-400 {
            color: #ffaa33 !important;
        }
        body.dark .fas.fa-star.text-gray-300 {
            color: #ff6600 !important;
            opacity: 0.5;
        }
        body.dark button.bg-gray-100 {
            background-color: #1a1a1a !important;
            color: #ff6600 !important;
        }
        body.dark button.bg-gray-100:hover {
            background-color: #ff6600 !important;
            color: #000000 !important;
        }
        body.dark .border,
        body.dark .border-gray-100,
        body.dark .border-gray-200,
        body.dark .border-t,
        body.dark .border-b {
            border-color: #ff6600 !important;
            border-width: 0.5px !important;
        }
        body.dark .shadow-sm,
        body.dark .shadow-md,
        body.dark .shadow-lg {
            box-shadow: none !important;
        }
        
        /* ========== الملف الشخصي للمالك (Profile) ========== */
        .profile-avatar {
            width: 120px;
            height: 120px;
            background-color: #ff6600;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: white;
            margin: 0 auto;
        }
        body.dark .profile-avatar {
            background-color: #ff6600;
            color: #000;
        }
        
        /* ========== العلامة المائية للدردشة ========== */
        .chat-watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2.5rem;
            font-weight: bold;
            opacity: 0.08;
            white-space: nowrap;
            pointer-events: none;
            z-index: 5;
            user-select: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        body.dark .chat-watermark {
            opacity: 0.12;
        }
        @media (max-width: 640px) {
            .chat-watermark {
                font-size: 1.6rem;
                white-space: normal;
                text-align: center;
                width: 80%;
            }
        }
        
        /* ========== سلايدر وبطاقات مدمجة ========== */
        .horizontal-scroll {
            overflow-x: auto;
            scrollbar-width: thin;
            -webkit-overflow-scrolling: touch;
        }
        .horizontal-scroll::-webkit-scrollbar {
            height: 4px;
        }
        .compact-card {
            padding: 8px;
            min-width: 140px;
            width: 140px;
            flex: 0 0 auto;
        }
        .compact-card .product-emoji {
            font-size: 2.5rem;
            margin-bottom: 4px;
            background: #f3f4f6;
            border-radius: 12px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .list-item {
            padding: 8px;
            margin-bottom: 8px;
        }
        .list-item .product-emoji {
            font-size: 2rem;
            width: 50px;
            height: 50px;
            background: #f3f4f6;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .chat-fixed-bottom {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: inherit;
            z-index: 20;
        }
    </style>
</head>
<body class="bg-gray-50 font-sans antialiased">
    <div id="root"></div>

    <script type="text/babel" data-presets="react,typescript">
        // --------------------------------------------------------------
        // 1. بيانات ثابتة وحساب المالك (تعمل بنسبة 100%)
        // --------------------------------------------------------------
        const STORAGE_KEY = 'vicks_stable';
        const THEME_KEY = 'vicks_theme';
        const COUNTRY_KEY = 'vicks_country';
        
        const OWNER_EMAIL = 'mom1113694362@gmail.com';
        const OWNER_PASS = 'momMOM2023#';
        const OWNER_ID = '10000000000';
        
        function genId() { return Math.random().toString(36).slice(2) + Date.now().toString(36); }
        
        // نماذج بيانات
        const countries = [
            { code: 'EG', name: 'مصر', currency: 'EGP' }, { code: 'SA', name: 'السعودية', currency: 'SAR' },
            { code: 'AE', name: 'الإمارات', currency: 'AED' }, { code: 'US', name: 'USA', currency: 'USD' },
            { code: 'GB', name: 'UK', currency: 'GBP' }, { code: 'DE', name: 'Germany', currency: 'EUR' }
        ];
        
        const categories = [
            { id: 'all', label: 'الجميع', icon: 'fa-grid' }, { id: 'electronics', label: 'إلكترونيات', icon: 'fa-microchip' },
            { id: 'fashion', label: 'موضة', icon: 'fa-tshirt' }, { id: 'home', label: 'منزل ومطبخ', icon: 'fa-home' },
            { id: 'toys', label: 'ألعاب', icon: 'fa-gamepad' }, { id: 'books', label: 'كتب', icon: 'fa-book' }
        ];
        
        // بائعين أوليين (مع حساب المالك)
        const defaultSellers = {
            admin: {
                id: OWNER_ID, email: OWNER_EMAIL, password: OWNER_PASS,
                storeName: 'VICKS MARKET', ownerName: 'محمد المالك', phone: '01113694362',
                points: 50000, verified: true, subscription: 'platinum', products: [],
                createdAt: Date.now(), country: 'مصر', isAdmin: true, vipExpiry: Date.now() + 86400000*365
            },
            seller1: {
                id: 's1', email: 'seller1@test.com', password: '123456',
                storeName: 'متجر النور', ownerName: 'أحمد علي', phone: '01012345678',
                points: 350, verified: true, subscription: 'silver',
                products: ['p1','p3','p5'], createdAt: Date.now() - 86400000*10,
                country: 'مصر', isAdmin: false, vipExpiry: Date.now() + 86400000*30
            },
            seller2: {
                id: 's2', email: 'seller2@test.com', password: '123456',
                storeName: 'سوبر ماركت الفرح', ownerName: 'فاطمة حسن', phone: '01198765432',
                points: 120, verified: false, subscription: 'free',
                products: ['p2','p4','p6'], createdAt: Date.now() - 86400000*5,
                country: 'السعودية', isAdmin: false, vipExpiry: null
            }
        };
        
        const defaultProducts = {
            p1: { id: 'p1', name: 'ايفون 14 Pro مستعمل', price: 18000, category: 'electronics', emoji: '📱', sellerId: 's1', sellerName: 'متجر النور', sellerCountry: 'مصر', likes: 8, likedBy: [], description: 'بطارية 92%', createdAt: Date.now()-86400000*2, vip: true, comments: [], rating: 4 },
            p2: { id: 'p2', name: 'زيت زيتون بكر 1 لتر', price: 185, category: 'home', emoji: '🫒', sellerId: 's2', sellerName: 'سوبر ماركت الفرح', sellerCountry: 'السعودية', likes: 5, likedBy: [], description: 'زيت طبيعي', createdAt: Date.now()-86400000, vip: false, comments: [], rating: 3 },
            p3: { id: 'p3', name: 'شاشة سامسونج 55بوصة', price: 4500, category: 'electronics', emoji: '📺', sellerId: 's1', sellerName: 'متجر النور', sellerCountry: 'مصر', likes: 12, likedBy: [], description: 'شاشة ممتازة', createdAt: Date.now()-86400000*3, vip: true, comments: [], rating: 5 },
            p4: { id: 'p4', name: 'بلاي ستيشن 5', price: 1800, category: 'toys', emoji: '🎮', sellerId: 's2', sellerName: 'سوبر ماركت الفرح', sellerCountry: 'السعودية', likes: 9, likedBy: [], description: 'جهاز ترفيهي', createdAt: Date.now()-86400000, vip: false, comments: [], rating: 2 },
            p5: { id: 'p5', name: 'لاب توب ديل Inspiron', price: 12000, category: 'electronics', emoji: '💻', sellerId: 's1', sellerName: 'متجر النور', sellerCountry: 'مصر', likes: 7, likedBy: [], description: 'Core i7', createdAt: Date.now()-86400000*6, vip: true, comments: [], rating: 3 },
            p6: { id: 'p6', name: 'رواية أطلس الغيوم', price: 85, category: 'books', emoji: '📖', sellerId: 's2', sellerName: 'سوبر ماركت الفرح', sellerCountry: 'السعودية', likes: 15, likedBy: [], description: 'أدب مترجم', createdAt: Date.now()-86400000*2, vip: false, comments: [], rating: 4 }
        };
        for (let i=7; i<=18; i++) {
            defaultProducts[`p${i}`] = {
                id: `p${i}`, name: `منتج مميز ${i}`, price: 100 + i*8, category: 'electronics', emoji: '📦',
                sellerId: 's1', sellerName: 'متجر النور', sellerCountry: 'مصر', likes: i%10, likedBy: [],
                description: `وصف المنتج ${i}`, createdAt: Date.now() - i*86400000, vip: i%3===0,
                comments: [], rating: i%5
            };
            defaultSellers.seller1.products.push(`p${i}`);
        }
        defaultSellers.admin.products = [];
        defaultSellers.seller1.products = ['p1','p3','p5', ...Array.from({length:12}, (_,i)=>`p${i+7}`)];
        defaultSellers.seller2.products = ['p2','p4','p6'];
        
        function getInitialState() {
            return {
                sellers: JSON.parse(JSON.stringify(defaultSellers)),
                products: JSON.parse(JSON.stringify(defaultProducts)),
                currentSellerId: null,
                chatMessages: [{ id: '1', role: 'bot', text: 'أهلاً بك في VICKS MARKET! كيف أستطيع مساعدتك اليوم؟', ts: Date.now() }],
                notifications: []
            };
        }
        
        function loadState() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (!raw) return getInitialState();
                const parsed = JSON.parse(raw);
                return (parsed && parsed.sellers && parsed.products) ? parsed : getInitialState();
            } catch(e) { return getInitialState(); }
        }
        function saveState(s) { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); }
        
        // دوال مساعدة
        const isAdmin = (s) => s?.isAdmin === true;
        const createSeller = (data) => ({
            id: 's_' + genId(), ...data, points: 0, verified: false, subscription: 'free', products: [],
            createdAt: Date.now(), isAdmin: false, vipExpiry: null
        });
        const createProduct = (data) => ({
            id: 'p_' + genId(), ...data, likes: 0, likedBy: [], createdAt: Date.now(), vip: false, comments: [], rating: 0
        });
        const addChatMsg = (state, msg) => ({ ...state, chatMessages: [...state.chatMessages, { ...msg, id: genId(), ts: Date.now() }] });
        const botReply = (msg) => {
            const m = msg.toLowerCase();
            if (m.includes('سعر')) return 'يمكنك الاطلاع على الأسعار من الصفحة الرئيسية. هل تبحث عن منتج معين؟';
            if (m.includes('بائع')) return 'للانضمام كبائع: اضغط "حسابي" ثم "انضم كتاجر جديد".';
            if (m.includes('نقاط')) return 'يمكنك شراء النقاط من صفحة المتجر (حسابي ← المتجر).';
            return 'شكراً لتواصلك! كيف أقدر أساعدك؟';
        };
        
        const { useState, useEffect, useCallback, useRef } = React;
        
        // --------------------------------------------------------------
        // 2. مكون بطاقة المنتج (مدمجة)
        // --------------------------------------------------------------
        function ProductCard({ product, isLiked, onLike, onWhatsApp, onClick, onComment, onRate, t, isVIPseller, isList }) {
            const stars = Array(5).fill(0).map((_,i) => (
                <i key={i} className={`fas fa-star ${i < product.rating ? 'text-yellow-400' : 'text-gray-300'} ${isList ? 'text-xs' : 'text-[10px]'} cursor-pointer`}
                   onClick={(e) => { e.stopPropagation(); onRate(i+1); }}></i>
            ));
            const shortSeller = product.sellerName.length > 10 ? product.sellerName.slice(0,8)+'..' : product.sellerName;
            if (isList) {
                return (
                    <div onClick={onClick} className="list-item flex gap-3 bg-white rounded-xl border shadow-sm cursor-pointer hover:shadow-md transition">
                        <div className="product-emoji">{product.emoji}</div>
                        <div className="flex-1">
                            <h3 className="font-semibold text-sm">{product.name}</h3>
                            <p className="text-blue-600 font-bold text-sm">{product.price.toLocaleString()} {t('currency')}</p>
                            <div className="flex items-center gap-1 mt-0.5">
                                <span className="text-[10px] text-gray-500 truncate max-w-[90px]">{shortSeller} {isVIPseller && <i className="fas fa-crown text-yellow-500 text-[8px]"></i>}</span>
                                <div className="flex gap-0.5">{stars}</div>
                            </div>
                        </div>
                        <div className="flex gap-1 items-center">
                            <button onClick={(e)=>{e.stopPropagation(); onLike();}} className={`p-1 rounded-full ${isLiked ? 'bg-orange-500 text-white' : 'bg-gray-100'}`}><i className="fas fa-heart text-xs"></i></button>
                            <button onClick={(e)=>{e.stopPropagation(); onWhatsApp();}} className="p-1 rounded-full bg-green-100"><i className="fab fa-whatsapp text-xs"></i></button>
                            <button onClick={(e)=>{e.stopPropagation(); onComment();}} className="p-1 rounded-full bg-blue-100"><i className="fas fa-comment text-xs"></i></button>
                        </div>
                    </div>
                );
            }
            return (
                <div onClick={onClick} className="compact-card bg-white rounded-xl border shadow-sm cursor-pointer hover:shadow-md transition relative flex-shrink-0">
                    {product.vip && <span className="absolute top-1 right-1 bg-yellow-400 text-white text-[8px] rounded-full px-1 py-0.5"><i className="fas fa-crown"></i></span>}
                    <div className="product-emoji">{product.emoji}</div>
                    <h3 className="product-name font-semibold line-clamp-2">{product.name}</h3>
                    <p className="product-price text-blue-600 font-bold mt-0.5">{product.price.toLocaleString()} {t('currency')}</p>
                    <div className="flex justify-between items-start mt-1">
                        <span className="seller-name text-[10px] text-gray-500 truncate max-w-[80px]">{shortSeller} {isVIPseller && <i className="fas fa-crown text-yellow-500 text-[8px]"></i>}</span>
                        <div className="flex gap-0.5">
                            <button onClick={(e)=>{e.stopPropagation(); onLike();}} className={`p-0.5 rounded-full ${isLiked ? 'bg-orange-500 text-white' : 'bg-gray-100'}`}><i className="fas fa-heart text-[10px]"></i></button>
                            <button onClick={(e)=>{e.stopPropagation(); onWhatsApp();}} className="p-0.5 rounded-full bg-green-100"><i className="fab fa-whatsapp text-[8px]"></i></button>
                            <button onClick={(e)=>{e.stopPropagation(); onComment();}} className="p-0.5 rounded-full bg-blue-100"><i className="fas fa-comment text-[8px]"></i></button>
                        </div>
                    </div>
                    <div className="rating-stars flex gap-0.5 justify-center mt-1">{stars}</div>
                </div>
            );
        }
        
        // --------------------------------------------------------------
        // 3. صفحة الرئيسية (شبكة وقائمة فقط)
        // --------------------------------------------------------------
        function HomePage({ products, sellers, currentSellerId, selectedCountry, onLike, onWhatsApp, onProductClick, onShowOffers, onShowVIPPage, onComment, onRate, t }) {
            const [mode, setMode] = useState('grid');  // grid / list
            const [cat, setCat] = useState('all');
            const filtered = React.useMemo(() => {
                let arr = Object.values(products).filter(p => p.sellerCountry === selectedCountry);
                if (cat !== 'all') arr = arr.filter(p => p.category === cat);
                arr.sort((a,b) => {
                    const sa = sellers[a.sellerId], sb = sellers[b.sellerId];
                    const va = sa?.subscription !== 'free' && sa?.vipExpiry > Date.now();
                    const vb = sb?.subscription !== 'free' && sb?.vipExpiry > Date.now();
                    if (va && !vb) return -1;
                    if (!va && vb) return 1;
                    return 0;
                });
                return arr;
            }, [products, cat, selectedCountry, sellers]);
            const isLiked = (p) => currentSellerId ? p.likedBy.includes(currentSellerId) : false;
            const half = Math.ceil(filtered.length/2);
            const row1 = filtered.slice(0, half);
            const row2 = filtered.slice(half);
            return (
                <div className="flex flex-col h-full">
                    <div className="sticky top-0 z-10 bg-white border-b px-2 py-2 overflow-x-auto scrollbar-hide">
                        <div className="flex gap-2">
                            {categories.map(c => (
                                <button key={c.id} onClick={() => setCat(c.id)} className={`flex items-center gap-1 px-3 py-1.5 rounded-full text-xs font-medium transition ${cat === c.id ? 'bg-orange-500 text-white' : 'bg-gray-100 text-gray-700'}`}>
                                    <i className={`fas ${c.icon} text-xs`}></i> {c.label}
                                </button>
                            ))}
                        </div>
                    </div>
                    <div className="flex items-center gap-2 px-3 py-2 bg-white border-b">
                        <button onClick={onShowOffers} className="flex gap-1 px-3 py-1.5 rounded-xl bg-orange-50 text-orange-600 text-xs"><i className="fas fa-tag"></i> {t('offers')}</button>
                        <button onClick={onShowVIPPage} className="flex gap-1 px-3 py-1.5 rounded-xl bg-yellow-50 text-yellow-700 text-xs"><i className="fas fa-crown"></i> {t('vip')}</button>
                        <div className="flex-1"></div>
                        <button onClick={() => setMode('grid')} className={`p-1.5 rounded-lg text-xs ${mode === 'grid' ? 'bg-orange-500 text-white' : 'bg-gray-100'}`}><i className="fas fa-th"></i></button>
                        <button onClick={() => setMode('list')} className={`p-1.5 rounded-lg text-xs ${mode === 'list' ? 'bg-orange-500 text-white' : 'bg-gray-100'}`}><i className="fas fa-list-ul"></i></button>
                    </div>
                    <div className="flex-1 overflow-auto p-2">
                        {filtered.length === 0 && <div className="text-center py-10"><i className="fas fa-box-open text-3xl text-gray-400"></i><p className="text-xs">{t('no_products')}</p></div>}
                        {mode === 'grid' && (
                            <div className="space-y-3">
                                {row1.length > 0 && <div className="horizontal-scroll flex gap-2 pb-1" style={{ overflowX: 'auto' }}>{row1.map(p => {
                                    const seller = sellers[p.sellerId];
                                    const vipS = seller?.subscription !== 'free' && seller?.vipExpiry > Date.now();
                                    return <ProductCard key={p.id} product={p} isLiked={isLiked(p)} onLike={()=>onLike(p.id)} onWhatsApp={()=>onWhatsApp(p)} onClick={()=>onProductClick(p)} onComment={()=>onComment(p.id)} onRate={(r)=>onRate(p.id,r)} t={t} isVIPseller={vipS} isList={false} />;
                                })}</div>}
                                {row2.length > 0 && <div className="horizontal-scroll flex gap-2 pb-1" style={{ overflowX: 'auto' }}>{row2.map(p => {
                                    const seller = sellers[p.sellerId];
                                    const vipS = seller?.subscription !== 'free' && seller?.vipExpiry > Date.now();
                                    return <ProductCard key={p.id} product={p} isLiked={isLiked(p)} onLike={()=>onLike(p.id)} onWhatsApp={()=>onWhatsApp(p)} onClick={()=>onProductClick(p)} onComment={()=>onComment(p.id)} onRate={(r)=>onRate(p.id,r)} t={t} isVIPseller={vipS} isList={false} />;
                                })}</div>}
                            </div>
                        )}
                        {mode === 'list' && (
                            <div className="flex flex-col gap-2">
                                {filtered.map(p => {
                                    const seller = sellers[p.sellerId];
                                    const vipS = seller?.subscription !== 'free' && seller?.vipExpiry > Date.now();
                                    return <ProductCard key={p.id} product={p} isLiked={isLiked(p)} onLike={()=>onLike(p.id)} onWhatsApp={()=>onWhatsApp(p)} onClick={()=>onProductClick(p)} onComment={()=>onComment(p.id)} onRate={(r)=>onRate(p.id,r)} t={t} isVIPseller={vipS} isList={true} />;
                                })}
                            </div>
                        )}
                    </div>
                </div>
            );
        }
        
        // --------------------------------------------------------------
        // 4. صفحة الملف الشخصي للمالك (تعمل بلا شاشة بيضاء)
        // --------------------------------------------------------------
        function OwnerProfile({ seller, onLogout, onBack, t }) {
            return (
                <div className="flex flex-col h-full bg-white">
                    <div className="flex items-center p-4 border-b">
                        <button onClick={onBack} className="hover:text-orange-500"><i className="fas fa-arrow-right ml-2"></i> {t('back')}</button>
                        <h1 className="flex-1 text-center font-bold">{t('profile')}</h1>
                        <button onClick={onLogout} className="text-red-500"><i className="fas fa-sign-out-alt"></i></button>
                    </div>
                    <div className="flex-1 overflow-auto p-6">
                        <div className="profile-avatar"><i className="fas fa-crown text-4xl"></i></div>
                        <h2 className="text-center text-xl font-bold mt-3">{seller.ownerName}</h2>
                        <p className="text-center text-gray-500 text-xs mt-0.5">ID: {seller.id}</p>
                        <div className="mt-6 space-y-3 bg-gray-50 rounded-2xl p-4 text-sm">

            useEffect(()=>{ if(dark) document.body.classList.add('dark'); else document.body.classList.remove('dark'); localStorage.setItem(THEME_KEY,dark?'dark':'light'); },[dark]);
            useEffect(()=>{ localStorage.setItem(COUNTRY_KEY,country); },[country]);
            if(!state) return <div className="min-h-screen flex items-center justify-center"><div className="animate-pulse text-orange-500">VICKS MARKET</div></div>;
            
            const currentSeller = state.currentSellerId ? state.sellers[state.currentSellerId] : null;
            const update = (up) => setState(prev => up(prev));
            
            const handleLogin = (s) => { update(st=>({...st, currentSellerId: s.id})); if(s.isAdmin) setPage('profile'); else setPage('seller'); };
            const handleRegister = (s) => { update(st=>({...st, sellers:{...st.sellers, [s.id]:s}, currentSellerId:s.id})); setPage('seller'); };
            const handleLogout = () => { update(st=>({...st, currentSellerId:null})); setPage('home'); };
            const handleLike = (pid) => { if(!currentSeller) return; update(s=>{ const p=s.products[pid]; const liked = p.likedBy.includes(currentSeller.id); const newLiked = liked ? p.likedBy.filter(id=>id!==currentSeller.id) : [...p.likedBy, currentSeller.id]; return {...s, products:{...s.products,[pid]:{...p, likes: liked?p.likes-1:p.likes+1, likedBy:newLiked}}}; }); };
            const handleWhatsApp = (p) => { const phone = state.sellers[p.sellerId]?.phone?.replace(/\D/g,'') || '201113694362'; const msg = encodeURIComponent(`مرحباً مهتم بـ ${p.name} بسعر ${p.price} ج.م`); window.open(`https://wa.me/2${phone}?text=${msg}`,'_blank'); };
            const handleAddProduct = (data) => { if(!currentSeller) return; if(editProd){ update(s=>({...s, products:{...s.products,[editProd.id]:{...s.products[editProd.id],...data}}})); } else { const newP = createProduct({...data, sellerId:currentSeller.id, sellerName:currentSeller.storeName, sellerCountry:currentSeller.country}); update(s=>({...s, products:{...s.products,[newP.id]:newP}, sellers:{...s.sellers,[currentSeller.id]:{...s.sellers[currentSeller.id], products:[...(s.sellers[currentSeller.id]?.products||[]), newP.id]}}})); } setEditProd(null); setPage('seller'); };
            const handleDelete = (pid) => { if(confirm('حذف المنتج؟')) update(s=>{ const np={...s.products}; delete np[pid]; const ns={...s.sellers}; if(ns[currentSeller.id]) ns[currentSeller.id].products = ns[currentSeller.id].products.filter(id=>id!==pid); return {...s, products:np, sellers:ns}; }); };
            const handleSendMsg = (text) => { update(s=>{ let ns = addChatMsg(s,{role:'user',text}); ns = addChatMsg(ns,{role:'bot',text:botReply(text)}); return ns; }); };
            const onImage = (file) => { alert(`تم رفع ${file.name} (محاكاة)`); };
            const onPurchaseComplete = (type, amt, pts) => { update(s=>{ const seller = s.sellers[currentSeller.id]; return {...s, sellers:{...s.sellers,[currentSeller.id]:{...seller, points:seller.points+(pts||0), verified:type==='verify'?true:seller.verified}}; }); };
            const onVIPPurchase = (planId) => { update(s=>{ const seller = s.sellers[currentSeller.id]; return {...s, sellers:{...s.sellers,[currentSeller.id]:{...seller, subscription:planId, vipExpiry:Date.now()+86400000*30}}; }); alert(`تم الترقية إلى ${planId}`); setPage('seller'); };
            const onComment = (pid, text) => { update(s=>{ const p = s.products[pid]; return {...s, products:{...s.products,[pid]:{...p, comments:[...(p.comments||[]), text]}}}; }); };
            const onRate = (pid, rating) => { update(s=>{ const p = s.products[pid]; return {...s, products:{...s.products,[pid]:{...p, rating}}}; }); };
            const isLiked = (p) => currentSeller ? p.likedBy.includes(currentSeller.id) : false;
            
            return (
                <div className="min-h-screen flex flex-col">
                    {page === 'home' && (
                        <>
                            <header className="sticky top-0 z-20 bg-white border-b px-3 py-2 flex items-center justify-between">
                                <div className="flex items-center gap-2"><i className="fas fa-store text-orange-500 text-base"></i><span className="text-sm font-bold text-orange-600">VICKS MARKET</span></div>
                                <div className="flex gap-2">
                                    <button onClick={()=>document.getElementById('cameraInput')?.click()} className="p-1 rounded-lg bg-gray-100"><i className="fas fa-camera text-xs"></i></button>
                                    <button onClick={()=>setDark(!dark)} className="p-1 rounded-lg bg-gray-100"><i className={`fas fa-${dark ? 'sun' : 'moon'} text-xs`}></i></button>
                                    <button onClick={()=>currentSeller ? (currentSeller.isAdmin ? setPage('profile') : setPage('seller')) : setPage('login')} className="p-1 rounded-lg bg-gray-100"><i className="fas fa-user-circle text-xs"></i></button>
                                </div>
                                <input id="cameraInput" type="file" accept="image/*" capture="environment" className="hidden" onChange={()=>{}} />
                            </header>
                            <main className="flex-1 overflow-hidden">
                                <HomePage products={state.products} sellers={state.sellers} currentSellerId={state.currentSellerId} selectedCountry={country} onLike={handleLike} onWhatsApp={handleWhatsApp} onProductClick={p=>{ setDetailProd(p); setPage('detail'); }} onShowOffers={()=>setPage('offers')} onShowVIPPage={()=>setPage('vip')} onComment={(pid)=>{ const c=prompt('تعليقك:'); if(c) onComment(pid,c); }} onRate={onRate} t={t} />
                            </main>
                            <button onClick={()=>setPage('chat')} className="fixed bottom-4 right-4 w-10 h-10 rounded-full bg-orange-500 text-white shadow-lg z-30"><i className="fas fa-robot text-base"></i></button>
                        </>
                    )}
                    {page === 'offers' && <OffersList products={state.products} selectedCountry={country} onProductClick={p=>{ setDetailProd(p); setPage('detail'); }} onBack={()=>setPage('home')} t={t} />}
                    {page === 'vip' && (!currentSeller ? <div className="p-4 text-center">الرجاء تسجيل الدخول</div> : <VIPPage seller={currentSeller} onBack={()=>setPage('home')} onPurchase={onVIPPurchase} t={t} />)}
                    {page === 'profile' && currentSeller?.isAdmin && <OwnerProfile seller={currentSeller} onLogout={handleLogout} onBack={()=>setPage('home')} t={t} />}
                    {page === 'login' && <LoginPage sellers={state.sellers} onLogin={handleLogin} onGoJoin={()=>setPage('join')} onBack={()=>setPage('home')} t={t} />}
                    {page === 'join' && <JoinPage sellers={state.sellers} onRegister={handleRegister} onBack={()=>setPage('login')} t={t} />}
                    {page === 'seller' && currentSeller && !currentSeller.isAdmin && <SellerDashboard seller={currentSeller} products={state.products} onGoStore={()=>setPage('store')} onGoChat={()=>setPage('chat')} onAddProduct={()=>{ setEditProd(null); setPage('addProduct'); }} onEditProduct={p=>{ setEditProd(p); setPage('addProduct'); }} onDeleteProduct={handleDelete} onLogout={handleLogout} onBack={()=>setPage('home')} t={t} />}
                    {page === 'store' && currentSeller && <StorePointsPage seller={currentSeller} onBack={()=>setPage('seller')} onPurchase={onPurchaseComplete} t={t} />}
                    {page === 'chat' && <ChatPage messages={state.chatMessages} onSend={handleSendMsg} onBack={()=>setPage(currentSeller?(currentSeller.isAdmin?'profile':'seller'):'home')} t={t} onImage={onImage} />}
                    {page === 'addProduct' && currentSeller && <AddEditProduct onSave={handleAddProduct} onBack={()=>{ setEditProd(null); setPage('seller'); }} edit={editProd} sellerCountry={currentSeller.country} t={t} />}
                    {page === 'detail' && detailProd && <ProductDetail product={state.products[detailProd.id]||detailProd} seller={state.sellers[detailProd.sellerId]||null} isLiked={isLiked(state.products[detailProd.id]||detailProd)} onLike={()=>handleLike(detailProd.id)} onBack={()=>setPage('home')} onComment={(text)=>onComment(detailProd.id,text)} onRate={(r)=>onRate(detailProd.id,r)} t={t} />}
                    {page === 'settings' && <SettingsPage selectedCountry={country} setSelectedCountry={setCountry} t={t} />}
                </div>
            );
        }
        
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
