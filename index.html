<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VICKS MARKET</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
    <style>
        * { font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif; }
        body { margin: 0; padding: 0; }
       .floating-bot {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 56px;
            height: 56px;
            background: #ff6600;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(255,102,0,0.4);
            z-index: 999;
            cursor: pointer;
            transition: all 0.3s;
        }
       .floating-bot:hover { transform: scale(1.1); }
       .comments-modal {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 30vh;
            background: white;
            border-radius: 20px 20px 0 0;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.15);
            z-index: 1000;
            animation: slideUp 0.3s ease-out;
            display: flex;
            flex-direction: column;
        }
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
       .vicks-badge {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
            font-size: 12px;
        }
    </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef } = React;

    const STORAGE_KEY = 'vicks_market_final_v12';
    const ADMIN_EMAIL = 'mom1113694362@gmail.com';
    const ADMIN_PASS = 'momMOM2023#';
    const ADMIN_ID = '10000000000';

    function genId() {
        return Math.random().toString(36).slice(2) + Date.now().toString(36);
    }

    const categories = [
        { id: 'all', label: 'الكل', icon: '' },
        { id: 'electronics', label: 'إلكترونيات', icon: '📱' },
        { id: 'fashion', label: 'موضة', icon: '👗' },
        { id: 'home', label: 'المنزل', icon: '🏠' },
        { id: 'smart', label: 'أدوات ذكية', icon: '🤖' },
        { id: 'games', label: 'ألعاب', icon: '🎮' },
        { id: 'accessories', label: 'إكسسوارات', icon: '💍' }
    ];

    const initialSellers = {
        admin: {
            id: ADMIN_ID, email: ADMIN_EMAIL, password: ADMIN_PASS,
            storeName: 'VICKS MARKET', ownerName: 'محمد المالك', phone: '01113694362',
            points: 50000, verified: true, subscription: 'platinum', products: [],
            createdAt: Date.now(), country: 'مصر', isAdmin: true, avatar: '👑',
            verificationBadge: true, accountType: 'seller', maxProducts: Infinity,
            subscriptionExpiry: null, contactPreference: 'whatsapp'
        },
        s1: {
            id: 's1', email: 'seller1@test.com', password: '123456',
            storeName: 'متجر النور', ownerName: 'أحمد', phone: '01012345678',
            points: 350, verified: true, subscription: 'silver', products: [],
            country: 'مصر', isAdmin: false, avatar: '🌟', verificationBadge: true,
            accountType: 'seller', maxProducts: Infinity, subscriptionExpiry: null,
            contactPreference: 'whatsapp'
        },
        s2: {
            id: 's2', email: 'seller2@test.com', password: '123456',
            storeName: 'سوبر ماركت الفرح', ownerName: 'فاطمة', phone: '01198765432',
            points: 120, verified: false, subscription: 'free', products: [],
            country: 'السعودية', isAdmin: false, avatar: '🛒', verificationBadge: false,
            accountType: 'seller', maxProducts: 10, subscriptionExpiry: null,
            contactPreference: 'whatsapp'
        }
    };

    const productNames = ['ايفون 14 Pro', 'زيت زيتون', 'شاشة سامسونج', 'بلاي ستيشن 5', 'لاب توب ديل', 'عطر فاخر', 'ساعة ذكية', 'سماعة لاسلكية', 'طقم مطبخ', 'لعبة فيفا', 'سوار ذهبي', 'كاميرا مراقبة'];
    const emojis = ['📱', '🫒', '📺', '🎮', '💻', '🧴', '⌚', '🎧', '🍳', '⚽', '💎', '📷'];
    const possibleCategories = ['electronics', 'fashion', 'home', 'smart', 'games', 'accessories'];

    const initialProducts = {};
    for (let i = 1; i <= 14; i++) {
        const sellerId = i % 2 === 0? 's2' : 's1';
        initialProducts[`p${i}`] = {
            id: `p${i}`, name: productNames[(i-1)%productNames.length] + (i>10? ` ${i}` : ''),
            price: 80 + i*50, category: possibleCategories[(i-1)%possibleCategories.length],
            emoji: emojis[(i-1)%emojis.length], sellerId, sellerName: sellerId==='s1'?'متجر النور':'سوبر ماركت الفرح',
            sellerCountry: sellerId==='s1'?'مصر':'السعودية', likes: (i*7)%19, likedBy: [],
            description: `وصف المنتج ${i}`, createdAt: Date.now() - i*86400000,
            vip: i%3===0, comments: [], rating: i%5
        };
    }
    initialSellers.s1.products = Object.keys(initialProducts).filter(id => initialProducts[id].sellerId==='s1');
    initialSellers.s2.products = Object.keys(initialProducts).filter(id => initialProducts[id].sellerId==='s2');

    function getInitialState() {
        return {
            sellers: JSON.parse(JSON.stringify(initialSellers)),
            products: JSON.parse(JSON.stringify(initialProducts)),
            currentSellerId: null,
            chatMessages: [{ id: '1', role: 'bot', text: 'أهلاً بك في VICKS MARKET! كيف أستطيع مساعدتك اليوم؟', ts: Date.now() }],
            theme: 'light'
        };
    }

    function loadState() {
        try {
            const r = localStorage.getItem(STORAGE_KEY);
            return r? (JSON.parse(r) || getInitialState()) : getInitialState();
        } catch {
            return getInitialState();
        }
    }

    function saveState(s) { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); }

    function CommentsModal({ product, onClose, onAddComment }) {
        const [comment, setComment] = useState('');
        const endRef = useRef(null);

        useEffect(() => {
            document.body.style.overflow = 'hidden';
            return () => { document.body.style.overflow = ''; };
        }, []);

        useEffect(() => {
            endRef.current?.scrollIntoView({ behavior: 'smooth' });
        }, [product.comments]);

        const handleAdd = () => {
            if (comment.trim()) {
                onAddComment(product.id, comment.trim());
                setComment('');
            }
        };

        return (
            <div className="fixed inset-0 bg-black bg-opacity-50 z-[1001]" onClick={onClose}>
                <div className="comments-modal" onClick={e => e.stopPropagation()}>
                    <div className="flex items-center justify-between p-4 border-b">
                        <h3 className="font-bold">التعليقات ({product.comments?.length || 0})</h3>
                        <button onClick={onClose}><i className="fas fa-times"></i></button>
                    </div>
                    <div className="flex-1 overflow-auto p-4 space-y-2">
                        {(!product.comments || product.comments.length === 0) && (
                            <p className="text-center text-gray-400 py-8">لا توجد تعليقات بعد</p>
                        )}
                        {product.comments && product.comments.map((c, i) => (
                            <div key={i} className="p-3 bg-gray-50 rounded-xl text-sm">{c}</div>
                        ))}
                        <div ref={endRef} />
                    </div>
                    <div className="p-3 bg-white border-t flex gap-2">
                        <input type="text" className="flex-1 p-2.5 bg-gray-100 rounded-xl text-sm outline-none"
                            placeholder="أضف تعليقاً..." value={comment}
                            onChange={e => setComment(e.target.value)}
                            onKeyDown={e => e.key==='Enter' && handleAdd()} />
                        <button onClick={handleAdd} disabled={!comment.trim()}
                            className="px-4 py-2 bg-orange-500 text-white rounded-xl text-sm disabled:opacity-50">
                            <i className="fas fa-paper-plane"></i>
                        </button>
                    </div>
                </div>
            </div>
        );
    }

    function ChatPage({ messages, onSend, onBack }) {
        const [input, setInput] = useState('');
        const endRef = useRef(null);
        const send = () => { if(input.trim()) { onSend(input.trim()); setInput(''); } };
        useEffect(() => { endRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [messages]);
        return (
            <div className="flex flex-col relative bg-gray-50" style={{height:'100vh',overflow:'hidden'}}>
                <div className="flex items-center p-4 border-b bg-white z-10">
                    <button onClick={onBack} className="ml-2"><i className="fas fa-arrow-right text-lg"></i></button>
                    <div className="vicks-badge bg-orange-500">
                        <i className="fas fa-store"></i> VICKS AI
                    </div>
                </div>
                <div className="flex-1 overflow-auto p-4" style={{position:'relative',zIndex:5}}>
                    {messages.map(m => (
                        <div key={m.id} className={`flex ${m.role==='user'?'justify-end':'justify-start'} mb-3`}>
                            <div className={`max-w-[75%] p-3 text-sm rounded-xl ${m.role==='user'?'bg-orange-500 text-white':'bg-white text-gray-700 border'}`}>{m.text}</div>
                        </div>
                    ))}
                    <div ref={endRef} />
                </div>
                <div className="p-3 bg-white border-t flex items-center gap-2">
                    <input type="text" className="flex-1 p-2.5 bg-gray-100 rounded-xl text-sm outline-none" placeholder="اكتب رسالتك..." value={input}
                        onChange={e => setInput(e.target.value)} onKeyDown={e => e.key==='Enter' && send()} />
                    <button onClick={send} className="w-10 h-10 bg-orange-500 text-white rounded-full flex items-center justify-center"><i className="fas fa-paper-plane"></i></button>
                </div>
            </div>
        );
    }

    function ProductCard({ prod, liked, onLike, onWhats, onClick, onRate, sellerAvatar, sellerVerification, onSellerClick, isList, onCommentsClick, contactPreference }) {
        const stars = Array(5).fill(0).map((_, i) =>
            <i key={i} className={`fas fa-star ${i < prod.rating? 'text-yellow-400' : 'text-gray-300'}`}
               style={{fontSize:'10px', cursor:'pointer'}} onClick={e => { e.stopPropagation(); onRate(i+1); }}></i>
        );
        const shortName = prod.sellerName.length > 10? prod.sellerName.slice(0,8)+'..' : prod.sellerName;
        const isTelegram = contactPreference === 'telegram';

        if (isList) {
            return (
                <div onClick={onClick} className="flex gap-3 p-3 bg-white rounded-xl border mb-2 cursor-pointer hover:shadow-md transition-shadow">
                    <div className="w-24 h-24 bg-gray-50 rounded-xl flex items-center justify-center text-5xl flex-shrink-0">
                        {prod.emoji}
                    </div>
                    <div className="flex-1 min-w-0 flex flex-col">
                        <div className="flex justify-between items-center mb-1">
                            <div className="flex gap-0.5">{stars}</div>
                            <div className="flex items-center gap-1 cursor-pointer" onClick={e => { e.stopPropagation(); onSellerClick(); }}>
                                {sellerVerification && <i className="fas fa-check-circle text-blue-500 text-[9px]"></i>}
                                <span className="text-[10px] text-gray-500 max-w-[60px] truncate">{shortName}</span>
                                <span className="w-5 h-5 rounded-full bg-gray-200 flex items-center justify-center text-[10px]">{sellerAvatar || '🏪'}</span>
                            </div>
                        </div>
                        <div className="font-semibold text-sm truncate mb-1">{prod.name}</div>
                        <div className="flex justify-between items-center mt-auto">
                            <div className="flex items-center gap-2">
                                <button onClick={e => { e.stopPropagation(); onWhats(); }} className={`p-1.5 rounded-lg text-xs ${isTelegram? 'bg-blue-100 text-blue-600' : 'bg-green-100 text-green-600'}`}>
                                    <i className={`fab ${isTelegram? 'fa-telegram' : 'fa-whatsapp'}`}></i>
                                </button>
                                <button onClick={e => { e.stopPropagation(); onCommentsClick && onCommentsClick(prod); }} className="p-1.5 rounded-lg text-xs bg-blue-100 text-blue-600"><i className="fas fa-comment"></i></button>
                                <button onClick={e => { e.stopPropagation(); onLike(); }} className={`p-1.5 rounded-lg text-xs ${liked? 'bg-orange-500 text-white' : 'bg-gray-100 text-gray-500'}`}><i className="fas fa-heart"></i></button>
                            </div>
                            <span className="text-sm font-bold text-orange-600">{prod.price.toLocaleString()} ج.م</span>
                        </div>
                    </div>
                </div>
            );
        }

        return (
            <div onClick={onClick} className="p-3 bg-white rounded-xl border shadow-sm cursor-pointer hover:shadow-md w-[180px] flex-shrink-0 transition-shadow flex flex-col">
                <div className="flex justify-between items-center px-1 mb-2">
                    <div className="flex gap-0.5">{stars}</div>
                    <div className="flex items-center gap-1 cursor-pointer" onClick={e => { e.stopPropagation(); onSellerClick(); }}>
                        {sellerVerification && <i className="fas fa-check-circle text-blue-500 text-[9px]"></i>}
                        <span className="text-[10px] text-gray-500 max-w-[50px] truncate">{shortName}</span>
                        <span className="w-5 h-5 rounded-full bg-gray-200 flex items-center justify-center text-[10px]">{sellerAvatar || '🏪'}</span>
                    </div>
                </div>
                <div className="h-36 flex items-center justify-center bg-gray-50 rounded-xl text-7xl mb-2">
                    {prod.emoji}
                </div>
                <h3 className="font-semibold text-xs truncate text-center mb-2">{prod.name}</h3>
                <div className="flex justify-between items-center mt-auto px-1">
                    <div className="flex items-center gap-1.5">
                        <button onClick={e => { e.stopPropagation(); onWhats(); }} className={`p-1.5 rounded-lg text-xs ${isTelegram? 'bg-blue-100 text-blue-600' : 'bg-green-100 text-green-600'}`}>
                            <i className={`fab ${isTelegram? 'fa-telegram' : 'fa-whatsapp'}`}></i>
                        </button>
                        <button onClick={e => { e.stopPropagation(); onCommentsClick && onCommentsClick(prod); }} className="p-1.5 rounded-lg text-xs bg-blue-100 text-blue-600"><i className="fas
