<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>VICKS MARKET | منصة تجارة عالمية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
    <style>
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        body.dark { background-color: #1e1f20; }
        body.dark .bg-white, body.dark .bg-gray-50 { background-color: #1e1f20; }
        body.dark .bg-gray-100 { background-color: #2c2d30; }
        body.dark .text-gray-800, body.dark .text-gray-600, body.dark .text-gray-500 { color: #e8eaed; }
        body.dark .border-gray-100, body.dark .border-gray-200 { border-color: #3c4043; }
        body.dark .bg-indigo-50, body.dark .bg-green-50, body.dark .bg-blue-50, body.dark .bg-yellow-50, body.dark .bg-orange-50 { background-color: #2a2f3a; }
        body.dark .chat-watermark { color: rgba(255,255,255,0.05); }
        .chat-fixed-bottom { position: fixed; bottom: 0; left: 0; right: 0; background: inherit; z-index: 20; }
        /* أنماط إضافية لصفحة VIP */
        .vip-gold { background: linear-gradient(135deg, #1a1a2e, #0f0f1a); border: 1px solid #d4af37; }
        .vip-card { transition: all 0.3s ease; }
        .vip-card:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(0,0,0,0.3); }
    </style>
</head>
<body class="bg-gray-50 font-sans antialiased">
    <div id="root"></div>

    <script type="text/babel" data-presets="react,typescript">
        // ==================== الثوابت والبيانات الأساسية (TypeScript) ====================
        const STORAGE_KEY = 'vicks_market_state';
        const THEME_KEY = 'vicks_theme';
        const LANG_KEY = 'vicks_lang';
        const COUNTRY_KEY = 'vicks_country';
        // بيانات المالك الثابتة (Hardcoded Admin)
        const ADMIN_EMAIL = 'mom1113694362@gmail.com';
        const ADMIN_PASS = 'momMOM2023#';
        const ADMIN_ID = '10000000000';
        function generateId(): string { return Math.random().toString(36).slice(2) + Date.now().toString(36); }

        // قائمة جميع دول العالم
        const countriesList = [
            { code: 'EG', name: 'مصر', currency: 'EGP' }, { code: 'SA', name: 'السعودية', currency: 'SAR' },
            { code: 'AE', name: 'الإمارات', currency: 'AED' }, { code: 'US', name: 'United States', currency: 'USD' },
            { code: 'GB', name: 'United Kingdom', currency: 'GBP' }, { code: 'DE', name: 'Germany', currency: 'EUR' },
            { code: 'FR', name: 'France', currency: 'EUR' }, { code: 'TR', name: 'Turkey', currency: 'TRY' },
            { code: 'JO', name: 'Jordan', currency: 'JOD' }, { code: 'KW', name: 'Kuwait', currency: 'KWD' }
        ];
        
        const categories = [
            { id: 'all', label: 'الكل', icon: 'fa-grid' }, { id: 'electronics', label: 'الإلكترونيات', icon: 'fa-microchip' },
            { id: 'fashion', label: 'الموضة', icon: 'fa-tshirt' }, { id: 'home', label: 'المنزل والمطبخ', icon: 'fa-home' },
            { id: 'toys', label: 'الألعاب', icon: 'fa-gamepad' }, { id: 'books', label: 'الكتب', icon: 'fa-book' }
        ];

        // بيانات تجريبية
        const SAMPLE_SELLERS: Record<string, any> = {
            admin: { id: ADMIN_ID, email: ADMIN_EMAIL, password: ADMIN_PASS, storeName: 'VICKS MARKET', ownerName: 'Mohamed', phone: '01113694362', points: 50000, verified: true, subscription: 'platinum', products: [], createdAt: Date.now(), country: 'مصر', isAdmin: true, vipExpiry: null },
            s1: { id: 's1', email: 'seller1@test.com', password: '123456', storeName: 'متجر النور', ownerName: 'أحمد علي', phone: '01012345678', points: 350, verified: true, subscription: 'silver', products: ['p1','p3','p5'], createdAt: Date.now() - 86400000 * 10, country: 'مصر', isAdmin: false, vipExpiry: Date.now() + 86400000 * 30 },
            s2: { id: 's2', email: 'seller2@test.com', password: '123456', storeName: 'سوبر ماركت الفرح', ownerName: 'فاطمة حسن', phone: '01198765432', points: 120, verified: false, subscription: 'free', products: ['p2','p4','p6'], createdAt: Date.now() - 86400000 * 5, country: 'السعودية', isAdmin: false, vipExpiry: null },
        };
        const SAMPLE_PRODUCTS: Record<string, any> = {
            p1: { id: 'p1', name: 'ايفون 14 Pro مستعمل', price: 18000, category: 'electronics', emoji: '📱', sellerId: 's1', sellerName: 'متجر النور', sellerCountry: 'مصر', likes: 8, likedBy: [], description: 'بطارية 92%', createdAt: Date.now() - 86400000 * 2, vip: true, comments: [], rating: 0 },
            p2: { id: 'p2', name: 'زيت زيتون بكر 1 لتر', price: 185, category: 'home', emoji: '🫒', sellerId: 's2', sellerName: 'سوبر ماركت الفرح', sellerCountry: 'السعودية', likes: 5, likedBy: [], description: 'زيت طبيعي', createdAt: Date.now() - 86400000, vip: false, comments: [], rating: 0 },
            p3: { id: 'p3', name: 'شاشة سامسونج 55 بوصة', price: 4500, category: 'electronics', emoji: '📺', sellerId: 's1', sellerName: 'متجر النور', sellerCountry: 'مصر', likes: 12, likedBy: [], description: 'شاشة ممتازة', createdAt: Date.now() - 86400000 * 3, vip: true, comments: [], rating: 0 },
            p4: { id: 'p4', name: 'لعبة بلاي ستيشن 5', price: 1800, category: 'toys', emoji: '🎮', sellerId: 's2', sellerName: 'سوبر ماركت الفرح', sellerCountry: 'السعودية', likes: 9, likedBy: [], description: 'جهاز ترفيهي', createdAt: Date.now() - 86400000 * 1, vip: false, comments: [], rating: 0 },
            p5: { id: 'p5', name: 'لاب توب ديل Inspiron', price: 12000, category: 'electronics', emoji: '💻', sellerId: 's1', sellerName: 'متجر النور', sellerCountry: 'مصر', likes: 7, likedBy: [], description: 'Core i7', createdAt: Date.now() - 86400000 * 6, vip: true, comments: [], rating: 0 },
            p6: { id: 'p6', name: 'رواية "أطلس الغيوم"', price: 85, category: 'books', emoji: '📖', sellerId: 's2', sellerName: 'سوبر ماركت الفرح', sellerCountry: 'السعودية', likes: 15, likedBy: [], description: 'أدب مترجم', createdAt: Date.now() - 86400000 * 2, vip: false, comments: [], rating: 0 },
        };
        SAMPLE_SELLERS.admin.products = [];
        SAMPLE_SELLERS.s1.products = ['p1','p3','p5'];
        SAMPLE_SELLERS.s2.products = ['p2','p4','p6'];

        function getDefaultState() { return { sellers: JSON.parse(JSON.stringify(SAMPLE_SELLERS)), products: JSON.parse(JSON.stringify(SAMPLE_PRODUCTS)), currentSellerId: null, chatMessages: [{ id: '1', role: 'bot', text: 'أهلاً بك في VICKS MARKET! كيف أستطيع مساعدتك اليوم؟', ts: Date.now() - 1000 }], notifications: [] }; }
        function loadState() { try { const raw = localStorage.getItem(STORAGE_KEY); if (!raw) return getDefaultState(); const parsed = JSON.parse(raw); return parsed.sellers ? parsed : getDefaultState(); } catch { return getDefaultState(); } }
        function saveState(state: any) { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
        function isAdmin(seller: any) { return seller?.isAdmin === true; }
        function createSeller(data: any) { return { id: 's_' + generateId(), ...data, points: 0, verified: false, subscription: 'free', products: [], createdAt: Date.now(), isAdmin: false, vipExpiry: null, avatar: '' }; }
        function createProduct(data: any) { return { id: 'p_' + generateId(), ...data, likes: 0, likedBy: [], createdAt: Date.now(), vip: false, comments: [], rating: 0 }; }
        function addChatMessage(state: any, msg: any) { return { ...state, chatMessages: [...state.chatMessages, { ...msg, id: generateId(), ts: Date.now() }] }; }
        function getBotResponse(msg: string) {
            const m = msg.toLowerCase();
            if (m.includes('سعر')) return 'يمكنك الاطلاع على الأسعار من الصفحة الرئيسية. هل تبحث عن منتج معين؟';
            if (m.includes('بائع')) return 'للانضمام كبائع: اضغط "حسابي" ثم "انضم كتاجر جديد". مجاني!';
            if (m.includes('نقاط')) return 'يمكنك شراء النقاط من صفحة المتجر (حسابي ← المتجر والنقاط).';
            return 'شكراً لتواصلك! يمكنني مساعدتك في البحث عن منتجات، التسجيل كبائع، أو أي استفسار آخر.';
        }

        const { useState, useEffect, useCallback, useRef } = React;

        // ==================== مكونات الموقع بعد الإصلاح ====================

        // ----- بطاقة المنتج -----
        const ProductCard = ({ product, isLiked, onLike, onWhatsApp, onClick, onComment, onRate, t, isVIPseller }: any) => {
            const ratingStars = (rating: number) => {
                let stars = [];
                for (let i = 1; i <= 5; i++) stars.push(<i key={i} className={`fas fa-star ${i <= rating ? 'text-yellow-400' : 'text-gray-300'} text-xs cursor-pointer`} onClick={(e) => { e.stopPropagation(); onRate(i); }}></i>);
                return stars;
            };
            const shortSeller = product.sellerName.length > 12 ? product.sellerName.slice(0, 10) + '..' : product.sellerName;
            return (
                <div onClick={onClick} className="bg-white rounded-xl border shadow-sm overflow-hidden cursor-pointer hover:shadow-md transition relative">
                    {product.vip && <span className="absolute top-2 right-2 bg-yellow-400 text-white rounded-full px-2 py-0.5 text-xs z-10"><i className="fas fa-crown"></i> VIP</span>}
                    <div className="aspect-square flex items-center justify-center bg-gray-50 text-7xl">{product.emoji}</div>
                    <div className="p-3">
                        <h3 className="font-semibold line-clamp-2">{product.name}</h3>
                        <p className="text-blue-600 font-bold mt-1">{product.price.toLocaleString()} {t('currency')}</p>
                        <div className="flex justify-between items-start mt-2 pt-2 border-t gap-1">
                            <div className="text-xs text-gray-500 whitespace-normal break-words max-w-[90px] leading-tight">{shortSeller} {isVIPseller && <i className="fas fa-crown text-yellow-500 text-xs"></i>}</div>
                            <div className="flex gap-2 shrink-0">
                                <button onClick={(e) => { e.stopPropagation(); onLike(); }} className={`p-1.5 rounded-full transition ${isLiked ? 'bg-orange-500 text-white' : 'bg-gray-100'}`}><i className="fas fa-heart text-sm"></i></button>
                                <button onClick={(e) => { e.stopPropagation(); onWhatsApp(); }} className="p-1.5 rounded-full bg-green-100 text-green-600 hover:bg-orange-500 hover:text-white"><i className="fab fa-whatsapp text-sm"></i></button>
                                <button onClick={(e) => { e.stopPropagation(); onComment(); }} className="p-1.5 rounded-full bg-blue-100 text-blue-600 hover:bg-orange-500 hover:text-white"><i className="fas fa-comment text-sm"></i></button>
                            </div>
                        </div>
                        <div className="flex gap-1 mt-2 justify-center">{ratingStars(product.rating)}</div>
                    </div>
                </div>
            );
        };

        // ----- صفحة الرئيسية -----
        const HomePage = ({ products, sellers, currentSellerId, selectedCountry, onLike, onWhatsApp, onProductClick, onAccountBtn, onShowOffers, onShowVIPPage, imgSearchResults, onClearImgSearch, onComment, onRate, searchText, onSearchChange, showSearchBar, t }: any) => {
            const [selectedCategory, setSelectedCategory] = useState('all');
            const [viewMode, setViewMode] = useState('grid');
            const filtered = React.useMemo(() => {
                let arr = Object.values(products).filter((p: any) => p.sellerCountry === selectedCountry);
                if (selectedCategory !== 'all') arr = arr.filter((p: any) => p.category === selectedCategory);
                arr.sort((a: any, b: any) => {
                    const sa = sellers[a.sellerId], sb = sellers[b.sellerId];
                    const va = sa?.subscription !== 'free' && sa?.vipExpiry > Date.now();
                    const vb = sb?.subscription !== 'free' && sb?.vipExpiry > Date.now();
                    if (va && !vb) return -1;
                    if (!va && vb) return 1;
                    return 0;
                });
                return arr;
            }, [products, selectedCategory, selectedCountry, sellers]);
            const display = imgSearchResults || filtered;
            const isLiked = (p: any) => currentSellerId ? p.likedBy.includes(currentSellerId) : false;
            return (
                <div className="flex flex-col h-full">
                    {showSearchBar && (
                        <div className="bg-white px-4 pb-3 pt-2 border-b">
                            <div className="relative"><i className="fas fa-search absolute right-3 top-3 text-gray-400"></i><input type="text" placeholder={t('search_placeholder')} className="w-full p-3 pr-10 bg-gray-100 rounded-xl" value={searchText} onChange={(e) => onSearchChange(e.target.value)} autoFocus /></div>
                        </div>
                    )}
                    <div className="sticky top-0 z-10 bg-white border-b px-2 py-2 overflow-x-auto scrollbar-hide"><div className="flex gap-2">{categories.map((cat: any) => (<button key={cat.id} onClick={() => { setSelectedCategory(cat.id); onClearImgSearch(); }} className={`flex items-center gap-1 px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap transition ${selectedCategory === cat.id && !imgSearchResults ? 'bg-orange-500 text-white' : 'bg-gray-100 text-gray-700 hover:bg-orange-100'}`}><i className={`fas ${cat.icon} text-xs`}></i> {t(cat.id) || cat.label}</button>))}</div></div>
                    <div className="flex items-center gap-3 px-4 py-3 bg-white border-b">
                        <button onClick={onAccountBtn} className="flex gap-2 px-4 py-2 rounded-xl bg-gray-100 text-sm"><i className="fas fa-user-circle"></i> {t('my_account')}</button>
                        <button onClick={onShowOffers} className="flex gap-2 px-4 py-2 rounded-xl bg-orange-50 text-orange-600 text-sm">{t('offers')}</button>
                        <button onClick={onShowVIPPage} className="flex gap-2 px-4 py-2 rounded-xl bg-yellow-50 text-yellow-700 text-sm">{t('vip_subscriptions')}</button>
                        <div className="flex-1"></div>
                        <button onClick={() => setViewMode('grid')} className={`p-2 rounded-xl transition ${viewMode === 'grid' ? 'bg-orange-500 text-white' : 'bg-gray-100'}`}><i className="fas fa-th-large"></i></button>
                        <button onClick={() => setViewMode('list')} className={`p-2 rounded-xl transition ${viewMode === 'list' ? 'bg-orange-500 text-white' : 'bg-gray-100'}`}><i className="fas fa-list-ul"></i></button>
                    </div>
                    <div className="flex-1 overflow-auto p-4">
                        {display.length === 0 ? <div className="text-center py-20 text-gray-400"><i className="fas fa-box-open text-5xl"></i><p>{t('no_products')}</p></div> : 
                            <div className="grid grid-cols-2 gap-4">{display.map((p: any) => { const seller = sellers[p.sellerId]; return <ProductCard key={p.id} product={p} isLiked={isLiked(p)} onLike={() => onLike(p.id)} onWhatsApp={() => onWhatsApp(p)} onClick={() => onProductClick(p)} onComment={() => onComment(p.id)} onRate={(rating: number) => onRate(p.id, rating)} t={t} isVIPseller={seller?.subscription !== 'free' && seller?.vipExpiry > Date.now()} />; })}</div>
                        }
                    </div>
                </div>
            );
        };

        // ----- صفحة VIP المعاد بناؤها (بدون أخطاء) -----
        const VIPPage = ({ seller, onBack, onPurchaseSubscription, t }: any) => {
            const [planType, setPlanType] = useState('monthly');
            const monthlyPlans = [
                { id: 'silver', name: t('silver'), price: 99, features: ['50 منتج', 'دعم أساسي', 'نقاط مضاعفة'], color: '#9ca3af' },
                { id: 'gold', name: t('gold'), price: 199, features: ['منتجات غير محدودة', 'دعم أولوية', 'نقاط ×2', 'ظهور مميز'], color: '#d4af37' },
                { id: 'platinum', name: t('platinum'), price: 299, features: ['كل ميزات الذهبي', 'استشارات تسويقية', 'توثيق مجاني'], color: '#e5e4e2' }
            ];
            const yearlyPlans = [
                { id: 'silver', name: t('silver'), price: 990, features: ['50 منتج', 'دعم أساسي', 'نقاط مضاعفة', 'خصم 15%'], color: '#9ca3af' },
                { id: 'gold', name: t('gold'), price: 1990, features: ['منتجات غير محدودة', 'دعم أولوية', 'نقاط ×3', 'ظهور مميز', 'خصم 20%'], color: '#d4af37' },
                { id: 'platinum', name: t('platinum'), price: 2990, features: ['كل ميزات الذهبي', 'استشارات تسويقية', 'توثيق مجاني', 'خصم 25%'], color: '#e5e4e2' }
            ];
            const currentPlans = planType === 'monthly' ? monthlyPlans : yearlyPlans;
            const buySubscription = (plan: any) => {
                const phone = '201113694362';
                const msg = encodeURIComponent(`طلب اشتراك VIP من التاجر ${seller.storeName} - الباقة: ${plan.name} - المبلغ: ${plan.price} ${t('currency')}`);
                window.open(`https://wa.me/2${phone}?text=${msg}`, '_blank');
                alert(`تم إرسال طلب الاشتراك إلى الإدارة عبر واتساب. سيتم تفعيل اشتراكك بعد تأكيد الدفع.`);
                if (window.confirm(`هل تريد تفعيل الاشتراك تجريبياً (محاكاة)؟`)) {
                    onPurchaseSubscription(plan.id, plan.price);
                }
            };
            return (
                <div className="flex flex-col h-full bg-black">
                    <div className="flex items-center p-4 border-b border-gray-800 bg-black/90">
                        <button onClick={onBack} className="text-white hover:text-yellow-500 transition"><i className="fas fa-arrow-right ml-2"></i> {t('back')}</button>
                        <h1 className="flex-1 text-center font-bold text-white"><i className="fas fa-crown text-yellow-500 ml-2"></i> {t('vip_membership')}</h1>
                    </div>
                    <div className="flex-1 overflow-auto p-4 bg-gradient-to-b from-gray-900 to-black">
                        <div className="flex justify-center gap-4 mb-8"><button onClick={() => setPlanType('monthly')} className={`px-6 py-2 rounded-full font-semibold transition ${planType === 'monthly' ? 'bg-yellow-600 text-white shadow-lg' : 'bg-gray-800 text-gray-300'}`}>{t('monthly')}</button><button onClick={() => setPlanType('yearly')} className={`px-6 py-2 rounded-full font-semibold transition ${planType === 'yearly' ? 'bg-yellow-600 text-white shadow-lg' : 'bg-gray-800 text-gray-300'}`}>{t('yearly')} <span className="text-xs text-yellow-500">-20%</span></button></div>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">{currentPlans.map((plan: any) => (<div key={plan.id} className="vip-card rounded-2xl p-6 bg-gray-900 border border-yellow-700 hover:border-yellow-500 transition-all duration-300"><div className="text-center"><div className="text-5xl mb-2">{plan.id === 'gold' ? '👑' : plan.id === 'platinum' ? '💎' : '⭐'}</div><h2 className="text-2xl font-bold text-white">{plan.name}</h2><p className="text-3xl font-bold mt-3 text-yellow-500">{plan.price} {t('currency')}<span className="text-sm text-gray-400">/{planType === 'monthly' ? t('monthly') : t('yearly')}</span></p><ul className="mt-4 space-y-2 text-gray-300 text-right">{plan.features.map((f: string, idx: number) => <li key={idx} className="flex items-center gap-2"><i className="fas fa-check-circle text-green-500 text-sm"></i> {f}</li>)}</ul><button onClick={() => buySubscription(plan)} className="mt-6 w-full py-3 bg-yellow-600 hover:bg-yellow-500 text-black font-bold rounded-xl transition">{t('subscribe_now')}</button></div></div>))}</div>
                        <p className="text-xs text-center text-gray-500 mt-6">{t('free_plan_note')}</p>
                    </div>
                </div>
            );
        };

        // ----- صفحة التسجيل المبسطة (الخانات المطلوبة فقط) -----
        const JoinPage = ({ sellers, onRegister, onBack, t }: any) => {
            const [form, setForm] = useState({ ownerName: '', phone: '', email: '', password: '', country: 'مصر' });
            const [err, setErr] = useState('');
            const [otpSent, setOtpSent] = useState(false);
            const [otpCode, setOtpCode] = useState('');
            const [userOtp, setUserOtp] = useState('');
            
            // دالة تعبئة بيانات وسائل التواصل بشكل صحيح (اسم المالك والبريد فقط)
            const fillSocial = (type: string) => {
                if (type === 'google') {
                    setForm({ ...form, ownerName: 'محمد جوجل', email: 'user@gmail.com', phone: '', country: form.country, password: form.password });
                } else if (type === 'facebook') {
                    setForm({ ...form, ownerName: 'أحمد فيسبوك', email: 'user@facebook.com', phone: '', country: form.country, password: form.password });
                } else {
                    setForm({ ...form, ownerName: '', email: '', phone: '' });
                }
            };
            const sendOtp = () => {
                if (!form.email.trim()) { setErr('أدخل البريد الإلكتروني أولاً'); return; }
                const fakeOtp = Math.floor(100000 + Math.random() * 900000).toString();
                setOtpCode(fakeOtp);
                setOtpSent(true);
                alert(`[محاكاة] تم إرسال كود التفعيل ${fakeOtp} إلى بريد ${form.email}`);
            };
            const doRegister = () => {
                if (!otpSent) { setErr('يجب تأكيد البريد عبر كود التفعيل'); return; }
                if (userOtp !== otpCode) { setErr('كود التفعيل غير صحيح'); return; }
                if (!form.ownerName.trim() || !form.phone.trim() || !form.email.trim() || !form.password.trim()) { setErr('جميع الحقول مطلوبة'); return; }
                if (Object.values(sellers).some((s: any) => s.email === form.email.trim())) { setErr('البريد مستخدم'); return; }
                onRegister(createSeller({ ...form, storeName: form.ownerName + ' Store', district: '', country: form.country }));
            };
            return (
                <div className="flex flex-col h-full bg-white"><div className="flex p-4 border-b"><button onClick={onBack} className="hover:text-orange-500"><i className="fas fa-arrow-right ml-2"></i>{t('back')}</button><h1 className="flex-1 text-center font-bold">{t('join_seller_title')}</h1></div>

            useEffect(() => { if (darkMode) document.body.classList.add('dark'); else document.body.classList.remove('dark'); localStorage.setItem(THEME_KEY, darkMode ? 'dark' : 'light'); }, [darkMode]);
            useEffect(() => { localStorage.setItem(COUNTRY_KEY, selectedCountry); }, [selectedCountry]);

            if (!state) return <div className="min-h-screen flex items-center justify-center"><div className="animate-pulse text-2xl text-orange-500">VICKS MARKET</div></div>;

            const currentSeller = state.currentSellerId ? state.sellers[state.currentSellerId] : null;
            const isAdminUser = currentSeller?.isAdmin === true;
            const updateState = (updater: any) => setState((prev: any) => updater(prev));

            const handleLogin = (s: any) => { updateState((st: any) => ({ ...st, currentSellerId: s.id })); setPage(isAdmin(s) ? 'admin' : 'seller'); };
            const handleRegister = (s: any) => { updateState((st: any) => ({ ...st, sellers: { ...st.sellers, [s.id]: s }, currentSellerId: s.id })); setPage('seller'); };
            const handleLogout = () => { updateState((st: any) => ({ ...st, currentSellerId: null })); setPage('home'); };
            const handleLike = (pid: string) => { if (!currentSeller) return; updateState((s: any) => { const p = s.products[pid]; if (!p) return s; const liked = p.likedBy.includes(currentSeller.id); const newLiked = liked ? p.likedBy.filter((id: string) => id !== currentSeller.id) : [...p.likedBy, currentSeller.id]; return { ...s, products: { ...s.products, [pid]: { ...p, likes: liked ? p.likes - 1 : p.likes + 1, likedBy: newLiked } } }; }); };
            const handleWhatsApp = (p: any) => { const phone = state.sellers[p.sellerId]?.phone?.replace(/\D/g, '') || '201113694362'; const msg = encodeURIComponent(`مرحباً مهتم بـ ${p.name} بسعر ${p.price} ج.م`); window.open(`https://wa.me/2${phone}?text=${msg}`, '_blank'); };
            const handleAddProduct = (data: any) => { if (!currentSeller) return; if (editingProduct) { updateState((s: any) => ({ ...s, products: { ...s.products, [editingProduct.id]: { ...s.products[editingProduct.id], ...data } } })); } else { const newP = createProduct({ ...data, sellerId: currentSeller.id, sellerName: currentSeller.storeName, sellerCountry: currentSeller.country }); updateState((s: any) => ({ ...s, products: { ...s.products, [newP.id]: newP }, sellers: { ...s.sellers, [currentSeller.id]: { ...s.sellers[currentSeller.id], products: [...(s.sellers[currentSeller.id]?.products || []), newP.id] } } })); } setEditingProduct(null); setPage('seller'); };
            const handleDeleteProduct = (pid: string) => { if (confirm('حذف المنتج؟')) updateState((s: any) => { const np = { ...s.products }; delete np[pid]; const ns = { ...s.sellers }; if (ns[currentSeller.id]) ns[currentSeller.id].products = ns[currentSeller.id].products.filter((id: string) => id !== pid); return { ...s, products: np, sellers: ns }; }); };
            const handleSendMessage = (text: string) => { updateState((s: any) => { let ns = addChatMessage(s, { role: 'user', text }); ns = addChatMessage(ns, { role: 'bot', text: getBotResponse(text) }); return ns; }); };
            const handleImageUpload = (file: any) => { alert(`تم رفع الصورة: ${file.name}. سيتم إرسالها إلى الدعم.`); };
            const handlePurchaseComplete = (type: string, amt: number, pts?: number) => { updateState((s: any) => { const seller = s.sellers[currentSeller.id]; return { ...s, sellers: { ...s.sellers, [currentSeller.id]: { ...seller, points: seller.points + (pts || 0), verified: type === 'verify' ? true : seller.verified } } }; }); };
            const handleSubscriptionPurchase = (planId: string, price: number) => { updateState((s: any) => { const seller = s.sellers[currentSeller.id]; return { ...s, sellers: { ...s.sellers, [currentSeller.id]: { ...seller, subscription: planId, vipExpiry: Date.now() + 86400000 * 30 } } }; }); alert(`تم الترقية إلى باقة ${planId} بنجاح!`); setPage('seller'); };
            const handleDeleteSeller = (sid: string) => { if (confirm('حذف البائع؟')) updateState((s: any) => { const ns = { ...s.sellers }; delete ns[sid]; const np = { ...s.products }; Object.keys(np).forEach(pid => { if (np[pid].sellerId === sid) delete np[pid]; }); return { ...s, sellers: ns, products: np }; }); };
            const handleAdminDeleteProduct = (pid: string) => { if (confirm('حذف المنتج؟')) updateState((s: any) => { const np = { ...s.products }; delete np[pid]; return { ...s, products: np }; }); };
            const handleAddProductForSeller = (sid: string, pname: string, pprice: number) => { updateState((s: any) => { const seller = s.sellers[sid]; if (!seller) return s; const newP = createProduct({ name: pname, price: pprice, category: 'electronics', emoji: '📦', description: '', sellerId: sid, sellerName: seller.storeName, sellerCountry: seller.country, vip: false }); return { ...s, products: { ...s.products, [newP.id]: newP }, sellers: { ...s.sellers, [sid]: { ...seller, products: [...seller.products, newP.id] } } }; }); alert('تمت الإضافة'); };
            const handleActivateVIP = (sid: string) => { if (confirm('تفعيل VIP للبائع؟')) updateState((s: any) => { const seller = s.sellers[sid]; if (!seller) return s; return { ...s, sellers: { ...s.sellers, [sid]: { ...seller, subscription: 'gold', vipExpiry: Date.now() + 86400000 * 30 } } }; }); alert('تم تفعيل VIP'); };
            const handleCameraSearch = (e: any) => { const file = e.target.files[0]; if (!file) return; setImgSearchLoading(true); setTimeout(() => { const filtered = Object.values(state.products).filter((p: any) => p.name.includes(searchText) || (!searchText)); setImgSearchResults(filtered.slice(0, 12)); setImgSearchLoading(false); }, 1000); if (cameraRef.current) (cameraRef.current as any).value = ''; };
            const handleSearchChange = (val: string) => { setSearchText(val); if (val.trim() === '') setImgSearchResults(null); else { const filtered = Object.values(state.products).filter((p: any) => p.name.includes(val) || p.sellerName.includes(val)); setImgSearchResults(filtered); } };
            const showHome = () => { setPage('home'); setDetailProduct(null); setImgSearchResults(null); setSearchText(''); setShowSearchBar(false); };
            const handleComment = (pid: string, text: string) => { updateState((s: any) => { const p = s.products[pid]; const newComments = [...(p.comments || []), text]; return { ...s, products: { ...s.products, [pid]: { ...p, comments: newComments } } }; }); };
            const handleRate = (pid: string, rating: number) => { updateState((s: any) => { const p = s.products[pid]; return { ...s, products: { ...s.products, [pid]: { ...p, rating } } }; }); };
            const isLiked = (p: any) => currentSeller ? p.likedBy.includes(currentSeller.id) : false;

            return (
                <div className="min-h-screen flex flex-col transition-colors duration-300">
                    {page === 'home' && (
                        <>
                            <header className="sticky top-0 z-20 bg-white border-b px-3 py-2 flex items-center justify-between">
                                <div className="flex items-center gap-2"><i className="fas fa-store text-orange-500 text-base"></i><span className="text-sm font-bold text-orange-600">VICKS MARKET</span></div>
                                <div className="flex gap-2">
                                    <button onClick={() => (cameraRef.current as any)?.click()} className="p-1.5 rounded-xl bg-gray-100 hover:bg-orange-500 hover:text-white"><i className="fas fa-camera text-sm"></i></button>
                                    <button onClick={() => setShowSearchBar(!showSearchBar)} className="p-1.5 rounded-xl bg-gray-100 hover:bg-orange-500 hover:text-white"><i className="fas fa-search text-sm"></i></button>
                                    <button onClick={() => setDarkMode(!darkMode)} className="p-1.5 rounded-xl bg-gray-100"><i className={`fas fa-${darkMode ? 'sun' : 'moon'} text-sm`}></i></button>
                                    {isAdminUser && <button onClick={() => setPage('admin')} className="p-1.5 rounded-xl bg-gray-100"><i className="fas fa-cogs"></i></button>}
                                    <button onClick={() => currentSeller ? setPage('seller') : setPage('login')} className="p-1.5 rounded-xl bg-gray-100"><i className="fas fa-user-circle text-sm"></i></button>
                                </div>
                                <input ref={cameraRef} type="file" accept="image/*" capture="environment" className="hidden" onChange={handleCameraSearch} />
                            </header>
                            {imgSearchLoading && <div className="bg-blue-50 p-2 text-center"><i className="fas fa-spinner fa-pulse"></i> جاري البحث...</div>}
                            <main className="flex-1 overflow-hidden">
                                <HomePage products={state.products} sellers={state.sellers} currentSellerId={state.currentSellerId} selectedCountry={selectedCountry} onLike={handleLike} onWhatsApp={handleWhatsApp} onProductClick={p => { setDetailProduct(p); setPage('detail'); }} onAccountBtn={() => setPage('settings')} onShowOffers={() => setPage('offers')} onShowVIPPage={() => setPage('vip')} imgSearchResults={imgSearchResults} onClearImgSearch={() => { setImgSearchResults(null); setSearchText(''); }} onComment={(pid: string) => { const c = prompt(t('write_comment')); if (c) handleComment(pid, c); }} onRate={handleRate} searchText={searchText} onSearchChange={handleSearchChange} showSearchBar={showSearchBar} t={t} />
                            </main>
                            <button onClick={() => setPage('chat')} className="fixed bottom-6 right-6 w-14 h-14 rounded-full bg-orange-500 text-white shadow-lg flex items-center justify-center z-30"><i className="fas fa-robot text-2xl"></i></button>
                        </>
                    )}
                    {page === 'offers' && <OffersPage products={state.products} selectedCountry={selectedCountry} onProductClick={p => { setDetailProduct(p); setPage('detail'); }} onBack={showHome} t={t} />}
                    {page === 'vip' && (!currentSeller ? <div className="p-6 text-center">الرجاء تسجيل الدخول أولاً</div> : <VIPPage seller={currentSeller} onBack={showHome} onPurchaseSubscription={handleSubscriptionPurchase} t={t} />)}
                    {page === 'admin' && currentSeller && isAdminUser && <AdminDashboard sellers={state.sellers} products={state.products} onBack={showHome} onDeleteSeller={handleDeleteSeller} onDeleteProduct={handleAdminDeleteProduct} onAddProductForSeller={handleAddProductForSeller} onActivateVIP={handleActivateVIP} t={t} />}
                    {page === 'login' && <LoginPage sellers={state.sellers} onLogin={handleLogin} onGoJoin={() => setPage('join')} onBack={showHome} t={t} />}
                    {page === 'join' && <JoinPage sellers={state.sellers} onRegister={handleRegister} onBack={() => setPage('login')} t={t} />}
                    {page === 'seller' && currentSeller && <SellerPage seller={state.sellers[currentSeller.id]} products={state.products} onGoStore={() => setPage('store')} onGoChat={() => setPage('chat')} onAddProduct={() => { setEditingProduct(null); setPage('addProduct'); }} onEditProduct={p => { setEditingProduct(p); setPage('addProduct'); }} onDeleteProduct={handleDeleteProduct} onLogout={handleLogout} onBack={showHome} onChangeLang={setLang} currentLang={lang} t={t} onOpenSettings={() => setPage('settings')} />}
                    {page === 'store' && currentSeller && <StorePage seller={state.sellers[currentSeller.id]} onBack={() => setPage('seller')} onPurchaseComplete={handlePurchaseComplete} t={t} />}
                    {page === 'chat' && <ChatPage messages={state.chatMessages} onSendMessage={handleSendMessage} onBack={() => setPage(currentSeller ? 'seller' : 'home')} t={t} onImageUpload={handleImageUpload} />}
                    {page === 'addProduct' && currentSeller && <AddProductPage onSave={handleAddProduct} onBack={() => { setEditingProduct(null); setPage('seller'); }} editProduct={editingProduct} sellerCountry={currentSeller.country} t={t} />}
                    {page === 'detail' && detailProduct && <ProductDetailPage product={state.products[detailProduct.id] || detailProduct} seller={state.sellers[detailProduct.sellerId] || null} isLiked={isLiked(state.products[detailProduct.id] || detailProduct)} onLike={() => handleLike(detailProduct.id)} onBack={showHome} onComment={(text: string) => handleComment(detailProduct.id, text)} onRate={(rating: number) => handleRate(detailProduct.id, rating)} t={t} />}
                    {page === 'settings' && currentSeller && <SettingsPage seller={currentSeller} selectedCountry={selectedCountry} setSelectedCountry={setSelectedCountry} t={t} />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
