<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>VICKS MARKET | منصة تجارة عالمية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --orange: #ff6600;
            --orange-light: #fff7ed;
            --bg-light: #ffffff;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-sub: #6b7280;
            --border: #e5e7eb;
            --input-bg: #f3f4f6;
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        body.dark {
            --bg-light: #0a0a0a;
            --card-bg: #121212;
            --text-main: #ffffff;
            --text-sub: #cccccc;
            --border: #2a2a2a;
            --orange-light: #1a1006;
            --input-bg: #1e1e1e;
            --shadow: 0 2px 8px rgba(255, 255, 255, 0.04);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-light);
            color: var(--text-main);
            max-width: 100vw;
            overflow-x: hidden;
            transition: background 0.3s, color 0.3s;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 100vw;
            overflow-x: hidden;
        }

        .header {
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 30;
            gap: 8px;
            box-shadow: var(--shadow);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .logo-text {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--orange);
            white-space: nowrap;
        }

        .content-scroll {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding-bottom: 20px;
            -webkit-overflow-scrolling: touch;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding: 12px;
        }

        .product-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 8px;
        }

        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            transition: box-shadow 0.2s, transform 0.15s;
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow);
        }

        .product-card:active {
            transform: scale(0.98);
        }

        .product-card.list-view {
            flex-direction: row;
            gap: 12px;
            padding: 10px;
            align-items: stretch;
        }

        .product-image {
            background: #f9fafb;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            cursor: pointer;
            transition: background 0.2s;
            position: relative;
            overflow: hidden;
            font-size: 3.5rem;
        }

        body.dark .product-image {
            background: #1a1a1a;
        }

        .grid-card .product-image {
            height: 140px;
            border-radius: 0;
        }

        .list-card .product-image {
            width: 85px;
            height: 85px;
            font-size: 2.5rem;
            border-radius: 12px;
        }

        .card-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 10px 12px 12px;
            gap: 6px;
            min-width: 0;
        }

        .list-view .card-body {
            padding: 0;
            gap: 4px;
        }

        .product-name {
            font-weight: 700;
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: center;
            color: var(--text-main);
            line-height: 1.3;
        }

        .list-view .product-name {
            text-align: right;
            font-size: 0.85rem;
        }

        .stars {
            display: flex;
            gap: 2px;
            flex-shrink: 0;
            direction: ltr;
            justify-content: center;
        }

        .list-view .stars {
            justify-content: flex-start;
        }

        .stars i {
            font-size: 13px;
            color: #fbbf24;
            cursor: default;
        }

        .condition-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: #f97316;
            color: white;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 2px 10px;
            border-radius: 12px;
            z-index: 2;
        }

        .price {
            font-weight: 800;
            color: var(--orange);
            font-size: 1rem;
            white-space: nowrap;
            text-align: center;
            margin-top: 4px;
        }

        .list-view .price {
            text-align: right;
        }

        .search-overlay {
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            padding: 10px 14px;
            animation: slideDown 0.25s ease;
            flex-shrink: 0;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .search-wrapper {
            display: flex;
            align-items: center;
            background: var(--input-bg);
            border-radius: 24px;
            padding: 0 12px;
            gap: 8px;
            border: 1px solid var(--border);
        }

        .search-wrapper input {
            flex: 1;
            border: none;
            background: transparent;
            padding: 10px 4px;
            outline: none;
            font-size: 0.9rem;
            color: var(--text-main);
            min-width: 0;
        }

        .search-icon-btn {
            background: none;
            border: none;
            color: var(--text-sub);
            cursor: pointer;
            font-size: 1rem;
            padding: 6px;
            border-radius: 50%;
            transition: background 0.2s;
            flex-shrink: 0;
        }

        .icon-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--input-bg);
            color: var(--text-sub);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            transition: background 0.2s;
            flex-shrink: 0;
        }

        .icon-btn:hover {
            background: #e5e7eb;
        }
        body.dark .icon-btn:hover {
            background: #333;
        }

        .btn-primary {
            background: var(--orange);
            color: white;
            border: none;
            border-radius: 14px;
            padding: 12px 24px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9rem;
            width: 100%;
            transition: background 0.2s;
        }

        .btn-primary:hover {
            background: #e55d00;
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 12px;
            border-radius: 14px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid var(--border);
            background: var(--card-bg);
            color: var(--text-main);
            font-size: 0.85rem;
            transition: background 0.2s;
            margin-bottom: 8px;
        }

        .social-btn.google { border-color: #ea4335; color: #ea4335; }
        .social-btn.facebook { border-color: #1877f2; color: #1877f2; }
        .social-btn.email-signup { border-color: var(--orange); color: var(--orange); }
        .social-btn:hover { background: var(--input-bg); }

        .category-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 10px 14px;
            scrollbar-width: none;
            -ms-overflow-style: none;
            flex-shrink: 0;
            border-bottom: 1px solid var(--border);
            background: var(--card-bg);
        }
        .category-scroll::-webkit-scrollbar { display: none; }

        .category-chip {
            padding: 8px 18px;
            border-radius: 20px;
            border: 1px solid var(--border);
            cursor: pointer;
            white-space: nowrap;
            font-size: 0.8rem;
            font-weight: 600;
            background: var(--card-bg);
            color: var(--text-sub);
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .category-chip.active {
            background: var(--orange);
            color: white;
            border-color: var(--orange);
            font-weight: 700;
        }

        .comments-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.55);
            z-index: 90;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .comments-panel {
            background: var(--card-bg);
            border-radius: 18px 18px 0 0;
            width: 100%;
            max-height: 35vh;
            display: flex;
            flex-direction: column;
            animation: slideUp 0.3s ease;
            overflow: hidden;
        }

        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        .comments-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .comments-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 22vh;
        }

        .comment-bubble {
            background: var(--input-bg);
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 0.8rem;
            line-height: 1.4;
            color: var(--text-main);
            max-width: 90%;
            align-self: flex-start;
            border: 1px solid var(--border);
        }

        .comment-input-row {
            display: flex;
            gap: 8px;
            padding: 10px 16px;
            border-top: 1px solid var(--border);
            flex-shrink: 0;
            align-items: center;
        }

        .comment-input-row input {
            flex: 1;
            padding: 10px 14px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: var(--input-bg);
            outline: none;
            font-size: 0.8rem;
            color: var(--text-main);
            min-width: 0;
        }

        .send-comment-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--orange);
            color: white;
            border: none;
            cursor: pointer;
            flex-shrink: 0;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .toast {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: #1f2937;
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 0.8rem;
            z-index: 200;
            animation: toastIn 0.3s ease, toastOut 0.3s ease 1.8s forwards;
            pointer-events: none;
            white-space: nowrap;
        }

        @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
        @keyframes toastOut { from { opacity: 1; } to { opacity: 0; transform: translateX(-50%) translateY(-10px); } }

        .hidden-file-input {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
            pointer-events: none;
        }

        .chat-fullscreen {
            position: fixed;
            inset: 0;
            z-index: 80;
            background: var(--bg-light);
            display: flex;
            flex-direction: column;
            animation: fadeIn 0.2s ease;
        }

        .chat-fullscreen .chat-header-bar {
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: var(--orange);
            color: white;
            font-weight: bold;
            font-size: 1rem;
        }

        .chat-fullscreen .chat-messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .chat-fullscreen .chat-input-bar {
            flex-shrink: 0;
            display: flex;
            gap: 8px;
            padding: 10px 16px;
            border-top: 1px solid var(--border);
            background: var(--card-bg);
            align-items: center;
        }

        .chat-fullscreen .chat-input-bar input {
            flex: 1;
            padding: 10px 14px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: var(--input-bg);
            outline: none;
            font-size: 0.85rem;
            color: var(--text-main);
            min-width: 0;
        }

        .msg-user {
            background: var(--orange);
            color: white;
            padding: 10px 14px;
            border-radius: 16px 16px 4px 16px;
            max-width: 80%;
            align-self: flex-end;
            font-size: 0.82rem;
            line-height: 1.4;
        }

        .msg-bot {
            background: var(--input-bg);
            padding: 10px 14px;
            border-radius: 16px 16px 16px 4px;
            max-width: 80%;
            align-self: flex-start;
            font-size: 0.82rem;
            line-height: 1.4;
            color: var(--text-main);
            border: 1px solid var(--border);
        }

        .floating-ai-btn {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--orange);
            color: white;
            border: none;
            cursor: pointer;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            box-shadow: 0 6px 20px rgba(255, 102, 0, 0.5);
            transition: transform 0.2s, box-shadow 0.2s;
            animation: pulse-orange 2s infinite;
        }

        .floating-ai-btn:active {
            transform: scale(0.9);
            box-shadow: 0 3px 10px rgba(255, 102, 0, 0.4);
        }

        @keyframes pulse-orange {
            0% { box-shadow: 0 0 0 0 rgba(255,102,0,0.7); }
            70% { box-shadow: 0 0 0 14px rgba(255,102,0,0); }
            100% { box-shadow: 0 0 0 0 rgba(255,102,0,0); }
        }

        .separator-text {
            text-align: center;
            color: var(--text-sub);
            font-size: 0.78rem;
            margin: 12px 0 8px;
            opacity: 0.8;
        }

        .vip-card { /* بقية التنسيقات محفوظة */ }
        .offer-card { /* محفوظة */ }
        .old-price { text-decoration: line-through; color: #9ca3af; font-size: 0.75rem; margin-right: 6px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 6px; color: var(--text-sub); }
        .form-group input, .form-group select {
            width: 100%; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--border);
            background: var(--input-bg); font-size: 0.9rem; color: var(--text-main); outline: none;
        }
        .form-group input:focus { border-color: var(--orange); }
        .image-preview-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 100;
            display: flex; align-items: center; justify-content: center; flex-direction: column; cursor: pointer;
        }
        .spinner {
            display: inline-block; width: 20px; height: 20px;
            border: 3px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>

    <script>

            function signInWithGoogle(isSignUp = false) { /* ... نفس الكود بدون تغيير ... */ }

            // ==================== بيانات التطبيق (مُحسَّنة لتشمل فئات جديدة) ====================

                const sellers = {

                        likes: (i * 7) % 19,
                        likedBy: [],
                        comments: ['جيد جداً 👍', 'ممتاز وسرعة في التوصيل', 'سعر مناسب وجودة عالية'].slice(0, (i % 3) + 1),
                        rating: item.rating || (i % 5)
                    };
                });
                return { sellers, products, currentSellerId: null, chatMessages: [{ id: '1', role: 'bot', text: 'أهلاً بك في VICKS MARKET! كيف أقدر أساعدك؟', ts: Date.now() }] };
            }

            function loadState() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (raw) return JSON.parse(raw);
                } catch {}
                return createInitialData();
            }
            function saveState(st) { localStorage.setItem(STORAGE_KEY, JSON.stringify(st)); }

            let state = loadState();
            let currentPage = 'home';
            let viewMode = 'grid';
            let activeCategory = 'all';
            let searchQuery = '';
            let showSearch = false;
            let showChatFullscreen = false;
            let commentsProduct = null;
            let previewProduct = null;
            const appEl = document.getElementById('app');

            function showToast(msg) {
                const existing = document.querySelector('.toast');
                if (existing) existing.remove();
                const toast = document.createElement('div');
                toast.className = 'toast';
                toast.textContent = msg;
                document.body.appendChild(toast);
                setTimeout(() => toast.remove(), 2200);
            }

            function render() {
                appEl.innerHTML = '';
                if (showChatFullscreen) { appEl.appendChild(buildChatFullscreen()); return; }
                if (currentPage === 'login') { appEl.appendChild(buildLoginPage()); return; }
                if (currentPage === 'join') { appEl.appendChild(buildJoinPage()); return; }
                if (currentPage === 'vip') { appEl.appendChild(buildVIPPage()); return; }
                if (currentPage === 'offers') { appEl.appendChild(buildOffersPage()); return; }
                if (currentPage === 'profile') { appEl.appendChild(buildProfilePage()); return; }
                appEl.appendChild(buildHomePage());
                if (commentsProduct) appEl.appendChild(buildCommentsOverlay());
                if (previewProduct) appEl.appendChild(buildPreviewOverlay());
            }

            // ==================== الصفحة الرئيسية المعدلة ====================
            function buildHomePage() {
                const container = document.createElement('div');
                container.className = 'app-container';

                // الهيدر
                const header = document.createElement('div');
                header.className = 'header';
                header.innerHTML = `
                    <div class="header-right">
                        <button class="icon-btn" id="toggleSearchBtn"><i class="fas fa-search"></i></button>
                        <button class="icon-btn" id="darkModeBtn"><i class="fas fa-moon"></i></button>
                    </div>
                    <span class="logo-text">VICKS MARKET</span>
                    <div class="header-left">
                        <button class="icon-btn" id="menuBtn"><i class="fas fa-bars"></i></button>
                    </div>
                `;
                container.appendChild(header);

                // شريط البحث
                if (showSearch) {
                    const searchDiv = document.createElement('div');
                    searchDiv.className = 'search-overlay';
                    searchDiv.innerHTML = `
                        <div class="search-wrapper">
                            <input type="text" id="searchInput" placeholder="ابحث عن منتج..." value="${searchQuery}">
                            <button class="search-icon-btn" id="clearSearchBtn"><i class="fas fa-times"></i></button>
                        </div>
                    `;
                    container.appendChild(searchDiv);
                }

                // شريط الفئات (الأزرار الأفقية)
                const categories = [
                    { key: 'beauty', label: 'جمال وعناية' },
                    { key: 'supermarket', label: 'سوبر ماركت' },
                    { key: 'used', label: 'مستعمل' },
                    { key: 'all', label: 'الكل' }
                ];
                const catBar = document.createElement('div');
                catBar.className = 'category-scroll';
                categories.forEach(cat => {
                    const chip = document.createElement('div');
                    chip.className = 'category-chip' + (cat.key === activeCategory ? ' active' : '');
                    chip.textContent = cat.label;
                    chip.onclick = () => {
                        activeCategory = cat.key;
                        render();
                    };
                    catBar.appendChild(chip);
                });
                container.appendChild(catBar);

                // محتوى المنتجات
                const content = document.createElement('div');
                content.className = 'content-scroll';
                const productGrid = document.createElement('div');
                productGrid.className = viewMode === 'grid' ? 'product-grid' : 'product-list';

                // فلترة المنتجات
                let filtered = Object.values(state.products);
                if (activeCategory === 'used') {
                    filtered = filtered.filter(p => p.condition === 'used');
                } else if (activeCategory !== 'all') {
                    filtered = filtered.filter(p => p.category === activeCategory);
                }
                if (searchQuery.trim()) {
                    const q = searchQuery.trim().toLowerCase();
                    filtered = filtered.filter(p => p.name.toLowerCase().includes(q) || p.category.includes(q));
                }

                filtered.forEach(prod => {
                    const card = createProductCard(prod);
                    card.classList.add(viewMode === 'list' ? 'list-card' : 'grid-card');
                    card.classList.add(viewMode === 'list' ? 'list-view' : '');
                    productGrid.appendChild(card);
                });

                content.appendChild(productGrid);
                container.appendChild(content);

                // أحداث الأزرار
                setTimeout(() => {
                    document.getElementById('toggleSearchBtn')?.addEventListener('click', () => {
                        showSearch = !showSearch;
                        render();
                    });
                    document.getElementById('darkModeBtn')?.addEventListener('click', () => {
                        document.body.classList.toggle('dark');
                        localStorage.setItem(THEME_KEY, document.body.classList.contains('dark') ? 'dark' : 'light');
                    });
                    document.getElementById('menuBtn')?.addEventListener('click', () => {
                        alert('قائمة التطبيق (يمكنك تخصيصها)');
                    });
                    document.getElementById('clearSearchBtn')?.addEventListener('click', () => {
                        searchQuery = '';
                        document.getElementById('searchInput').value = '';
                        render();
                    });
                    const searchInput = document.getElementById('searchInput');
                    if (searchInput) {
                        searchInput.addEventListener('input', (e) => {
                            searchQuery = e.target.value;
                            render();
                        });
                    }
                    if (localStorage.getItem(THEME_KEY) === 'dark') {
                        document.body.classList.add('dark');
                    }
                }, 10);

                return container;
            }

            // ==================== بطاقة المنتج بتصميم جديد ====================
            function createProductCard(prod) {
                const seller = state.sellers[prod.sellerId] || {};
                const isLoggedIn = !!state.currentSellerId;
                const liked = isLoggedIn ? prod.likedBy.includes(state.currentSellerId) : isGuestLiked(prod.id);

                const card = document.createElement('div');
                card.className = 'product-card';
                card.onclick = (e) => {
                    if (e.target.closest('.action-btn')) return;
                    // فتح تفاصيل أو تعليقات (يمكن تحسينها)
                    commentsProduct = prod;
                    render();
                };

                // صورة المنتج
                const imgDiv = document.createElement('div');
                imgDiv.className = 'product-image';
                imgDiv.textContent = prod.emoji || '📦';
                if (prod.condition === 'used') {
                    const badge = document.createElement('span');
                    badge.className = 'condition-badge';
                    badge.textContent = 'استعمال';
                    imgDiv.appendChild(badge);
                }
                card.appendChild(imgDiv);

                // جسم البطاقة
                const body = document.createElement('div');
                body.className = 'card-body';

                const nameEl = document.createElement('div');
                nameEl.className = 'product-name';
                nameEl.textContent = prod.name;
                body.appendChild(nameEl);

                // النجوم
                const starsDiv = document.createElement('div');
                starsDiv.className = 'stars';
                for (let i = 1; i <= 5; i++) {
                    const star = document.createElement('i');
                    star.className = i <= prod.rating ? 'fas fa-star' : 'far fa-star';
                    starsDiv.appendChild(star);
                }
                body.appendChild(starsDiv);

                // السعر
                const priceEl = document.createElement('div');
                priceEl.className = 'price';
                priceEl.textContent = prod.price.toLocaleString() + ' ج.م';
                body.appendChild(priceEl);

                // أسفل البطاقة: إعجاب فقط
                const bottom = document.createElement('div');
                bottom.className = 'bottom-row';
                bottom.style.justifyContent = 'center';
                const likeBtn = document.createElement('button');
                likeBtn.className = 'action-btn';
                likeBtn.style.background = liked ? '#fee2e2' : '#f3f4f6';
                likeBtn.style.color = liked ? '#ef4444' : '#6b7280';
                likeBtn.innerHTML = '<i class="' + (liked ? 'fas' : 'far') + ' fa-heart"></i>';
                likeBtn.onclick = (e) => {
                    e.stopPropagation();
                    if (isLoggedIn) {
                        const idx = prod.likedBy.indexOf(state.currentSellerId);
                        if (idx >= 0) prod.likedBy.splice(idx, 1);
                        else prod.likedBy.push(state.currentSellerId);
                        prod.likes = prod.likedBy.length;
                    } else {
                        toggleGuestLike(prod.id);
                    }
                    saveState(state);
                    render();
                };
                bottom.appendChild(likeBtn);
                body.appendChild(bottom);

                card.appendChild(body);
                return card;
            }

            // ==================== بقية الصفحات والدوال بدون تغيير ====================
            function buildLoginPage() { /* ... الكود الأصلي ... */ }
            function login() { /* ... */ }
            function buildJoinPage() { /* ... */ }
            function registerSeller() { /* ... */ }
            function navigate(page) { currentPage = page; if (page === 'home') { showSearch = false; commentsProduct = null; previewProduct = null; } render(); }
            function buildCommentsOverlay() { /* ... */ }
            function buildPreviewOverlay() { /* ... */ }
            function buildVIPPage() { /* ... */ }
            function buildOffersPage() { /* ... */ }
            function buildProfilePage() { /* ... */ }
            function buildChatFullscreen() { /* ... */ }
            window.openChatFullscreen = () => { showChatFullscreen = true; render(); };

            // دوال Firebase مساعدة (مكانها الصحيح)
            function signInWithGoogle(isSignUp) { /* ... */ }
            function signInWithFacebook(isSignUp) { /* ... */ }

            render();
        })();
    </script>
</body>
</html>
