        .product-grid {

        }
        .product-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 8px;
        }
        .product-card-grid {
            background: white;
            border-radius: 12px;
            border: 1px solid #e5e7eb;

            flex-direction: column;
            cursor: pointer;
            transition: box-shadow 0.2s;

        }

        body.dark .product-card-grid {
            background: #121212;
            border-color: #ff6600;
        }

            cursor: pointer;

            text-align: center;

            cursor: pointer;

        .floating-bot-btn:hover {
