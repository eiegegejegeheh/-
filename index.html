    function ImagePreviewModal({ emoji, name, onClose }) {
        useEffect(() => {
            const esc = (e) => e.key==='Escape' && onClose();
            document.addEventListener('keydown', esc);
            document.body.style.overflow = 'hidden';
            return () => { document.removeEventListener('keydown', esc); document.body.style.overflow = ''; };
        }, [onClose]);
        return (
            <div className="image-preview-backdrop" onClick={onClose}>
                <div className="image-preview-container" onClick={e => e.stopPropagation()}>
                    <button className="image-preview-close" onClick={onClose}><i className="fas fa-times"></i></button>
                    <div className="flex flex-col items-center justify-center">
                        <span className="text-[10rem] md:text-[14rem] select-none">{emoji}</span>
                        {name && <p className="text-white text-lg mt-4 font-semibold opacity-80">{name}</p>}
                    </div>
                </div>
            </div>
        );
    }

    function ChatPage({ messages, onSend, onBack }) {
        const [input, setInput] = useState('');
        const fileRef = useRef(null);
        const camRef = useRef(null);
        const endRef = useRef(null);
        const send = () => { if(input.trim()) { onSend(input.trim()); setInput(''); } };
        useEffect(() => { endRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [messages]);
        return (
            <div className="flex flex-col relative bg-gray-50" style={{height:'100vh',overflow:'hidden'}}>
                <div className="flex items-center p-4 border-b bg-white z-10">
                    <button onClick={onBack} className="ml-2"><i className="fas fa-arrow-right text-lg"></i></button>
                    <h1 className="flex-1 text-center font-bold text-lg"><i className="fas fa-robot text-orange-500 ml-2"></i> VICKS AI</h1>
                </div>
                <div className="chat-watermark"><i className="fas fa-robot text-4xl"></i><span className="text-3xl font-bold">VICKS AI</span></div>
                <div className="messages-container flex-1" style={{position:'relative',zIndex:5}}>
                    {messages.map(m => (
                        <div key={m.id} className={`flex ${m.role==='user'?'justify-end':'justify-start'} mb-3`}>
                            <div className={`max-w-[75%] p-3 text-sm ${m.role==='user'?'message-bubble-user':'message-bubble-bot'}`}>{m.text}</div>
                        </div>
                    ))}
                    <div ref={endRef} />
                </div>
                <div className="chat-input-bar">
                    <button onClick={send} className="chat-icon-btn send-btn"><i className="fas fa-paper-plane"></i></button>
                    <input type="text" className="chat-input" placeholder="هيا نتحدث.." value={input}
                        onChange={e => setInput(e.target.value)} onKeyDown={e => e.key==='Enter' && send()} />
                    <div className="flex gap-2">
                        <button onClick={()=>fileRef.current.click()} className="chat-icon-btn"><i className="fas fa-plus"></i></button>
                        <button onClick={()=>camRef.current.click()} className="chat-icon-btn"><i className="fas fa-camera"></i></button>
                    </div>
                    <input ref={fileRef} type="file" className="hidden" />
                    <input ref={camRef} type="file" capture="environment" className="hidden" />
                </div>
            </div>

    function LoginPage({ sellers, onLogin, onGoJoin, onBack, onForgotPassword }) {
        const [email, setEmail] = useState('');
        const [pass, setPass] = useState('');
        const [err, setErr] = useState('');
        const dologin = () => {
            const e = email.trim();
            const p = pass.trim();
            if(!e || !p) { setErr('يرجى إدخال البريد الإلكتروني وكلمة المرور'); return; }
            const found = Object.values(sellers).find(s => s.email===e && s.password===p);
            if(found) { setErr(''); onLogin(found); return; }
            setErr('بيانات غير صحيحة');
        };

        // دوال تسجيل الدخول عبر Google و Facebook باستخدام Firebase
        const signInWithGoogle = async () => {
            if (!auth) {
                alert("Firebase غير مهيأ. أضف إعدادات المشروع في الكود.");
                return;
            }
            try {
                const provider = new firebase.auth.GoogleAuthProvider();
                const result = await auth.signInWithPopup(provider);
                const user = result.user;
                // تحقق مما إذا كان المستخدم موجودًا بالفعل في قاعدة البيانات المحلية
                let found = Object.values(sellers).find(s => s.email === user.email);
                if (!found) {
                    // إنشاء حساب جديد كعميل مؤقتًا (يمكن سؤاله لاحقًا)
                    const newUser = createSeller({
                        email: user.email,
                        password: 'google-oauth', // كلمة مرور افتراضية
                        storeName: '',
                        ownerName: user.displayName || 'مستخدم Google',
                        phone: user.phoneNumber || '',
                        avatar: user.photoURL ? '📷' : '👤',
                        accountType: 'customer',
                        country: 'مصر'
                    });
                    onLogin(newUser);
                } else {
                    onLogin(found);
                }
            } catch (error) {
                console.error(error);
                alert("فشل تسجيل الدخول عبر Google: " + (error.message || "أغلق المستخدم النافذة"));
            }
        };

        const signInWithFacebook = async () => {
            if (!auth) {
                alert("Firebase غير مهيأ. أضف إعدادات المشروع في الكود.");
                return;
            }
            try {
                const provider = new firebase.auth.FacebookAuthProvider();
                const result = await auth.signInWithPopup(provider);
                const user = result.user;
                let found = Object.values(sellers).find(s => s.email === user.email);
                if (!found) {
                    const newUser = createSeller({
                        email: user.email,
                        password: 'facebook-oauth',
                        storeName: '',
                        ownerName: user.displayName || 'مستخدم Facebook',
                        phone: user.phoneNumber || '',
                        avatar: user.photoURL ? '🖼️' : '👤',
                        accountType: 'customer',
                        country: 'مصر'
                    });
                    onLogin(newUser);
                } else {
                    onLogin(found);
                }
            } catch (error) {
                console.error(error);
                alert("فشل تسجيل الدخول عبر Facebook: " + (error.message || "أغلق المستخدم النافذة"));
            }
        };

        return (
            <div className="flex flex-col h-full bg-white min-h-screen">
                <div className="flex items-center p-4 border-b">
                    <button onClick={onBack}><i className="fas fa-arrow-right ml-2"></i> رجوع</button>
                    <h1 className="flex-1 text-center font-bold">تسجيل الدخول</h1>
                </div>
                <div className="p-6 space-y-4">
                    {err && <div className="bg-red-50 p-3 rounded-xl text-red-600 text-sm">{err}</div>}
                    <input className="w-full p-3 bg-gray-100 rounded-xl text-sm" placeholder="البريد الإلكتروني" value={email} onChange={e=>setEmail(e.target.value)} />
                    <input type="password" className="w-full p-3 bg-gray-100 rounded-xl text-sm" placeholder="كلمة المرور" value={pass} onChange={e=>setPass(e.target.value)} onKeyDown={e=>e.key==='Enter'&&dologin()} />
                    <button onClick={dologin} className="w-full py-3 bg-orange-500 text-white rounded-xl font-bold hover:bg-orange-600">دخول</button>
                    <div className="text-center">
                        <button onClick={onForgotPassword} className="text-sm text-orange-500 hover:text-orange-600 underline">نسيت كلمة السر؟</button>
                    </div>
                    <div className="relative my-4"><div className="absolute inset-0 flex items-center"><div className="w-full border-t border-gray-200"></div></div><div className="relative flex justify-center text-xs"><span className="bg-white px-3 text-gray-400">أو سجل الدخول عبر</span></div></div>
                    <button onClick={signInWithGoogle} className="social-btn google"><i className="fab fa-google text-lg"></i> الدخول عبر جوجل</button>
                    <button onClick={signInWithFacebook} className="social-btn facebook"><i className="fab fa-facebook-f text-lg"></i> الدخول عبر فيسبوك</button>
                    <div className="text-center text-gray-400 text-sm mt-4">أو</div>
                    <button onClick={onGoJoin} className="w-full py-3 border border-gray-200 rounded-xl hover:bg-gray-50 text-sm">انضم كتاجر أو عميل جديد</button>
                </div>
            </div>
        );
    }

    function JoinPage({ onRegister, onBack }) {
        // ... (existing code unchanged, but contactPreference added in createSeller)

        const [owner, setOwner] = useState('');
        const [email, setEmail] = useState('');
        const [pass, setPass] = useState('');

        const [accountType, setAccountType] = useState('customer');
        const [err, setErr] = useState('');

        const doJoin = () => {

            if(accountType==='seller' && !store.trim()) { setErr('اسم المتجر مطلوب للتجار'); return; }
            const newSeller = createSeller({
                email: email.trim(), password: pass.trim(),
                storeName: accountType==='seller'?store.trim():'',
                ownerName: owner.trim(), phone: phone.trim()||'01',
                country, accountType,
                avatar: accountType==='customer'?'👤':'🛍️'

                            <span className="text-sm">👤 حساب عميل</span>
                        </label>
                        <label className="flex items-center gap-2 cursor-pointer p-2 rounded-lg hover:bg-white">
                            <input type="radio" name="accountType" value="seller" checked={accountType==='seller'} onChange={()=>setAccountType('seller')} className="w-4 h-4 text-orange-500" />
                            <span className="text-sm">🛍️ حساب تاجر</span>
                        </label>
                    </div>
                    <input className="w-full p-3 bg-gray-100 rounded-xl text-sm" placeholder="اسم المالك *" value={owner} onChange={e=>setOwner(e.target.value)} />
                    {accountType==='seller' && <input className="w-full p-3 bg-gray-100 rounded-xl text-sm" placeholder="اسم المتجر *" value={store} onChange={e=>setStore(e.target.value)} />}
                    <input className="w-full p-3 bg-gray-100 rounded-xl text-sm" placeholder="البريد الإلكتروني *" value={email} onChange={e=>setEmail(e.target.value)} />
                    <input type="password" className="w-full p-3 bg-gray-100 rounded-xl text-sm" placeholder="كلمة المرور *" value={pass} onChange={e=>setPass(e.target.value)} />
                    <input className="w-full p-3 bg-gray-100 rounded-xl text-sm" placeholder="رقم الهاتف" value={phone} onChange={e=>setPhone(e.target.value)} />
                    <div className="relative">
                        <button type="button" onClick={()=>setShowCountries(!showCountries)}

                            <span>{country}</span>
                            <i className={`fas fa-chevron-${showCountries?'up':'down'} text-gray-400`}></i>

    // ========== Main App ==========
    function App() {
        const [state, setState] = useState(loadState);
        const [page, setPage] = useState('home'); // home, chat, login, join, vip, product, sellerProfile, forgot
        const [selectedProduct, setSelectedProduct] = useState(null);
        const [selectedSellerId, setSelectedSellerId] = useState(null);
        const [showSearchBar, setShowSearchBar] = useState(false);
        const [searchQuery, setSearchQuery] = useState('');
        const [imagePreview, setImagePreview] = useState(null);
        const [darkMode, setDarkMode] = useState(() => localStorage.getItem(THEME_KEY)==='dark');

        const currSeller = state.currentSellerId ? state.sellers[state.currentSellerId] : null;

        useEffect(() => {
            saveState(state);
        }, [state]);

        useEffect(() => {
            if (darkMode) {
                document.body.classList.add('dark');
            } else {
                document.body.classList.remove('dark');
            }
            localStorage.setItem(THEME_KEY, darkMode?'dark':'light');
        }, [darkMode]);

        const updateSeller = (id, updates) => {
            setState(prev => ({
                ...prev,
                sellers: { ...prev.sellers, [id]: { ...prev.sellers[id], ...updates } }
            }));
        };

        const handleLogin = (seller) => {
            setState(prev => ({ ...prev, currentSellerId: seller.id }));
            setPage('home');
        };

        const handleLogout = () => {
            setState(prev => ({ ...prev, currentSellerId: null }));
            setPage('home');
        };

        const handleRegister = (newSeller) => {
            setState(prev => ({
                ...prev,
                sellers: { ...prev.sellers, [newSeller.id]: newSeller },
                currentSellerId: newSeller.id
            }));
            setPage('home');
        };

        const handleLike = (productId) => {
            if (!state.currentSellerId) return;
            setState(prev => {
                const prods = { ...prev.products };
                const p = { ...prods[productId] };
                if (p.likedBy.includes(prev.currentSellerId)) {
                    p.likedBy = p.likedBy.filter(id => id !== prev.currentSellerId);
                    p.likes--;
                } else {
                    p.likedBy.push(prev.currentSellerId);
                    p.likes++;
                }
                prods[productId] = p;
                return { ...prev, products: prods };
            });
        };

        const handleRate = (productId, rating) => {
            if (!state.currentSellerId) return;
            setState(prev => {
                const prods = { ...prev.products };
                prods[productId] = { ...prods[productId], rating };
                return { ...prev, products: prods };
            });
        };

        const handleWhatsapp = (product, contactPref) => {
            if (!state.currentSellerId) return;
            const seller = state.sellers[product.sellerId];
            const phone = seller.phone || '01';
            if (contactPref === 'telegram') {
                window.open(`https://t.me/${phone}`, '_blank');
            } else {
                window.open(`https://wa.me/${phone}`, '_blank');
            }
        };

        const handleSendMessage = (text) => {
            setState(prev => addMessage(prev, { role: 'user', text }));
            setTimeout(() => {
                setState(prev => addMessage(prev, { role: 'bot', text: botReply(text) }));
            }, 800);
        };

        const handlePurchase = (type, opt) => {
            if (!currSeller) return;
            let cost = 0;
            let updates = {};
            if (type === 'verify') { cost = 70; updates = { verificationBadge: true }; }
            else if (type === 'max100') { cost = 50; updates = { maxProducts: 100 }; }
            else if (type === 'vip') { cost = 50; updates = { subscription: 'vip' }; }
            else if (type === 'sub' && opt) { cost = opt.cost; updates = { subscriptionExpiry: Date.now() + opt.months*30*86400000 }; }
            if (currSeller.points >= cost) {
                updateSeller(currSeller.id, { points: currSeller.points - cost, ...updates });
                alert('تمت العملية بنجاح!');
            } else {
                alert('لا يوجد لديك نقاط كافية');
            }
        };

        const handleAddPoints = (amount) => {
                if (currSeller) {
                updateSeller(currSeller.id, { points: currSeller.points + amount });
            }
        };

        const handleToggleContactPref = () => {
            if (!currSeller) return;
            const newPref = currSeller.contactPreference === 'whatsapp' ? 'telegram' : 'whatsapp';
            updateSeller(currSeller.id, { contactPreference: newPref });
        };

        // Navigation renderer
        const renderPage = () => {
            switch (page) {
                case 'chat':
                    return <ChatPage messages={state.chatMessages} onSend={handleSendMessage} onBack={() => setPage('home')} />;
                case 'login':
                    return <LoginPage sellers={state.sellers} onLogin={handleLogin} onGoJoin={() => setPage('join')} onBack={() => setPage('home')} onForgotPassword={() => setPage('forgot')} />;
                case 'join':
                    return <JoinPage onRegister={handleRegister} onBack={() => setPage('login')} />;
                case 'forgot':
                    return <ForgotPasswordPage onBack={() => setPage('login')} />;
                case 'vip':
                    return currSeller ? <VIPPage seller={currSeller} onBack={() => setPage('home')} onPurchase={handlePurchase} onAddPoints={handleAddPoints} /> : null;
                case 'product':
                    return selectedProduct ? (
                        <div className="flex flex-col h-full bg-white min-h-screen">
                            <div className="flex items-center p-4 border-b">
                                <button onClick={() => { setSelectedProduct(null); setPage('home'); }}><i className="fas fa-arrow-right ml-2"></i> رجوع</button>
                                <h1 className="flex-1 text-center font-bold truncate">{selectedProduct.name}</h1>
                            </div>
                            <div className="p-6 flex flex-col items-center">
                                <span className="text-9xl mb-4">{selectedProduct.emoji}</span>
                                <p className="text-2xl font-bold text-orange-600 mb-2">{selectedProduct.price.toLocaleString()} ج.م</p>
                                <p className="text-gray-600 text-center mb-4">{selectedProduct.description}</p>
                                <div className="flex gap-2">
                                    <button onClick={() => handleWhatsapp(selectedProduct, currSeller?.contactPreference || 'whatsapp')} className="px-4 py-2 bg-green-500 text-white rounded-lg"><i className="fab fa-whatsapp ml-1"></i> تواصل</button>
                                    <button onClick={() => handleLike(selectedProduct.id)} className="px-4 py-2 bg-orange-500 text-white rounded-lg"><i className="fas fa-heart ml-1"></i> إعجاب</button>
                                </div>
                            </div>
                        </div>
                    ) : null;
                case 'sellerProfile':
                    const seller = selectedSellerId ? state.sellers[selectedSellerId] : null;
                    return seller ? (
                        <div className="flex flex-col h-full bg-white min-h-screen">
                            <div className="flex items-center p-4 border-b">
                                <button onClick={() => { setSelectedSellerId(null); setPage('home'); }}><i className="fas fa-arrow-right ml-2"></i> رجوع</button>
                                <h1 className="flex-1 text-center font-bold">ملف التاجر</h1>
                            </div>
                            <div className="p-6 text-center">
                                <span className="text-6xl">{seller.avatar}</span>
                                <h2 className="text-xl font-bold mt-2">{seller.storeName || seller.ownerName}</h2>
                                {seller.verificationBadge && <i className="fas fa-check-circle text-blue-500 mt-1"></i>}
                                <p className="text-gray-500 text-sm mt-1">{seller.email}</p>
                                <p className="text-gray-500 text-sm mt-1">{seller.country}</p>
                            </div>
                        </div>
                    ) : null;
                default:
                    return (
                        <HomePage
                            products={state.products}
                            sellers={state.sellers}
                            currSellerId={state.currentSellerId}
                            onLike={handleLike}
                            onWhats={handleWhatsapp}
                            onProductClick={(p) => { setSelectedProduct(p); setPage('product'); }}
                            onShowOffers={() => alert('عروض قريبا!')}
                            onShowVIP={() => setPage('vip')}
                            onRate={handleRate}
                            onSellerProfile={(id) => { setSelectedSellerId(id); setPage('sellerProfile'); }}
                            onImageClick={(p) => setImagePreview({ emoji: p.emoji, name: p.name })}
                            onCommentsClick={(p) => alert('التعليقات قيد التطوير')}
                            showSearchBar={showSearchBar}
                            searchQuery={searchQuery}
                            onSearchQueryChange={setSearchQuery}
                            onToggleContactPref={handleToggleContactPref}
                        />
                    );
            }
        };

        return (
            <div className="max-w-md mx-auto bg-white min-h-screen relative shadow-lg">
                {/* Header */}
                <div className="sticky top-0 z-30 bg-white border-b px-4 py-3 flex items-center justify-between">
                    <div className="flex items-center gap-2">
                        <i className="fas fa-store text-orange-500 text-2xl"></i>
                        <h1 className="text-lg font-bold">VICKS MARKET</h1>
                    </div>
                    <div className="flex items-center gap-3">
                        <button onClick={() => setDarkMode(!darkMode)} className="text-gray-500 hover:text-orange-500 transition">
                            <i className={`fas ${darkMode ? 'fa-sun' : 'fa-moon'} text-lg`}></i>
                        </button>
                        <button onClick={() => setShowSearchBar(!showSearchBar)} className="text-gray-500 hover:text-orange-500 transition">
                            <i className="fas fa-search text-lg"></i>
                        </button>
                        <button onClick={() => setPage('chat')} className="text-gray-500 hover:text-orange-500 transition">
                            <i className="fas fa-comment-dots text-lg"></i>
                        </button>
                        {state.currentSellerId ? (
                            <button onClick={() => setPage('vip')} className="flex items-center gap-1 text-sm font-semibold text-orange-600">
                                <i className="fas fa-user-circle text-lg"></i>
                                <span className="hidden sm:inline">{currSeller?.ownerName}</span>
                            </button>
                        ) : (
                            <div className="guest-badge" onClick={() => setPage('login')}>
                                <i className="fas fa-user-circle text-lg text-gray-400"></i>
                                <span>ضيف</span>
                            </div>
                        )}
                    </div>
                </div>

                {/* Content */}
                {renderPage()}

                {/* Bottom Navigation */}
                <div className="fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around py-2 z-20 max-w-md mx-auto">
                    <button onClick={() => setPage('home')} className={`flex flex-col items-center text-xs ${page==='home'?'text-orange-500':'text-gray-500'}`}>
                        <i className="fas fa-home text-lg"></i> الرئيسية
                    </button>
                    <button onClick={() => setShowSearchBar(!showSearchBar)} className="flex flex-col items-center text-xs text-gray-500">
                        <i className="fas fa-search text-lg"></i> بحث
                    </button>
                    <button onClick={() => setPage('chat')} className={`flex flex-col items-center text-xs ${page==='chat'?'text-orange-500':'text-gray-500'}`}>
                        <i className="fas fa-robot text-lg"></i> الذكاء
                    </button>
                    <button onClick={() => {
                        if (state.currentSellerId) {
                            setPage('vip');
                        } else {
                            setPage('login');
                        }
                    }} className={`flex flex-col items-center text-xs ${page==='vip'?'text-orange-500':'text-gray-500'}`}>
                        <i className="fas fa-user-circle text-lg"></i> {state.currentSellerId ? 'حسابي' : 'دخول'}
                    </button>
                </div>

                {/* Image Preview Modal */}
                {imagePreview && (
                    <ImagePreviewModal
                        emoji={imagePreview.emoji}
                        name={imagePreview.name}
                        onClose={() => setImagePreview(null)}
                    />
                )}
            </div>
        );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
</script>
