<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VICKS MARKET</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e0e0e0;--phone-bg:#fff;--topbar-bg:#fff;
  --card-bg:#fff;--card-border:#F3F4F6;
  --input-bg:#F9FAFB;--tab-bg:#F9FAFB;--gray-bar:#F3F4F6;
  --orange:#F97316;--orange-light:#FED7AA;--orange-dark:#EA580C;
  --green:#25D366;--teal:#2AABEE;--blue:#3B82F6;
  --text:#1F2937;--text2:#4B5563;--text3:#9CA3AF;--border:#E5E7EB;
  --shadow:0 2px 12px rgba(0,0,0,.08);--shadow-lg:0 8px 32px rgba(0,0,0,.12);
  --r:14px;--rsm:8px;
}
body.dark{
  --bg:#0a0a0a;--phone-bg:#111827;--topbar-bg:#1F2937;
  --card-bg:#1F2937;--card-border:#374151;
  --input-bg:#374151;--tab-bg:#374151;--gray-bar:#374151;
  --text:#F9FAFB;--text2:#D1D5DB;--text3:#6B7280;--border:#374151;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;justify-content:center;transition:background .3s;}
.phone{width:390px;min-height:100vh;background:var(--phone-bg);position:relative;overflow:hidden;box-shadow:0 0 40px rgba(0,0,0,.2);transition:background .3s;}
.page{display:none;flex-direction:column;min-height:100vh;}
.page.active{display:flex;}
.scroll-content{flex:1;overflow-y:auto;}

/* TOPBAR */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;background:var(--topbar-bg);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;transition:background .3s;}
.topbar-right{display:flex;align-items:center;gap:6px;}
.topbar-right .logo{font-size:16px;font-weight:900;color:var(--text);}
.topbar-right img.logo-img{width:28px;height:28px;object-fit:contain;}
.topbar-left{display:flex;align-items:center;gap:6px;}
.icon-btn{width:33px;height:33px;border-radius:50%;background:var(--gray-bar);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--text);transition:background .2s;}
.icon-btn:hover{background:var(--orange-light);}

/* BACK ARROW — يمين، اتجاه ← */
.back-arrow{width:33px;height:33px;border-radius:50%;background:var(--gray-bar);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text);transition:background .2s;}
.back-arrow:hover{background:var(--orange-light);}
.back-arrow svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;}

/* SEARCH BAR */
.search-bar{display:none;padding:7px 13px;background:var(--topbar-bg);border-bottom:1px solid var(--border);gap:7px;align-items:center;}
.search-bar.open{display:flex;}
.search-input{flex:1;padding:8px 12px;border:1.5px solid var(--orange);border-radius:20px;font-family:'Cairo',sans-serif;font-size:12px;background:var(--input-bg);color:var(--text);outline:none;direction:rtl;text-align:right;}
.search-cam-btn,.search-up-btn{width:32px;height:32px;border-radius:50%;background:var(--orange);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;}

/* CAT TABS */
.cat-tabs{display:flex;gap:7px;padding:9px 12px;overflow-x:auto;background:var(--topbar-bg);scrollbar-width:none;border-bottom:1px solid var(--border);}
.cat-tabs::-webkit-scrollbar{display:none;}
.cat-tab{white-space:nowrap;padding:6px 12px;border-radius:17px;border:1.5px solid var(--border);background:var(--card-bg);font-family:'Cairo',sans-serif;font-size:12px;cursor:pointer;transition:all .2s;color:var(--text2);}
.cat-tab.active,.cat-tab:hover{background:var(--orange);color:#fff;border-color:var(--orange);}

/* FILTER BAR — يمين: VIP+عروض فقط | يسار: مربع/قائمة */
.filter-bar{display:flex;align-items:center;justify-content:space-between;padding:6px 12px;background:var(--topbar-bg);border-bottom:1px solid var(--border);}
.filter-right{display:flex;align-items:center;gap:5px;}
.filter-left{display:flex;gap:4px;}
.view-btn{width:30px;height:30px;border-radius:var(--rsm);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;background:var(--gray-bar);color:var(--text2);transition:all .2s;}
.view-btn.active{background:var(--orange);color:#fff;}
.tag-btn{padding:5px 11px;border-radius:17px;border:1.5px solid var(--border);background:var(--card-bg);font-family:'Cairo',sans-serif;font-size:12px;cursor:pointer;color:var(--text2);transition:all .2s;}
.tag-btn:hover{border-color:var(--orange);color:var(--orange);}

/* PRODUCTS HORIZONTAL STRIP */
.products-strip{display:flex;gap:9px;padding:10px 12px;overflow-x:auto;scrollbar-width:none;}
.products-strip::-webkit-scrollbar{display:none;}
.strip-card{min-width:145px;max-width:145px;background:var(--card-bg);border-radius:var(--r);border:1px solid var(--card-border);overflow:hidden;box-shadow:var(--shadow);cursor:pointer;flex-shrink:0;position:relative;transition:transform .2s;}
.strip-card:hover{transform:translateY(-2px);}

/* PRODUCTS GRID */
.products-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:10px;flex:1;overflow-y:auto;}
.products-grid.list-view{grid-template-columns:1fr;}
.product-card{background:var(--card-bg);border-radius:var(--r);border:1px solid var(--card-border);overflow:hidden;box-shadow:var(--shadow);cursor:pointer;transition:transform .2s;position:relative;}
.product-card:hover{transform:translateY(-2px);}
.products-grid.list-view .product-card{display:flex;}
.products-grid.list-view .product-img{width:85px;height:85px;flex-shrink:0;}
.products-grid.list-view .product-info{flex:1;}
.discount-badge{position:absolute;top:7px;right:7px;background:#EF4444;color:#fff;border-radius:9px;padding:2px 6px;font-size:9px;font-weight:700;z-index:2;}
.product-img{width:100%;height:110px;display:flex;align-items:center;justify-content:center;background:var(--tab-bg);font-size:46px;padding:8px;}
.product-info{padding:8px;}
.product-name{font-size:11px;font-weight:700;color:var(--text);margin-bottom:3px;text-align:right;}
.product-price{font-size:13px;font-weight:900;color:var(--orange);text-align:right;margin-bottom:6px;}
.product-actions{display:flex;gap:4px;justify-content:flex-end;flex-wrap:wrap;}
.action-btn{width:26px;height:26px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .2s;padding:0;}
.action-btn:hover{transform:scale(1.12);}
.action-btn.heart{background:var(--text);color:#fff;font-size:11px;}
.action-btn.heart.liked{background:#EF4444;}
.action-btn.msg{background:var(--text3);color:#fff;font-size:11px;}
.action-btn svg{width:15px;height:15px;}
.product-meta{display:flex;align-items:center;justify-content:space-between;margin-top:5px;}
.meta-right{display:flex;align-items:center;gap:3px;}
.shop-badge{background:var(--orange);color:#fff;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;}
.shop-name{font-size:9px;color:var(--text3);}
.stars{color:#F59E0B;font-size:9px;}

/* FAB ROBOT */
.fab-robot{position:fixed;bottom:18px;right:18px;width:50px;height:50px;background:var(--orange);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--shadow-lg);animation:pulse 2s infinite;z-index:100;border:none;}
.fab-robot svg{width:30px;height:30px;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(249,115,22,.4)}50%{box-shadow:0 0 0 10px rgba(249,115,22,0)}}

/* BOTTOM NAV */
.bottom-nav{display:flex;justify-content:space-around;align-items:center;padding:9px 0;background:var(--topbar-bg);border-top:1px solid var(--border);position:sticky;bottom:0;z-index:40;}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:2px;border:none;background:none;cursor:pointer;color:var(--text3);transition:color .2s;position:relative;}
.nav-btn.active{color:var(--orange);}
.nav-icon{font-size:20px;}

/* AUTH */
.auth-page{padding:24px 20px;display:flex;flex-direction:column;min-height:100vh;background:var(--phone-bg);}
.auth-back{margin-bottom:14px;display:flex;align-items:center;}
.auth-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:30px;}
.auth-title{font-size:22px;font-weight:900;color:var(--text);}
.auth-logo{display:flex;align-items:center;gap:7px;font-size:17px;font-weight:900;color:var(--text);}
.auth-logo img{width:32px;height:32px;object-fit:contain;}
.form-group{margin-bottom:12px;}
.form-label{display:block;text-align:right;font-size:13px;color:var(--text2);margin-bottom:6px;}
.form-input{width:100%;padding:12px 14px;border-radius:var(--rsm);border:1.5px solid var(--orange);background:var(--input-bg);font-family:'Cairo',sans-serif;font-size:13px;outline:none;text-align:right;direction:rtl;color:var(--text);}
.btn-primary{width:100%;padding:14px;border-radius:var(--rsm);background:var(--orange);color:#fff;border:none;font-family:'Cairo',sans-serif;font-size:16px;font-weight:700;cursor:pointer;margin:6px 0;}
.btn-social{width:100%;padding:11px;border-radius:var(--rsm);background:var(--card-bg);font-family:'Cairo',sans-serif;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;margin:4px 0;color:var(--text);}
.btn-social.facebook{border:1.5px solid #1877F2;color:#1877F2;}
.btn-social.google{border:1.5px solid #EA4335;color:#EA4335;}
.btn-social.email{border:1.5px solid var(--orange);color:var(--orange);}
.forgot-link{text-align:center;color:var(--text3);font-size:12px;cursor:pointer;margin:6px 0;text-decoration:underline;}
.signup-link{text-align:center;font-size:12px;color:var(--text2);margin-top:12px;}
.signup-link span{color:var(--orange);font-weight:700;cursor:pointer;}
.account-type-btns{display:flex;gap:8px;margin-bottom:14px;}
.account-type-btn{flex:1;padding:10px;border-radius:var(--rsm);border:1.5px solid var(--border);background:var(--gray-bar);font-family:'Cairo',sans-serif;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--text);}
.account-type-btn.active{background:var(--orange-light);border-color:var(--orange);color:var(--orange);font-weight:700;}

/* PROFILE */
.profile-body{padding:18px 15px;text-align:center;}
.profile-avatar{width:80px;height:80px;border-radius:50%;background:var(--gray-bar);margin:0 auto 9px;display:flex;align-items:center;justify-content:center;font-size:44px;position:relative;overflow:visible;}
.verified-badge{position:absolute;bottom:0;right:0;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;border:2px solid var(--phone-bg);color:#fff;}
.verified-badge.blue{background:#3B82F6;}
.verified-badge.silver{background:#94A3B8;}
.verified-badge.gold{background:#D97706;}
.crown-badge{position:absolute;top:-10px;left:50%;transform:translateX(-50%);font-size:22px;}
.profile-name{font-size:17px;font-weight:900;margin-bottom:4px;color:var(--text);}
.profile-id{font-size:11px;color:var(--text3);margin-bottom:3px;}
.profile-contact{font-size:11px;color:var(--text2);margin-bottom:3px;display:flex;align-items:center;justify-content:center;gap:4px;}
.profile-tabs{display:flex;margin:11px 0;border:1.5px solid var(--border);border-radius:var(--rsm);overflow:hidden;}
.profile-tab{flex:1;padding:8px;text-align:center;cursor:pointer;font-family:'Cairo',sans-serif;font-size:11px;font-weight:600;background:var(--tab-bg);border:none;color:var(--text2);transition:all .2s;}
.profile-tab.active{background:var(--orange);color:#fff;}

/* VIP */
.vip-section{padding:13px 15px;border-bottom:1px solid var(--border);}
.vip-section-title{font-size:13px;font-weight:900;margin-bottom:11px;text-align:right;color:var(--text);}
.option-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px;flex-wrap:wrap;gap:6px;}
.option-label{font-size:12px;color:var(--text2);}
.badge-selector{display:flex;gap:8px;}
.badge-choice{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;border:3px solid transparent;transition:all .2s;}
.badge-choice.selected{border-color:var(--orange-dark);box-shadow:0 0 0 3px var(--orange-light);}
.duration-btns{display:flex;gap:5px;flex-wrap:wrap;}
.dur-btn{padding:5px 10px;border-radius:7px;border:1.5px solid var(--border);background:var(--tab-bg);font-family:'Cairo',sans-serif;font-size:11px;cursor:pointer;transition:all .2s;color:var(--text2);}
.dur-btn.active{background:var(--green);color:#fff;border-color:var(--green);}
.dur-btn.dark-act{background:var(--text);color:var(--phone-bg);border-color:var(--text);}
.vip-packages{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.vip-pkg{background:var(--tab-bg);border-radius:var(--rsm);padding:10px;text-align:center;border:1.5px solid var(--border);cursor:pointer;transition:all .2s;}
.vip-pkg:hover{border-color:var(--orange);}
.vip-pkg .pkg-icon{font-size:22px;margin-bottom:4px;}
.vip-pkg .pkg-name{font-size:10px;font-weight:700;margin-bottom:2px;color:var(--text);}
.vip-pkg .pkg-desc{font-size:9px;color:var(--text3);margin-bottom:6px;}
.pkg-points{background:#D97706;color:#fff;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;display:inline-block;}
.custom-points{display:flex;gap:8px;margin-top:11px;}
.points-input{flex:1;padding:8px 11px;border:1.5px solid var(--border);border-radius:var(--rsm);font-family:'Cairo',sans-serif;font-size:12px;text-align:right;direction:rtl;outline:none;background:var(--input-bg);color:var(--text);}
.btn-buy{background:var(--green);color:#fff;border:none;padding:8px 18px;border-radius:var(--rsm);font-family:'Cairo',sans-serif;font-size:13px;font-weight:700;cursor:pointer;}
.add-id-row{display:flex;gap:7px;align-items:center;margin-top:9px;}
.add-id-input{flex:1;padding:8px 11px;border:1.5px solid var(--border);border-radius:var(--rsm);font-family:'Cairo',sans-serif;font-size:12px;text-align:right;direction:rtl;outline:none;background:var(--input-bg);color:var(--text);}
.btn-add-id{background:var(--blue);color:#fff;border:none;padding:8px 12px;border-radius:var(--rsm);font-family:'Cairo',sans-serif;font-size:12px;font-weight:700;cursor:pointer;}

/* CHAT */
.chat-page{display:flex;flex-direction:column;height:100vh;}
.chat-header{display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--topbar-bg);border-bottom:1px solid var(--border);}
/* سهم رجوع يمين — اتجاه يمين */
.chat-avatar{width:36px;height:36px;background:var(--orange);border-radius:50%;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.chat-avatar svg,.chat-avatar img{width:26px;height:26px;object-fit:contain;}
.chat-title-wrap{flex:1;text-align:center;}
.chat-title{font-size:14px;font-weight:700;color:var(--text);}
.chat-subtitle{font-size:10px;color:var(--text3);}
.chat-body{flex:1;padding:13px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;background:var(--tab-bg);}
.chat-watermark{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 0;opacity:.07;}
.chat-watermark img{width:60px;height:60px;object-fit:contain;margin-bottom:6px;}
.chat-watermark .wm-text{font-size:24px;font-weight:900;color:var(--text);}
.msg{max-width:75%;}
.msg.bot{align-self:flex-end;}
.msg.user{align-self:flex-start;}
.msg-bubble{padding:10px 13px;border-radius:15px;font-size:12px;line-height:1.5;}
.msg.bot .msg-bubble{background:var(--card-bg);border-radius:15px 15px 4px 15px;box-shadow:var(--shadow);color:var(--text);}
.msg.user .msg-bubble{background:var(--orange);color:#fff;border-radius:15px 15px 15px 4px;}
.chat-input-bar{display:flex;align-items:center;gap:7px;padding:9px 13px;background:var(--topbar-bg);border-top:1px solid var(--border);}
.chat-input{flex:1;padding:8px 12px;border:1.5px solid var(--border);border-radius:20px;font-family:'Cairo',sans-serif;font-size:12px;outline:none;text-align:right;direction:rtl;background:var(--input-bg);color:var(--text);}
.chat-send-btn{width:36px;height:36px;background:var(--orange);border:none;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer;color:#fff;}
.chat-attach{font-size:17px;color:var(--text3);cursor:pointer;border:none;background:none;}

/* COMMENTS */
.comment-item{display:flex;align-items:flex-start;gap:7px;padding:10px 13px;border-bottom:1px solid var(--border);}
.comment-avatar{width:30px;height:30px;background:var(--orange);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;flex-shrink:0;}
.comment-body{flex:1;}
.comment-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:3px;}
.comment-name{font-size:12px;font-weight:700;color:var(--text);}
.comment-store{display:flex;align-items:center;gap:3px;}
.comment-store-badge{width:15px;height:15px;background:var(--orange);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:700;color:#fff;}
.comment-store-name{font-size:9px;color:var(--text3);}
.comment-text{font-size:12px;color:var(--text2);margin-bottom:5px;}
.comment-actions{display:flex;gap:7px;align-items:center;}
.c-like-btn,.c-dislike-btn{background:none;border:none;cursor:pointer;font-size:13px;color:var(--text3);}
.c-like-btn:hover{color:var(--green);}
.c-dislike-btn:hover{color:#EF4444;}
.c-count{font-size:10px;color:var(--text3);}
.add-comment-bar{display:flex;gap:7px;padding:9px 13px;background:var(--topbar-bg);border-top:1px solid var(--border);}
.add-comment-input{flex:1;padding:8px 11px;border:1.5px solid var(--border);border-radius:19px;font-family:'Cairo',sans-serif;font-size:12px;outline:none;text-align:right;direction:rtl;background:var(--input-bg);color:var(--text);}
.add-comment-send{width:34px;height:34px;background:var(--orange);border:none;border-radius:50%;color:#fff;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;}

/* OVERLAY */
.product-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.55);z-index:200;align-items:center;justify-content:center;}
.product-overlay.open{display:flex;}
.product-overlay-inner{background:var(--card-bg);border-radius:18px;width:70%;max-height:75vh;overflow-y:auto;padding:16px;position:relative;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3);}
.overlay-close{position:absolute;top:8px;left:8px;width:26px;height:26px;border-radius:50%;background:var(--gray-bar);border:none;cursor:pointer;font-size:13px;color:var(--text);}
.overlay-emoji{font-size:60px;margin-bottom:8px;}
.overlay-name{font-size:14px;font-weight:900;margin-bottom:4px;color:var(--text);}
.overlay-price{font-size:18px;font-weight:900;color:var(--orange);margin-bottom:10px;}
.overlay-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
.overlay-btn{padding:8px 14px;border-radius:16px;border:none;cursor:pointer;font-family:'Cairo',sans-serif;font-size:12px;font-weight:700;color:#fff;display:flex;align-items:center;gap:5px;}
.overlay-btn.wa{background:#25D366;}
.overlay-btn.tg{background:#2AABEE;}
.overlay-btn.cmnt{background:var(--text2);}
.overlay-star{display:flex;justify-content:center;gap:4px;margin-top:10px;}
.overlay-star span{font-size:18px;cursor:pointer;}

/* ADMIN */
.admin-section{padding:13px 15px;border-bottom:1px solid var(--border);}
.admin-section-title{font-size:13px;font-weight:900;margin-bottom:11px;text-align:right;color:var(--text);}
.admin-card{background:var(--tab-bg);border-radius:var(--rsm);padding:11px;border:1px solid var(--border);margin-bottom:9px;}
.admin-row{display:flex;gap:7px;align-items:center;margin-bottom:8px;flex-wrap:wrap;}
.admin-input{flex:1;padding:8px 10px;border:1.5px solid var(--border);border-radius:var(--rsm);font-family:'Cairo',sans-serif;font-size:12px;text-align:right;direction:rtl;outline:none;background:var(--input-bg);color:var(--text);min-width:65px;}
.btn-ban{background:var(--orange);color:#fff;border:none;padding:8px 13px;border-radius:var(--rsm);font-family:'Cairo',sans-serif;font-size:12px;font-weight:700;cursor:pointer;}
.btn-send{background:var(--orange);color:#fff;border:none;padding:8px 11px;border-radius:var(--rsm);font-family:'Cairo',sans-serif;font-size:11px;font-weight:700;cursor:pointer;}
.btn-plus{background:var(--green);color:#fff;border:none;padding:6px 11px;border-radius:var(--rsm);font-size:12px;font-weight:700;cursor:pointer;}
.btn-minus{background:#EF4444;color:#fff;border:none;padding:6px 11px;border-radius:var(--rsm);font-size:12px;font-weight:700;cursor:pointer;}
.id-swap-btn{width:31px;height:31px;background:var(--text);color:var(--phone-bg);border:none;border-radius:50%;font-size:13px;cursor:pointer;}
.admin-notif-list{display:flex;flex-direction:column;gap:7px;max-height:240px;overflow-y:auto;}
.admin-notif-item{background:var(--card-bg);border-radius:var(--rsm);padding:10px;border-right:4px solid var(--orange);box-shadow:var(--shadow);}
.admin-notif-item.new-notif{background:#FFF7ED;border-right-color:#D97706;}
body.dark .admin-notif-item.new-notif{background:#2d1f00;}
.notif-title{font-size:12px;font-weight:700;color:var(--text);}
.notif-desc{font-size:10px;color:var(--text2);}
.notif-time{font-size:10px;color:var(--text3);}
.flag-btn{display:flex;align-items:center;gap:3px;padding:3px 8px;border:1.5px solid var(--border);border-radius:16px;background:var(--card-bg);cursor:pointer;font-size:11px;font-weight:600;color:var(--text);}
select{padding:7px 11px;border:1.5px solid var(--border);border-radius:var(--rsm);font-family:'Cairo',sans-serif;font-size:12px;background:var(--input-bg);text-align:right;direction:rtl;outline:none;cursor:pointer;color:var(--text);}
input[type=range]{width:100%;accent-color:var(--orange);}
.toast{position:fixed;top:15px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--phone-bg);padding:9px 19px;border-radius:19px;font-size:12px;z-index:9999;opacity:0;transition:opacity .3s;white-space:nowrap;font-family:'Cairo',sans-serif;}
.toast.show{opacity:1;}
@media(max-width:420px){.phone{width:100%;}}
</style>
</head>
