<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VICKS MARKET V2</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    /* 1. نظام الألوان المتطور (Variables) */
    :root {
      --orange: #FF7A00;
      --orange-dark: #E66E00;
      --bg-main: #e8e8e8;
      --bg-phone: #ffffff;
      --text-main: #1F2937;
      --gray-100: #F3F4F6;
      --gray-200: #E5E7EB;
      --white: #ffffff;
      --shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    /* ألوان الوضع الليلي */
    .dark-mode {
      --bg-main: #0f172a;
      --bg-phone: #1e293b;
      --text-main: #f8fafc;
      --gray-100: #334155;
      --gray-200: #475569;
      --white: #1e293b;
      --shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Cairo', sans-serif; background: var(--bg-main); color: var(--text-main); transition: 0.3s; }

    .phone-wrapper { 
      width: 100%; max-width: 420px; height: 100vh; margin: 0 auto; 
      background: var(--bg-phone); position: relative; display: flex; flex-direction: column; overflow: hidden; 
    }

    /* 2. أيقونة الروبوت على اليمين (كما طلبت في الفيديو) */
    .fab-robot { 
      position: fixed; bottom: 25px; right: 20px; /* تم النقل لليمين */
      width: 56px; height: 56px; background: var(--orange); 
      border-radius: 50%; display: flex; align-items: center; justify-content: center; 
      font-size: 24px; color: white; cursor: pointer; z-index: 1000; border: 2px solid white;
      animation: pulse 2s infinite; box-shadow: var(--shadow);
    }

    @keyframes pulse {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 122, 0, 0.7); }
      70% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(255, 122, 0, 0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 122, 0, 0); }
    }

    /* باقي التنسيقات الأساسية */
    .page { display: none; height: 100%; flex-direction: column; }
    .page.active { display: flex; }
    .topbar { padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--gray-200); }
    .logo { font-weight: 900; color: var(--orange); }

    .products-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px; overflow-y: auto; }
    .product-card { background: var(--white); border-radius: 12px; padding: 10px; border: 1px solid var(--gray-200); box-shadow: var(--shadow); }
    .action-btn { width: 32px; height: 32px; border-radius: 50%; border: none; cursor: pointer; margin: 2px; color: white; }

    /* شريط المحادثة مع زر الكاميرا */
    .chat-input-bar { display: flex; align-items: center; gap: 10px; padding: 10px; background: var(--white); border-top: 1px solid var(--gray-200); }
    .chat-input { flex: 1; padding: 10px; border-radius: 20px; border: 1px solid var(--gray-200); background: var(--gray-100); color: var(--text-main); }

    .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 10px 20px; border-radius: 20px; display: none; z-index: 2000; }
  </style>
</head>
<body>

<div class="toast" id="toast"></div>

<div class="phone-wrapper">
  <div class="page active" id="page-home">
    <div class="topbar">
      <button onclick="toggleTheme()" id="dark-toggle" style="background:none; border:none; font-size:20px; cursor:pointer;">🌙</button>
      <div class="logo">VICKS MARKET 🛍️</div>
      <button onclick="showPage('login')" style="background:none; border:none; font-size:20px;">👤</button>
    </div>
    <div class="products-grid" id="main-grid"></div>
    <button class="fab-robot" onclick="showPage('chat')">🤖</button>
  </div>

  <div class="page" id="page-chat">
    <div class="topbar">
      <button onclick="showPage('home')" style="border:none; background:none; font-size:20px;">➡️</button>
      <div style="font-weight:bold;">VICKS AI</div>
      <div>🤖</div>
    </div>
    <div id="chat-body" style="flex:1; overflow-y:auto; padding:15px; display:flex; flex-direction:column; gap:10px;"></div>
    <div class="chat-input-bar">
      <button class="chat-attach" onclick="sendChat()" style="background:var(--orange); color:white; border:none; border-radius:50%; width:40px; height:40px;">➤</button>
      <input type="text" id="chat-input" class="chat-input" placeholder="اكتب رسالتك...">
      <button class="chat-attach" onclick="openCamera()" style="border:none; background:none; font-size:20px; cursor:pointer;">📷</button>
    </div>
  </div>

  <div class="page" id="page-login" style="padding:40px 20px;">
    <h2 style="text-align:center; margin-bottom:20px;">تسجيل الدخول</h2>
    <input type="email" id="login-email" class="chat-input" style="width:100%; margin-bottom:10px;" placeholder="البريد الإلكتروني">
    <input type="password" id="login-pass" class="chat-input" style="width:100%; margin-bottom:20px;" placeholder="كلمة المرور">
    <button onclick="doLogin()" style="width:100%; padding:15px; background:var(--orange); color:white; border:none; border-radius:10px; font-weight:bold;">دخول</button>
    <p onclick="showPage('home')" style="text-align:center; margin-top:20px; cursor:pointer; color:var(--orange);">العودة للرئيسية</p>
  </div>
</div>

<script>
  // 3. تشغيل الكاميرا الفعلي
  function openCamera() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    input.capture = 'environment';
    input.onchange = (e) => {
      const file = e.target.files[0];
      if (file) {
        showToast("جاري معالجة الصورة...");
        const reader = new FileReader();
        reader.onload = (event) => {
          const body = document.getElementById('chat-body');
          body.innerHTML += `<div style="align-self:flex-start; background:var(--orange); color:white; padding:10px; border-radius:10px; max-width:80%"><img src="${event.target.result}" style="width:100%; border-radius:5px;"></div>`;
          body.scrollTop = body.scrollHeight;
        };
        reader.readAsDataURL(file);
      }
    };
    input.click();
  }

  // 4. تفعيل أزرار التواصل (WhatsApp & Telegram)
  function contactSeller(platform, pName) {
    const phone = "20123456789"; // مثال لرقم التاجر
    const msg = encodeURIComponent("مرحباً، أنا مهتم بمنتج: " + pName);
    const url = platform === 'wa' ? `https://wa.me/${phone}?text=${msg}` : `https://t.me/YourBotName`;
    window.open(url, '_blank');
  }

  // 5. تحسين الأمان في الدخول
  function doLogin() {
    const e = document.getElementById('login-email').value;
    const p = document.getElementById('login-pass').value;
    if (!e.includes('@') || p.length < 6) {
      showToast("⚠️ بيانات الدخول غير صحيحة");
      return;
    }
    showToast("✅ تم الدخول بنجاح");
    setTimeout(() => showPage('home'), 1000);
  }

  // تبديل الصفحات والوضع الليلي
  function showPage(id) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('page-' + id).classList.add('active');
  }

  function toggleTheme() {
    document.body.classList.toggle('dark-mode');
    const isDark = document.body.classList.contains('dark-mode');
    document.getElementById('dark-toggle').textContent = isDark ? '☀️' : '🌙';
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 2500);
  }

  // شات بسيط
  function sendChat() {
    const inp = document.getElementById('chat-input');
    const body = document.getElementById('chat-body');
    if (!inp.value) return;
    body.innerHTML += `<div style="align-self:flex-start; background:var(--orange); color:white; padding:10px; border-radius:10px; max-width:80%">${inp.value}</div>`;
    inp.value = '';
    setTimeout(() => {
      body.innerHTML += `<div style="align-self:flex-end; background:var(--gray-200); color:var(--text-main); padding:10px; border-radius:10px; max-width:80%">أنا بوت VICKS، كيف أساعدك؟</div>`;
      body.scrollTop = body.scrollHeight;
    }, 800);
  }

  // رندر المنتجات (أمثلة)
  const items = [
    {name: 'آيفون 14 Pro', price: '25,000 ج.م', emoji: '📱'},
    {name: 'ساعة ذكية', price: '1,200 ج.م', emoji: '⌚'}
  ];
  document.getElementById('main-grid').innerHTML = items.map(p => `
    <div class="product-card">
      <div style="font-size:40px; text-align:center;">${p.emoji}</div>
      <div style="font-weight:bold; margin-top:5px;">${p.name}</div>
      <div style="color:var(--orange); font-weight:900;">${p.price}</div>
      <div style="margin-top:10px; display:flex; justify-content:center;">
        <button class="action-btn" style="background:#25D366;" onclick="contactSeller('wa', '${p.name}')">💬</button>
        <button class="action-btn" style="background:#0088cc;" onclick="contactSeller('tg', '${p.name}')">✈️</button>
      </div>
    </div>
  `).join('');
</script>

</body>
</html>
