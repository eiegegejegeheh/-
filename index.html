<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>VICKS MARKET | منصة تجارة عالمية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
    <style>
        /* ---------- الأنماط العامة ---------- */
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        /* ---------- الوضع الليلي (جميع النصوص برتقالية، خلفيات سوداء/رمادية، لا حدود بيضاء ولا ظلال) ---------- */
        body.dark {
            background-color: #000000;
        }
        body.dark .bg-white,
        body.dark .bg-gray-50,
        body.dark .bg-gray-100,
        body.dark .bg-card,
        body.dark .bg-muted {
            background-color: #121212 !important;
        }
        /* إجبار جميع النصوص على اللون البرتقالي */
        body.dark,
        body.dark *:not(.text-yellow-400):not(.fa-star):not(.fa-crown) {
            color: #ff6600 !important;
        }
        /* استثناء النجوم الذهبية لأنها تظل ذهبية أو برتقالية فاتحة */
        body.dark .fas.fa-star.text-yellow-400 {
            color: #ffaa33 !important;
        }
        body.dark .fas.fa-star.text-gray-300 {
            color: #ff6600 !important;
            opacity: 0.5;
        }
        /* أزرار التفاعل في الوضع الليلي */
        body.dark button.bg-gray-100 {
            background-color: #1a1a1a !important;
            color: #ff6600 !important;
        }
        body.dark button.bg-gray-100:hover {
            background-color: #ff6600 !important;
            color: #000000 !important;
        }
        /* إزالة جميع الحدود البيضاء والظلال */
        body.dark .border,
        body.dark .border-gray-100,
        body.dark .border-gray-200,
        body.dark .border-t,
        body.dark .border-b {
            border-color: #ff6600 !important;
            border-width: 0.5px !important;
        }
        body.dark .shadow-sm,
        body.dark .shadow-md,
        body.dark .shadow-lg {
            box-shadow: none !important;
        }
        
        /* ---------- تنسيق الصورة الدائرية للمالك ---------- */
        .profile-avatar {
            width: 120px;
            height: 120px;
            background-color: #ff6600;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: white;
            margin: 0 auto;
        }
        body.dark .profile-avatar {
            background-color: #ff6600;
            color: #000;
        }
        
        /* ---------- أنماط السحب الأفقي والبطاقات المدمجة ---------- */
        .horizontal-scroll {
            overflow-x: auto;
            scrollbar-width: thin;
            -webkit-overflow-scrolling: touch;
        }
        .horizontal-scroll::-webkit-scrollbar {
            height: 4px;
        }
        .compact-card {
            padding: 8px;
            min-width: 140px;
            width: 140px;
            flex: 0 0 auto;
        }
        .compact-card .product-emoji {
            font-size: 2.5rem;
            margin-bottom: 4px;
        }
        .compact-card .product-name {
            font-size: 0.75rem;
            line-height: 1.2;
            margin-bottom: 2px;
        }
        .compact-card .product-price {
            font-size: 0.8rem;
            font-weight: bold;
        }
        .compact-card .seller-name {
            font-size: 0.6rem;
            margin-top: 2px;
        }
        .compact-card .action-icons {
            gap: 4px;
        }
        .compact-card .action-icons button {
            width: 22px;
            height: 22px;
            font-size: 0.7rem;
        }
        .compact-card .rating-stars i {
            font-size: 0.6rem;
        }
        /* تنسيق قائمة المنتجات (العرض العمودي) */
        .list-item {
            padding: 8px;
            margin-bottom: 8px;
        }
        .list-item .product-emoji {
            font-size: 2rem;
            width: 50px;
            height: 50px;
        }
        .list-item .product-name {
            font-size: 0.85rem;
        }
        
        /* ---------- العلامة المائية في الدردشة ---------- */
        .chat-watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2.5rem;
            font-weight: bold;
            opacity: 0.08;
            white-space: nowrap;
            pointer-events: none;
            z-index: 5;
            user-select: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        body.dark .chat-watermark {
            opacity: 0.15;
        }
        @media (max-width: 640px) {
            .chat-watermark {
                font-size: 1.6rem;
                white-space: normal;
                text-align: center;
                width: 80%;
            }
        }
        
        /* شريط الدردشة الثابت */
        .chat-fixed-bottom {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: inherit;
            z-index: 20;
        }
    </style>
</head>
<body class="bg-gray-50 font-sans antialiased">
    <div id="root"></div>

    <script type="text/babel" data-presets="react,typescript">
        // --------------------------------------------------------------
        // 1. الثوابت والبيانات الأساسية (مع حساب المالك الثابت)
        // --------------------------------------------------------------
        const STORAGE_KEY = 'vicks_market_v2';
        const THEME_KEY = 'vicks_theme_v2';
        const LANG_KEY = 'vicks_lang_v2';
        const COUNTRY_KEY = 'vicks_country_v2';
        
        // بيانات المالك الثابتة
        const OWNER_EMAIL = 'mom1113694362@gmail.com';
        const OWNER_PASS = 'momMOM2023#';
        const OWNER_ID = '10000000000';
        
        function generateId() { return Math.random().toString(36).slice(2) + Date.now().toString(36); }
        
        // قائمة البلدان
        const countriesList = [
            { code: 'EG', name: 'مصر', currency: 'EGP' },
            { code: 'SA', name: 'السعودية', currency: 'SAR' },
            { code: 'AE', name: 'الإمارات', currency: 'AED' },
            { code: 'US', name: 'United States', currency: 'USD' },
            { code: 'GB', name: 'United Kingdom', currency: 'GBP' },
            { code: 'DE', name: 'Germany', currency: 'EUR' },
            { code: 'FR', name: 'France', currency: 'EUR' },
            { code: 'TR', name: 'Turkey', currency: 'TRY' }
        ];
        
        // التصنيفات
        const categoriesData = [
            { id: 'all', label: 'الجميع', icon: 'fa-grid' },
            { id: 'electronics', label: 'الإلكترونيات', icon: 'fa-microchip' },
            { id: 'fashion', label: 'الموضة', icon: 'fa-tshirt' },
            { id: 'home', label: 'المنزل والمطبخ', icon: 'fa-home' },
            { id: 'toys', label: 'الألعاب', icon: 'fa-gamepad' },
            { id: 'books', label: 'الكتب', icon: 'fa-book' }
        ];
        
        // بائعين ومنتجات تجريبية
        const initialSellers = {
            admin: {
                id: OWNER_ID, email: OWNER_EMAIL, password: OWNER_PASS,
                storeName: 'VICKS MARKET', ownerName: 'محمد المالك', phone: '01113694362',
                points: 50000, verified: true, subscription: 'platinum', products: [],
                createdAt: Date.now(), country: 'مصر', isAdmin: true, vipExpiry: Date.now() + 86400000 * 365,
                avatar: '👑'
            },
            s1: {
                id: 's1', email: 'seller1@test.com', password: '123456',
                storeName: 'متجر النور', ownerName: 'أحمد علي', phone: '01012345678',
                points: 350, verified: true, subscription: 'silver',
                products: ['p1', 'p3', 'p5'], createdAt: Date.now() - 86400000 * 10,
                country: 'مصر', isAdmin: false, vipExpiry: Date.now() + 86400000 * 30,
                avatar: '🌟'
            },
            s2: {
                id: 's2', email: 'seller2@test.com', password: '123456',
                storeName: 'سوبر ماركت الفرح', ownerName: 'فاطمة حسن', phone: '01198765432',
                points: 120, verified: false, subscription: 'free',
                products: ['p2', 'p4', 'p6'], createdAt: Date.now() - 86400000 * 5,
                country: 'السعودية', isAdmin: false, vipExpiry: null,
                avatar: '🛒'
            }
        };
        
        const initialProducts = {
            p1: { id: 'p1', name: 'ايفون 14 Pro مستعمل', price: 18000, category: 'electronics', emoji: '📱', sellerId: 's1', sellerName: 'متجر النور', sellerCountry: 'مصر', likes: 8, likedBy: [], description: 'بطارية 92%', createdAt: Date.now() - 86400000 * 2, vip: true, comments: [], rating: 4 },
            p2: { id: 'p2', name: 'زيت زيتون بكر 1 لتر', price: 185, category: 'home', emoji: '🫒', sellerId: 's2', sellerName: 'سوبر ماركت الفرح', sellerCountry: 'السعودية', likes: 5, likedBy: [], description: 'زيت طبيعي', createdAt: Date.now() - 86400000, vip: false, comments: [], rating: 3 },
            p3: { id: 'p3', name: 'شاشة سامسونج 55 بوصة', price: 4500, category: 'electronics', emoji: '📺', sellerId: 's1', sellerName: 'متجر النور', sellerCountry: 'مصر', likes: 12, likedBy: [], description: 'شاشة ممتازة', createdAt: Date.now() - 86400000 * 3, vip: true, comments: [], rating: 5 },
            p4: { id: 'p4', name: 'لعبة بلاي ستيشن 5', price: 1800, category: 'toys', emoji: '🎮', sellerId: 's2', sellerName: 'سوبر ماركت الفرح', sellerCountry: 'السعودية', likes: 9, likedBy: [], description: 'جهاز ترفيهي', createdAt: Date.now() - 86400000, vip: false, comments: [], rating: 2 },
            p5: { id: 'p5', name: 'لاب توب ديل Inspiron', price: 12000, category: 'electronics', emoji: '💻', sellerId: 's1', sellerName: 'متجر النور', sellerCountry: 'مصر', likes: 7, likedBy: [], description: 'Core i7', createdAt: Date.now() - 86400000 * 6, vip: true, comments: [], rating: 3 },
            p6: { id: 'p6', name: 'رواية "أطلس الغيوم"', price: 85, category: 'books', emoji: '📖', sellerId: 's2', sellerName: 'سوبر ماركت الفرح', sellerCountry: 'السعودية', likes: 15, likedBy: [], description: 'أدب مترجم', createdAt: Date.now() - 86400000 * 2, vip: false, comments: [], rating: 4 }
        };
        // إضافة منتجات إضافية لتظهر بشكل جيد في السلايدر
        for (let i = 7; i <= 16; i++) {
            initialProducts[`p${i}`] = {
                id: `p${i}`, name: `منتج مميز ${i}`, price: 100 + i * 10, category: 'electronics', emoji: '📱',
                sellerId: 's1', sellerName: 'متجر النور', sellerCountry: 'مصر', likes: i, likedBy: [],
                description: `وصف المنتج ${i}`, createdAt: Date.now() - i * 86400000, vip: i % 3 === 0,
                comments: [], rating: i % 5
            };
            initialSellers.s1.products.push(`p${i}`);
        }
        initialSellers.admin.products = [];
        initialSellers.s1.products = ['p1', 'p3', 'p5', ...Array.from({length: 10}, (_, i) => `p${i+7}`)];
        initialSellers.s2.products = ['p2', 'p4', 'p6'];
        
        function getInitialState() {
            return {
                sellers: JSON.parse(JSON.stringify(initialSellers)),
                products: JSON.parse(JSON.stringify(initialProducts)),
                currentSellerId: null,
                chatMessages: [{ id: '1', role: 'bot', text: 'أهلاً بك في VICKS MARKET! كيف أستطيع مساعدتك اليوم؟', ts: Date.now() }],
                notifications: []
            };
        }
        
        function loadState() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (!raw) return getInitialState();
                const parsed = JSON.parse(raw);
                if (parsed && parsed.sellers && parsed.products) return parsed;
                return getInitialState();
            } catch (e) {
                return getInitialState();
            }
        }
        function saveState(state) { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
        function isAdmin(seller) { return seller?.isAdmin === true; }
        function createSeller(data) {
            return {
                id: 's_' + generateId(), ...data,
                points: 0, verified: false, subscription: 'free', products: [],
                createdAt: Date.now(), isAdmin: false, vipExpiry: null, avatar: '🛍️'
            };
        }
        function createProduct(data) {
            return {
                id: 'p_' + generateId(), ...data,
                likes: 0, likedBy: [], createdAt: Date.now(), vip: false, comments: [], rating: 0
            };
        }
        function addChatMessage(state, msg) {
            return { ...state, chatMessages: [...state.chatMessages, { ...msg, id: generateId(), ts: Date.now() }] };
        }
        function getBotResponse(msg) {
            const m = msg.toLowerCase();
            if (m.includes('سعر')) return 'يمكنك الاطلاع على الأسعار من الصفحة الرئيسية. هل تبحث عن منتج معين؟';
            if (m.includes('بائع')) return 'للانضمام كبائع: اضغط "حسابي" ثم "انضم كتاجر جديد".';
            if (m.includes('نقاط')) return 'يمكنك شراء النقاط من صفحة المتجر (حسابي ← المتجر).';
            return 'شكراً لتواصلك! كيف أقدر أساعدك؟';
        }
        
        const { useState, useEffect, useCallback, useRef } = React;
        
        // --------------------------------------------------------------
        // 2. مكون بطاقة المنتج المدمجة (Compact Card)
        // --------------------------------------------------------------
        function ProductCard({ product, isLiked, onLike, onWhatsApp, onClick, onComment, onRate, t, isVIPseller, isListView }) {
            const stars = [];
            for (let i = 1; i <= 5; i++) {
                stars.push(
                    <i key={i} className={`fas fa-star ${i <= product.rating ? 'text-yellow-400' : 'text-gray-300'} ${isListView ? 'text-xs' : 'text-[10px]'} cursor-pointer`}
                       onClick={(e) => { e.stopPropagation(); onRate(i); }}></i>
                );
            }
            const shortSeller = product.sellerName.length > 10 ? product.sellerName.slice(0, 8) + '..' : product.sellerName;
            
            if (isListView) {
                return (
                    <div onClick={onClick} className="list-item flex gap-3 bg-white rounded-xl border shadow-sm cursor-pointer hover:shadow-md transition">
                        <div className="product-emoji flex items-center justify-center bg-gray-50 rounded-lg text-3xl w-12 h-12">{product.emoji}</div>
                        <div className="flex-1 min-w-0">
                            <h3 className="product-name font-semibold line-clamp-1">{product.name}</h3>
                            <p className="product-price text-blue-600 font-bold text-sm">{product.price.toLocaleString()} {t('currency')}</p>
                            <div className="flex items-center gap-1 mt-0.5">
                                <span className="seller-name text-[10px] text-gray-500 truncate max-w-[100px]">{shortSeller} {isVIPseller && <i className="fas fa-crown text-yellow-500 text-[8px]"></i>}</span>
                                <div className="rating-stars flex gap-0.5">{stars}</div>
                            </div>
                        </div>
                        <div className="action-icons flex gap-1 items-center">
                            <button onClick={(e) => { e.stopPropagation(); onLike(); }} className={`p-1 rounded-full ${isLiked ? 'bg-orange-500 text-white' : 'bg-gray-100 text-gray-600'}`}><i className="fas fa-heart text-xs"></i></button>
                            <button onClick={(e) => { e.stopPropagation(); onWhatsApp(); }} className="p-1 rounded-full bg-green-100 text-green-600"><i className="fab fa-whatsapp text-xs"></i></button>
                            <button onClick={(e) => { e.stopPropagation(); onComment(); }} className="p-1 rounded-full bg-blue-100 text-blue-600"><i className="fas fa-comment text-xs"></i></button>
                        </div>
                    </div>
                );
            }
            
            // بطاقة مدمجة (عرض شبكي)
            return (
                <div onClick={onClick} className="compact-card bg-white rounded-xl border shadow-sm cursor-pointer hover:shadow-md transition relative flex-shrink-0">
                    {product.vip && <span className="absolute top-1 right-1 bg-yellow-400 text-white rounded-full px-1 py-0.5 text-[8px] z-10"><i className="fas fa-crown"></i></span>}
                    <div className="product-emoji flex items-center justify-center bg-gray-50 rounded-lg text-3xl h-16">{product.emoji}</div>
                    <h3 className="product-name font-semibold line-clamp-2 mt-1">{product.name}</h3>
                    <p className="product-price text-blue-600 font-bold mt-0.5">{product.price.toLocaleString()} {t('currency')}</p>
                    <div className="flex justify-between items-start mt-1">
                        <span className="seller-name text-[10px] text-gray-500 truncate max-w-[80px]">{shortSeller} {isVIPseller && <i className="fas fa-crown text-yellow-500 text-[8px]"></i>}</span>
                        <div className="action-icons flex gap-0.5">
                            <button onClick={(e) => { e.stopPropagation(); onLike(); }} className={`p-0.5 rounded-full ${isLiked ? 'bg-orange-500 text-white' : 'bg-gray-100 text-gray-600'}`}><i className="fas fa-heart text-[10px]"></i></button>
                            <button onClick={(e) => { e.stopPropagation(); onWhatsApp(); }} className="p-0.5 rounded-full bg-green-100 text-green-600"><i className="fab fa-whatsapp text-[8px]"></i></button>
                            <button onClick={(e) => { e.stopPropagation(); onComment(); }} className="p-0.5 rounded-full bg-blue-100 text-blue-600"><i className="fas fa-comment text-[8px]"></i></button>
                        </div>
                    </div>
                    <div className="rating-stars flex gap-0.5 justify-center mt-1">{stars}</div>
                </div>
            );
        }
        
        // --------------------------------------------------------------
        // 3. صفحة الرئيسية (مع أزرار عرض: شبكة فقط وقائمة فقط)
        // --------------------------------------------------------------
        function HomePage({ products, sellers, currentSellerId, selectedCountry, onLike, onWhatsApp, onProductClick, onShowOffers, onShowVIPPage, onComment, onRate, t }) {
            const [viewMode, setViewMode] = useState('grid');      // 'grid' أو 'list'
            const [category, setCategory] = useState('all');
            const filtered = React.useMemo(() => {
                let arr = Object.values(products).filter(p => p.sellerCountry === selectedCountry);
                if (category !== 'all') arr = arr.filter(p => p.category === category);
                arr.sort((a, b) => {
                    const sa = sellers[a.sellerId], sb = sellers[b.sellerId];
                    const va = sa?.subscription !== 'free' && sa?.vipExpiry > Date.now();
                    const vb = sb?.subscription !== 'free' && sb?.vipExpiry > Date.now();
                    if (va && !vb) return -1;
                    if (!va && vb) return 1;
                    return 0;
                });
                return arr;
            }, [products, category, selectedCountry, sellers]);
            const isLiked = (p) => currentSellerId ? p.likedBy.includes(currentSellerId) : false;
            
            // Grid: عرض كشبكة (صفين قابلين للسحب أفقياً)
            const half = Math.ceil(filtered.length / 2);
            const firstRow = filtered.slice(0, half);
            const secondRow = filtered.slice(half);
            
            return (
                <div className="flex flex-col h-full">
                    {/* شريط التصنيفات */}
                    <div className="sticky top-0 z-10 bg-white border-b px-2 py-2 overflow-x-auto scrollbar-hide">
                        <div className="flex gap-2">
                            {categoriesData.map(cat => (
                                <button key={cat.id} onClick={() => setCategory(cat.id)} 
                                    className={`flex items-center gap-1 px-3 py-1.5 rounded-full text-xs font-medium whitespace-nowrap transition ${category === cat.id ? 'bg-orange-500 text-white' : 'bg-gray-100 text-gray-700 hover:bg-orange-100'}`}>
                                    <i className={`fas ${cat.icon} text-xs`}></i> {cat.label}
                                </button>
                            ))}
                        </div>
                    </div>
                    
                    {/* أزرار العرض (عروض، VIP، ونمط العرض) */}
                    <div className="flex items-center gap-2 px-3 py-2 bg-white border-b">
                        <button onClick={onShowOffers} className="flex gap-1 px-3 py-1.5 rounded-xl bg-orange-50 text-orange-600 text-xs"><i className="fas fa-tag text-xs"></i> {t('offers')}</button>
                        <button onClick={onShowVIPPage} className="flex gap-1 px-3 py-1.5 rounded-xl bg-yellow-50 text-yellow-700 text-xs"><i className="fas fa-crown text-xs"></i> {t('vip_subscriptions')}</button>
                        <div className="flex-1"></div>
                        {/* زر الشبكة (Grid) */}
                        <button onClick={() => setViewMode('grid')} className={`p-1.5 rounded-lg text-xs ${viewMode === 'grid' ? 'bg-orange-500 text-white' : 'bg-gray-100'}`}><i className="fas fa-th"></i></button>
                        {/* زر القائمة (List) */}
                        <button onClick={() => setViewMode('list')} className={`p-1.5 rounded-lg text-xs ${viewMode === 'list' ? 'bg-orange-500 text-white' : 'bg-gray-100'}`}><i className="fas fa-list-ul"></i></button>
                    </div>
                    
                    {/* منطقة عرض المنتجات */}
                    <div className="flex-1 overflow-auto p-2">
                        {filtered.length === 0 && <div className="text-center py-10 text-gray-400"><i className="fas fa-box-open text-3xl"></i><p className="text-xs">{t('no_products')}</p></div>}
                        
                        {/* وضع الشبكة (Grid) - صفان قابلان للسحب أفقياً */}
                        {viewMode === 'grid' && (
                            <div className="space-y-3">
                                {firstRow.length > 0 && (
                                    <div className="horizontal-scroll flex gap-2 pb-1" style={{ overflowX: 'auto' }}>
                                        {firstRow.map(p => {
                                            const seller = sellers[p.sellerId];
                                            const isVIPseller = seller?.subscription !== 'free' && seller?.vipExpiry > Date.now();
                                            return <ProductCard key={p.id} product={p} isLiked={isLiked(p)} onLike={() => onLike(p.id)} onWhatsApp={() => onWhatsApp(p)} onClick={() => onProductClick(p)} onComment={() => onComment(p.id)} onRate={(rating) => onRate(p.id, rating)} t={t} isVIPseller={isVIPseller} isListView={false} />;
                                        })}
                                    </div>
                                )}
                                {secondRow.length > 0 && (
                                    <div className="horizontal-scroll flex gap-2 pb-1" style={{ overflowX: 'auto' }}>
                                        {secondRow.map(p => {

            const [showComment, setShowComment] = useState(false); const [newComment, setNewComment] = useState('');
            const stars = () => { let arr = []; for (let i=1;i<=5;i++) arr.push(<i key={i} className={`fas fa-star ${i <= product.rating ? 'text-yellow-400' : 'text-gray-300'} text-base cursor-pointer`} onClick={() => onRate(i)}></i>); return arr; };
            const addComment = () => { if (newComment.trim()) { onComment(newComment); setNewComment(''); setShowComment(false); } };
            return (<div className="p-4"><button onClick={onBack} className="mb-3 text-sm"><i className="fas fa-arrow-right ml-2"></i>{t('back')}</button><div className="bg-white rounded-2xl p-4"><div className="text-6xl text-center mb-2">{product.emoji}</div><h2 className="text-lg font-bold">{product.name}</h2><p className="text-xl text-blue-600 font-bold mt-1">{product.price.toLocaleString()} {t('currency')}</p><div className="flex gap-1 mt-1 justify-center">{stars()}</div><p className="text-gray-600 text-sm mt-2">{product.description || t('no_description')}</p><div className="mt-3 flex justify-between"><div className="text-sm"><i className="fas fa-store"></i> {seller?.storeName}</div><div className="flex gap-2"><button onClick={onLike} className={`flex gap-1 px-3 py-1 rounded-full text-sm ${isLiked ? 'bg-orange-500 text-white' : 'bg-gray-100'}`}><i className="fas fa-heart"></i> {product.likes}</button><button onClick={() => setShowComment(true)} className="flex gap-1 px-3 py-1 rounded-full bg-blue-100 text-blue-600 text-sm"><i className="fas fa-comment"></i> {t('comment')}</button></div></div>{showComment && (<div className="mt-3 p-2 bg-gray-100 rounded-xl"><textarea className="w-full p-2 border rounded-lg text-sm" rows="2" placeholder={t('write_comment')} value={newComment} onChange={e => setNewComment(e.target.value)} /><div className="flex gap-2 mt-2"><button onClick={addComment} className="px-3 py-1 bg-green-500 text-white rounded-lg text-sm">{t('publish')}</button><button onClick={() => setShowComment(false)} className="px-3 py-1 bg-gray-300 rounded-lg text-sm">{t('cancel')}</button></div></div>)}<div className="mt-3"><h3 className="font-semibold text-sm">{t('comments')}:</h3>{product.comments?.length === 0 ? <p className="text-gray-400 text-sm">{t('no_comments')}</p> : product.comments?.map((c,i) => <div key={i} className="border-t pt-1 mt-1 text-sm">{c}</div>)}</div></div></div>);
        }
        function OffersPage({ products, selectedCountry, onProductClick, onBack, t }) {
            const offers = Object.values(products).filter(p => (p.likes > 0 || p.price < 300) && p.sellerCountry === selectedCountry);
            return (<div className="flex flex-col h-full bg-white"><div className="flex items-center p-3 border-b"><button onClick={onBack} className="text-sm"><i className="fas fa-arrow-right ml-2"></i> {t('back')}</button><h1 className="flex-1 text-center font-bold text-sm">{t('special_offers')}</h1></div><div className="flex-1 overflow-auto p-3"><div className="grid grid-cols-2 gap-2">{offers.map(p => <div key={p.id} onClick={() => onProductClick(p)} className="bg-white rounded-xl border p-2 cursor-pointer"><div className="text-4xl text-center">{p.emoji}</div><h3 className="font-semibold text-xs line-clamp-2">{p.name}</h3><p className="text-orange-600 font-bold text-xs">{p.price} {t('currency')}</p></div>)}</div></div></div>);
        }
        function AdminDashboard({ sellers, products, onBack, onDeleteSeller, onDeleteProduct, onAddProductForSeller, onActivateVIP, t }) {
            const [selSeller, setSelSeller] = useState(''); const [pName, setPName] = useState(''); const [pPrice, setPPrice] = useState('');
            const sellerList = Object.values(sellers).filter(s => !s.isAdmin);
            return (<div className="flex flex-col h-full bg-white"><div className="flex items-center p-3 border-b"><button onClick={onBack} className="hover:text-orange-500 text-sm"><i className="fas fa-arrow-right ml-2"></i> {t('back')}</button><h1 className="flex-1 text-center font-bold text-sm">لوحة التحكم (Admin)</h1></div><div className="flex-1 overflow-auto p-3 space-y-4"><div><h2 className="text-base font-bold mb-2">إدارة البائعين</h2><div className="space-y-1">{sellerList.map(s => (<div key={s.id} className="flex justify-between items-center p-2 bg-gray-50 rounded-xl text-sm"><div><div className="font-semibold text-xs">{s.storeName}</div><div className="text-xs text-gray-500">{s.email}</div></div><div><button onClick={() => onActivateVIP(s.id)} className="text-yellow-500 ml-2 text-xs"><i className="fas fa-crown"></i> VIP</button><button onClick={() => onDeleteSeller(s.id)} className="text-red-500 text-xs"><i className="fas fa-trash-alt"></i></button></div></div>))}</div></div><div><h2 className="text-base font-bold mb-2">إضافة منتج لبائع</h2><div className="space-y-2"><select className="w-full p-2 border rounded-xl text-sm" value={selSeller} onChange={e => setSelSeller(e.target.value)}><option value="">اختر بائع</option>{sellerList.map(s => <option key={s.id} value={s.id}>{s.storeName}</option>)}</select><input placeholder="اسم المنتج" className="w-full p-2 border rounded-xl text-sm" value={pName} onChange={e => setPName(e.target.value)} /><input type="number" placeholder="السعر" className="w-full p-2 border rounded-xl text-sm" value={pPrice} onChange={e => setPPrice(e.target.value)} /><button onClick={() => { if (selSeller && pName && pPrice) onAddProductForSeller(selSeller, pName, parseFloat(pPrice)); }} className="w-full py-2 bg-orange-500 text-white rounded-xl text-sm">إضافة</button></div></div></div></div>);
        }
        
        // --------------------------------------------------------------
        // 7. التطبيق الرئيسي (App)
        // --------------------------------------------------------------
        function App() {
            const [state, setState] = useState(null);
            const [page, setPage] = useState('home');
            const [editingProduct, setEditingProduct] = useState(null);
            const [detailProduct, setDetailProduct] = useState(null);
            const [imgSearchResults, setImgSearchResults] = useState(null);
            const [imgSearchLoading, setImgSearchLoading] = useState(false);
            const [searchText, setSearchText] = useState('');
            const [showSearchBar, setShowSearchBar] = useState(false);
            const [lang, setLang] = useState(() => localStorage.getItem(LANG_KEY) === 'en' ? 'en' : 'ar');
            const [darkMode, setDarkMode] = useState(() => localStorage.getItem(THEME_KEY) === 'dark');
            const [selectedCountry, setSelectedCountry] = useState(() => localStorage.getItem(COUNTRY_KEY) || 'مصر');
            const cameraRef = useRef(null);
            
            const translations = {
                ar: { currency: 'ج.م', electronics: 'الإلكترونيات', fashion: 'الموضة', home: 'المنزل والمطبخ', toys: 'الألعاب', books: 'الكتب', offers: 'عروض', vip_subscriptions: 'اشتراكات VIP', no_products: 'لا توجد منتجات', back: 'رجوع', special_offers: 'العروض الخاصة', vip_membership: 'العضوية VIP', silver: 'فضي', gold: 'ذهبي', platinum: 'بلاتيني', monthly: 'شهرياً', yearly: 'سنوياً', subscribe_now: 'اشترك الآن', free_plan_note: 'الباقة المجانية: 10 منتجات', login: 'تسجيل الدخول', email: 'البريد الإلكتروني', password: 'كلمة المرور', login_btn: 'دخول', or: 'أو', join_seller: 'انضم كتاجر جديد', join_seller_title: 'انضم كتاجر', owner_name: 'اسم المالك', phone: 'رقم الهاتف', register: 'تسجيل', send_code: 'إرسال كود', enter_code: 'أدخل الكود', forgot_password: 'نسيت كلمة السر؟', store_points: 'المتجر والنقاط', ai_support: 'الدعم الذكي', add_product: 'إضافة منتج', my_products: 'منتجاتي', points: 'نقطة', package: 'الباقة', buy_100_points: '100 نقطة - 30 ج.م', buy_500_points: '500 نقطة - 120 ج.م', verify_store: 'توثيق المتجر - 150 ج.م', edit_product: 'تعديل منتج', product_name: 'اسم المنتج', price: 'السعر', emoji: 'رمز تعبيري', description: 'الوصف', vip_product: 'منتج VIP', save: 'حفظ', no_description: 'لا يوجد وصف', comment: 'تعليق', write_comment: 'اكتب تعليقك...', publish: 'نشر', cancel: 'إلغاء', comments: 'التعليقات', no_comments: 'لا توجد تعليقات', settings: 'الإعدادات', your_country: 'بلدك', invalid_credentials: 'بيانات غير صحيحة', profile: 'الملف الشخصي', account_status: 'حالة الحساب' },
                en: { currency: 'EGP', electronics: 'Electronics', fashion: 'Fashion', home: 'Home & Kitchen', toys: 'Toys', books: 'Books', offers: 'Offers', vip_subscriptions: 'VIP Subscriptions', no_products: 'No products', back: 'Back', special_offers: 'Special Offers', vip_membership: 'VIP Membership', silver: 'Silver', gold: 'Gold', platinum: 'Platinum', monthly: 'Monthly', yearly: 'Yearly', subscribe_now: 'Subscribe Now', free_plan_note: 'Free plan: max 10 products', login: 'Login', email: 'Email', password: 'Password', login_btn: 'Login', or: 'Or', join_seller: 'Join as seller', join_seller_title: 'Join as Seller', owner_name: 'Owner Name', phone: 'Phone', register: 'Register', send_code: 'Send code', enter_code: 'Enter code', forgot_password: 'Forgot password?', store_points: 'Store & Points', ai_support: 'AI Support', add_product: 'Add Product', my_products: 'My Products', points: 'points', package: 'Package', buy_100_points: '100 points - 30 EGP', buy_500_points: '500 points - 120 EGP', verify_store: 'Verify Store - 150 EGP', edit_product: 'Edit Product', product_name: 'Product Name', price: 'Price', emoji: 'Emoji', description: 'Description', vip_product: 'VIP Product', save: 'Save', no_description: 'No description', comment: 'Comment', write_comment: 'Write comment...', publish: 'Publish', cancel: 'Cancel', comments: 'Comments', no_comments: 'No comments', settings: 'Settings', your_country: 'Your country', invalid_credentials: 'Invalid credentials', profile: 'Profile', account_status: 'Account status' }
            };
            const t = (key) => translations[lang][key] || key;
            
            useEffect(() => { setState(loadState()); }, []);
            useEffect(() => { if (state) saveState(state); }, [state]);
            useEffect(() => { document.dir = lang === 'ar' ? 'rtl' : 'ltr'; localStorage.setItem(LANG_KEY, lang); }, [lang]);
            useEffect(() => { if (darkMode) document.body.classList.add('dark'); else document.body.classList.remove('dark'); localStorage.setItem(THEME_KEY, darkMode ? 'dark' : 'light'); }, [darkMode]);
            useEffect(() => { localStorage.setItem(COUNTRY_KEY, selectedCountry); }, [selectedCountry]);
            
            if (!state) return <div className="min-h-screen flex items-center justify-center"><div className="animate-pulse text-xl text-orange-500">VICKS MARKET</div></div>;
            
            const currentSeller = state.currentSellerId ? state.sellers[state.currentSellerId] : null;
            const isAdminUser = currentSeller?.isAdmin === true;
            const updateState = (updater) => setState(prev => updater(prev));
            
            const handleLogin = (s) => { updateState(st => ({ ...st, currentSellerId: s.id })); if (isAdmin(s)) setPage('adminProfile'); else setPage('seller'); };
            const handleRegister = (s) => { updateState(st => ({ ...st, sellers: { ...st.sellers, [s.id]: s }, currentSellerId: s.id })); setPage('seller'); };
            const handleLogout = () => { updateState(st => ({ ...st, currentSellerId: null })); setPage('home'); };
            const handleLike = (pid) => { if (!currentSeller) return; updateState(s => { const p = s.products[pid]; if (!p) return s; const liked = p.likedBy.includes(currentSeller.id); const newLiked = liked ? p.likedBy.filter(id => id !== currentSeller.id) : [...p.likedBy, currentSeller.id]; return { ...s, products: { ...s.products, [pid]: { ...p, likes: liked ? p.likes - 1 : p.likes + 1, likedBy: newLiked } } }; }); };
            const handleWhatsApp = (p) => { const phone = state.sellers[p.sellerId]?.phone?.replace(/\D/g,'') || '201113694362'; const msg = encodeURIComponent(`مرحباً مهتم بـ ${p.name} بسعر ${p.price} ج.م`); window.open(`https://wa.me/2${phone}?text=${msg}`,'_blank'); };
            const handleAddProduct = (data) => { if (!currentSeller) return; if (editingProduct) { updateState(s => ({ ...s, products: { ...s.products, [editingProduct.id]: { ...s.products[editingProduct.id], ...data } } })); } else { const newP = createProduct({ ...data, sellerId: currentSeller.id, sellerName: currentSeller.storeName, sellerCountry: currentSeller.country }); updateState(s => ({ ...s, products: { ...s.products, [newP.id]: newP }, sellers: { ...s.sellers, [currentSeller.id]: { ...s.sellers[currentSeller.id], products: [...(s.sellers[currentSeller.id]?.products || []), newP.id] } } })); } setEditingProduct(null); setPage('seller'); };
            const handleDeleteProduct = (pid) => { if (confirm('حذف المنتج؟')) updateState(s => { const np = { ...s.products }; delete np[pid]; const ns = { ...s.sellers }; if (ns[currentSeller.id]) ns[currentSeller.id].products = ns[currentSeller.id].products.filter(id => id !== pid); return { ...s, products: np, sellers: ns }; }); };
            const handleSendMessage = (text) => { updateState(s => { let ns = addChatMessage(s, { role: 'user', text }); ns = addChatMessage(ns, { role: 'bot', text: getBotResponse(text) }); return ns; }); };
            const handleImageUpload = (file) => { alert(`تم رفع الصورة: ${file.name}. سيتم إرسالها إلى الدعم.`); };
            const handlePurchaseComplete = (type, amt, pts) => { updateState(s => { const seller = s.sellers[currentSeller.id]; return { ...s, sellers: { ...s.sellers, [currentSeller.id]: { ...seller, points: seller.points + (pts || 0), verified: type === 'verify' ? true : seller.verified } } }; }); };
            const handleSubscriptionPurchase = (planId, price) => { updateState(s => { const seller = s.sellers[currentSeller.id]; return { ...s, sellers: { ...s.sellers, [currentSeller.id]: { ...seller, subscription: planId, vipExpiry: Date.now() + 86400000*30 } } }; }); alert(`تم الترقية إلى باقة ${planId}!`); setPage('seller'); };
            const handleDeleteSeller = (sid) => { if (confirm('حذف البائع؟')) updateState(s => { const ns = { ...s.sellers }; delete ns[sid]; const np = { ...s.products }; Object.keys(np).forEach(pid => { if (np[pid].sellerId === sid) delete np[pid]; }); return { ...s, sellers: ns, products: np }; }); };
            const handleAdminDeleteProduct = (pid) => { if (confirm('حذف المنتج؟')) updateState(s => { const np = { ...s.products }; delete np[pid]; return { ...s, products: np }; }); };
            const handleAddProductForSeller = (sid, pname, pprice) => { updateState(s => { const seller = s.sellers[sid]; if (!seller) return s; const newP = createProduct({ name: pname, price: pprice, category: 'electronics', emoji: '📦', description: '', sellerId: sid, sellerName: seller.storeName, sellerCountry: seller.country, vip: false }); return { ...s, products: { ...s.products, [newP.id]: newP }, sellers: { ...s.sellers, [sid]: { ...seller, products: [...seller.products, newP.id] } } }; }); alert('تمت الإضافة'); };
            const handleActivateVIP = (sid) => { if (confirm('تفعيل VIP للبائع؟')) updateState(s => { const seller = s.sellers[sid]; if (!seller) return s; return { ...s, sellers: { ...s.sellers, [sid]: { ...seller, subscription: 'gold', vipExpiry: Date.now() + 86400000*30 } } }; }); alert('تم تفعيل VIP'); };
            const handleCameraSearch = (e) => { const file = e.target.files[0]; if (!file) return; setImgSearchLoading(true); setTimeout(() => { const filtered = Object.values(state.products).filter(p => p.name.includes(searchText) || (!searchText)); setImgSearchResults(filtered.slice(0,12)); setImgSearchLoading(false); },1000); if (cameraRef.current) cameraRef.current.value = ''; };
            const handleSearchChange = (val) => { setSearchText(val); if (val.trim() === '') setImgSearchResults(null); else { const filtered = Object.values(state.products).filter(p => p.name.includes(val) || p.sellerName.includes(val)); setImgSearchResults(filtered); } };
            const showHome = () => { setPage('home'); setDetailProduct(null); setImgSearchResults(null); setSearchText(''); setShowSearchBar(false); };
            const handleComment = (pid, text) => { updateState(s => { const p = s.products[pid]; return { ...s, products: { ...s.products, [pid]: { ...p, comments: [...(p.comments || []), text] } } }; }); };
            const handleRate = (pid, rating) => { updateState(s => { const p = s.products[pid]; return { ...s, products: { ...s.products, [pid]: { ...p, rating } } }; }); };
            const isLiked = (p) => currentSeller ? p.likedBy.includes(currentSeller.id) : false;
            
            return (
                <div className="min-h-screen flex flex-col">
                    {page === 'home' && (
                        <>
                            <header className="sticky top-0 z-20 bg-white border-b px-3 py-2 flex items-center justify-between">
                                <div className="flex items-center gap-2"><i className="fas fa-store text-orange-500 text-base"></i><span className="text-xs font-bold text-orange-600">VICKS MARKET</span></div>
                                <div className="flex gap-2">
                                    <button onClick={() => cameraRef.current?.click()} className="p-1 rounded-lg bg-gray-100 hover:bg-orange-500"><i className="fas fa-camera text-xs"></i></button>
                                    <button onClick={() => setShowSearchBar(!showSearchBar)} className="p-1 rounded-lg bg-gray-100 hover:bg-orange-500"><i className="fas fa-search text-xs"></i></button>
                                    <button onClick={() => setDarkMode(!darkMode)} className="p-1 rounded-lg bg-gray-100"><i className={`fas fa-${darkMode ? 'sun' : 'moon'} text-xs`}></i></button>
                                    <button onClick={() => currentSeller ? (isAdminUser ? setPage('adminProfile') : setPage('seller')) : setPage('login')} className="p-1 rounded-lg bg-gray-100"><i className="fas fa-user-circle text-xs"></i></button>
                                </div>
                                <input ref={cameraRef} type="file" accept="image/*" capture="environment" className="hidden" onChange={handleCameraSearch} />
                            </header>
                            {showSearchBar && (<div className="bg-white px-3 pb-2 pt-1 border-b"><div className="relative"><i className="fas fa-search absolute right-2 top-2 text-gray-400 text-xs"></i><input type="text" placeholder={t('search_placeholder')} className="w-full p-2 pr-7 bg-gray-100 rounded-lg text-xs" value={searchText} onChange={(e) => handleSearchChange(e.target.value)} autoFocus /></div></div>)}
                            {imgSearchLoading && <div className="bg-blue-50 p-1 text-center text-xs"><i className="fas fa-spinner fa-pulse"></i> جاري البحث...</div>}
                            <main className="flex-1 overflow-hidden">
                                <HomePage products={state.products} sellers={state.sellers} currentSellerId={state.currentSellerId} selectedCountry={selectedCountry} onLike={handleLike} onWhatsApp={handleWhatsApp} onProductClick={p => { setDetailProduct(p); setPage('detail'); }} onShowOffers={() => setPage('offers')} onShowVIPPage={() => setPage('vip')} onComment={(pid) => { const c = prompt(t('write_comment')); if (c) handleComment(pid, c); }} onRate={handleRate} t={t} />
                            </main>
                            <button onClick={() => setPage('chat')} className="fixed bottom-4 right-4 w-10 h-10 rounded-full bg-orange-500 text-white shadow-lg flex items-center justify-center z-30"><i className="fas fa-robot text-base"></i></button>
                        </>
                    )}
                    {page === 'offers' && <OffersPage products={state.products} selectedCountry={selectedCountry} onProductClick={p => { setDetailProduct(p); setPage('detail'); }} onBack={showHome} t={t} />}
                    {page === 'vip' && (!currentSeller ? <div className="p-4 text-center text-sm">الرجاء تسجيل الدخول أولاً</div> : <VIPPage seller={currentSeller} onBack={showHome} onPurchaseSubscription={handleSubscriptionPurchase} t={t} />)}
                    {page === 'adminProfile' && currentSeller && isAdminUser && <AdminProfilePage seller={currentSeller} onLogout={handleLogout} onBack={showHome} t={t} />}
                    {page === 'admin' && currentSeller && isAdminUser && <AdminDashboard sellers={state.sellers} products={state.products} onBack={showHome} onDeleteSeller={handleDeleteSeller} onDeleteProduct={handleAdminDeleteProduct} onAddProductForSeller={handleAddProductForSeller} onActivateVIP={handleActivateVIP} t={t} />}
                    {page === 'login' && <LoginPage sellers={state.sellers} onLogin={handleLogin} onGoJoin={() => setPage('join')} onBack={showHome} t={t} />}
                    {page === 'join' && <JoinPage sellers={state.sellers} onRegister={handleRegister} onBack={() => setPage('login')} t={t} />}
                    {page === 'seller' && currentSeller && !isAdminUser && <SellerPage seller={state.sellers[currentSeller.id]} products={state.products} onGoStore={() => setPage('store')} onGoChat={() => setPage('chat')} onAddProduct={() => { setEditingProduct(null); setPage('addProduct'); }} onEditProduct={p => { setEditingProduct(p); setPage('addProduct'); }} onDeleteProduct={handleDeleteProduct} onLogout={handleLogout} onBack={showHome} onChangeLang={setLang} currentLang={lang} t={t} onOpenSettings={() => setPage('settings')} />}
                    {page === 'store' && currentSeller && <StorePage seller={state.sellers[currentSeller.id]} onBack={() => setPage('seller')} onPurchaseComplete={handlePurchaseComplete} t={t} />}
                    {page === 'chat' && <ChatPage messages={state.chatMessages} onSendMessage={handleSendMessage} onBack={() => setPage(currentSeller ? (isAdminUser ? 'adminProfile' : 'seller') : 'home')} t={t} onImageUpload={handleImageUpload} />}
                    {page === 'addProduct' && currentSeller && <AddProductPage onSave={handleAddProduct} onBack={() => { setEditingProduct(null); setPage('seller'); }} editProduct={editingProduct} sellerCountry={currentSeller.country} t={t} />}
                    {page === 'detail' && detailProduct && <ProductDetailPage product={state.products[detailProduct.id] || detailProduct} seller={state.sellers[detailProduct.sellerId] || null} isLiked={isLiked(state.products[detailProduct.id] || detailProduct)} onLike={() => handleLike(detailProduct.id)} onBack={showHome} onComment={(text) => handleComment(detailProduct.id, text)} onRate={(rating) => handleRate(detailProduct.id, rating)} t={t} />}
                    {page === 'settings' && <SettingsPage selectedCountry={selectedCountry} setSelectedCountry={setSelectedCountry} t={t} />}
                </div>
            );
        }
        
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
