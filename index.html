    function LoginPage({ sellers, onLogin, onGoJoin, onBack, onForgotPassword }) {
        const [email, setEmail] = useState('');
        const [pass, setPass] = useState('');
        const [err, setErr] = useState('');
        const dologin = () => {
            const e = email.trim();
            const p = pass.trim();
            if(!e || !p) { setErr('يرجى إدخال البريد الإلكتروني وكلمة المرور'); return; }
            const found = Object.values(sellers).find(s => s.email===e && s.password===p);
            if(found) { setErr(''); onLogin(found); return; }
            setErr('بيانات غير صحيحة');
        };

        const signInWithGoogle = async () => {
            if (!auth) { alert("Firebase غير مهيأ."); return; }
            try {
                const provider = new firebase.auth.GoogleAuthProvider();
                const result = await auth.signInWithPopup(provider);
                const user = result.user;
                let found = Object.values(sellers).find(s => s.email === user.email);
                if (!found) {
                    const newUser = createSeller({
                        email: user.email, password: 'google-oauth', storeName: '',
                        ownerName: user.displayName || 'مستخدم Google', phone: user.phoneNumber || '',
                        avatar: '👤', accountType: 'customer', country: 'مصر'
                    });
                    onLogin(newUser);
                } else { onLogin(found); }
            } catch (error) {
                console.error(error);
                alert("فشل تسجيل الدخول عبر Google: " + (error.message || "أغلق المستخدم النافذة"));
            }
        };

        const signInWithFacebook = async () => {
            if (!auth) { alert("Firebase غير مهيأ."); return; }
            try {
                const provider = new firebase.auth.FacebookAuthProvider();
                const result = await auth.signInWithPopup(provider);

    // ========== Main App ==========
    function App() {
        const [state, setState] = useState(loadState);
        const [page, setPage] = useState('home');
        const [selectedProduct, setSelectedProduct] = useState(null);
        const [selectedSellerId, setSelectedSellerId] = useState(null);
        const [showSearchBar, setShowSearchBar] = useState(false);
        const [searchQuery, setSearchQuery] = useState('');
        const [imagePreview, setImagePreview] = useState(null);

        const currSeller = state.currentSellerId ? state.sellers[state.currentSellerId] : null;

        useEffect(() => {
            saveState(state);
        }, [state]);

        const updateSeller = (id, updates) => {
            setState(prev => ({
                ...prev,
                sellers: { ...prev.sellers, [id]: { ...prev.sellers[id], ...updates } }
            }));
        };

        const handleLogin = (seller) => {
            setState(prev => ({ ...prev, currentSellerId: seller.id }));
            setPage('home');
        };

        const handleLogout = () => {
            setState(prev => ({ ...prev, currentSellerId: null }));
            setPage('home');
        };

        const handleRegister = (newSeller) => {
            setState(prev => ({
                ...prev,
                sellers: { ...prev.sellers, [newSeller.id]: newSeller },
                currentSellerId: newSeller.id
            }));
            setPage('home');
        };

        const handleLike = (productId) => {
            if (!state.currentSellerId) {
                alert('يرجى تسجيل الدخول أولاً');
                return;
            }
            setState(prev => {
                const prods = { ...prev.products };
                const p = { ...prods[productId] };
                if (!p.likedBy) p.likedBy = [];
                if (p.likedBy.includes(prev.currentSellerId)) {
                    p.likedBy = p.likedBy.filter(id => id !== prev.currentSellerId);
                    p.likes = Math.max(0, (p.likes || 0) - 1);
                } else {
                    p.likedBy = [...p.likedBy, prev.currentSellerId];
                    p.likes = (p.likes || 0) + 1;
                }
                prods[productId] = p;
                return { ...prev, products: prods };
            });
        };

        const handleWhats = (product, preference) => {
            const seller = state.sellers[product.sellerId];
            if (!seller) return;
            const phone = seller.phone?.replace(/[^0-9]/g, '') || '01113694362';
            const message = `مرحباً، أنا مهتم بمنتج: ${product.name} (${product.price} ج.م)`;
            if (preference === 'telegram') {
                window.open(`https://t.me/${phone}?text=${encodeURIComponent(message)}`, '_blank');
            } else {
                window.open(`https://wa.me/${phone}?text=${encodeURIComponent(message)}`, '_blank');
            }
        };

        const handleProductClick = (product) => {
            setSelectedProduct(product);
            setPage('product');
        };

        const handleRate = (productId, rating) => {
            if (!state.currentSellerId) {
                alert('يرجى تسجيل الدخول أولاً');
                return;
            }
            setState(prev => {
                const prods = { ...prev.products };
                prods[productId] = { ...prods[productId], rating };
                return { ...prev, products: prods };
            });
        };

        const handleSend = (text) => {
            const userMsg = { role: 'user', text };
            let newState = addMessage(state, userMsg);
            const reply = botReply(text);
            newState = addMessage(newState, { role: 'bot', text: reply });
            setState(newState);
        };

        const handlePurchase = (type, option) => {
            if (!currSeller) return;
            let cost = 0;
            let updates = {};
            if (type === 'verify') { cost = 70; updates = { verificationBadge: true, points: currSeller.points - 70 }; }
            else if (type === 'max100') { cost = 50; updates = { maxProducts: 100, points: currSeller.points - 50 }; }
            else if (type === 'vip') { cost = 50; updates = { subscription: 'vip', points: currSeller.points - 50 }; }
            else if (type === 'sub' && option) {
                cost = option.cost;
                const expiry = Date.now() + option.months * 30 * 86400000;
                updates = { subscriptionExpiry: expiry, subscription: 'premium', points: currSeller.points - cost };
            }
            if (currSeller.points >= cost) {
                updateSeller(currSeller.id, updates);
                alert('تم الشراء بنجاح!');
            } else {
                alert('نقاط غير كافية');
            }
        };

        const handleAddPoints = (amount) => {
            if (!currSeller) return;
            updateSeller(currSeller.id, { points: currSeller.points + amount });
        };

        const handleAddComment = (productId, comment) => {
            setState(prev => {
                const prods = { ...prev.products };
                const p = { ...prods[productId] };
                if (!p.comments) p.comments = [];
                p.comments = [...p.comments, comment];
                prods[productId] = p;
                return { ...prev, products: prods };
            });
        };

        const handleToggleContactPref = () => {
            if (!currSeller) return;
            const newPref = currSeller.contactPreference === 'telegram' ? 'whatsapp' : 'telegram';
            updateSeller(currSeller.id, { contactPreference: newPref });
        };

        const renderPage = () => {
            switch (page) {
                case 'chat':
                    return <ChatPage messages={state.chatMessages} onSend={handleSend} onBack={() => setPage('home')} />;
                case 'login':
                    return <LoginPage sellers={state.sellers} onLogin={handleLogin} onGoJoin={() => setPage('join')} onBack={() => setPage('home')} onForgotPassword={() => setPage('forgot')} />;
                case 'join':
                    return <JoinPage onRegister={handleRegister} onBack={() => setPage('login')} />;
                case 'forgot':
                    return <ForgotPasswordPage onBack={() => setPage('login')} />;
                case 'vip':
                    if (!currSeller) return <LoginPage sellers={state.sellers} onLogin={handleLogin} onGoJoin={() => setPage('join')} onBack={() => setPage('home')} onForgotPassword={() => setPage('forgot')} />;
                    return <VIPPage seller={currSeller} onBack={() => setPage('home')} onPurchase={handlePurchase} onAddPoints={handleAddPoints} />;
                case 'product':
                    if (!selectedProduct) { setPage('home'); return null; }
                    const prodSeller = state.sellers[selectedProduct.sellerId];
                    return <ProductDetailPage product={selectedProduct} seller={prodSeller} onBack={() => { setSelectedProduct(null); setPage('home'); }}
                        onLike={() => handleLike(selectedProduct.id)}
                        onWhats={() => handleWhats(selectedProduct, prodSeller?.contactPreference || 'whatsapp')}
                        onRate={(r) => handleRate(selectedProduct.id, r)}
                        onImageClick={(p) => setImagePreview(p)}
                        liked={currSeller ? selectedProduct.likedBy?.includes(currSeller.id) : false}
                        contactPreference={prodSeller?.contactPreference || 'whatsapp'} />;
                case 'sellerProfile':
                    const viewSeller = state.sellers[selectedSellerId];
                    if (!viewSeller) { setPage('home'); return null; }
                    return <SellerProfilePage seller={viewSeller} products={state.products} onBack={() => { setSelectedSellerId(null); setPage('home'); }}
                        onProductClick={(p) => { setSelectedProduct(p); setPage('product'); }}
                        onImageClick={(p) => setImagePreview(p)} />;
                case 'comments':
                    if (!selectedProduct) { setPage('home'); return null; }
                    return <CommentsPage product={selectedProduct} onBack={() => setPage('product')} onAddComment={handleAddComment} />;
                default:
                    return <HomePage products={state.products} sellers={state.sellers} currSellerId={state.currentSellerId}
                        onLike={handleLike} onWhats={handleWhats} onProductClick={handleProductClick}
                        onShowOffers={() => alert('قسم العروض قادم قريباً!')}
                        onShowVIP={() => setPage('vip')}
                        onRate={handleRate}
                        onSellerProfile={(id) => { setSelectedSellerId(id); setPage('sellerProfile'); }}
                        onImageClick={(p) => setImagePreview(p)}
                        onCommentsClick={(p) => { setSelectedProduct(p); setPage('comments'); }}
                        showSearchBar={showSearchBar}
                        searchQuery={searchQuery}
                        onSearchQueryChange={setSearchQuery}
                        onToggleContactPref={handleToggleContactPref} />;
            }
        };

        return (
            <div className="max-w-md mx-auto bg-white min-h-screen relative" style={{direction: 'rtl'}}>
                {page === 'home' && (
                    <div className="flex items-center justify-between p-4 border-b bg-white sticky top-0 z-20">
                        <h1 className="font-bold text-xl">🏪 VICKS MARKET</h1>
                        <div className="flex items-center gap-2">
                            <button onClick={() => setShowSearchBar(!showSearchBar)} className="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center">
                                <i className="fas fa-search"></i>
                            </button>
                            <button onClick={() => setPage('chat')} className="w-10 h-10 rounded-full bg-orange-100 text-orange-500 flex items-center justify-center">
                                <i className="fas fa-robot"></i>
                            </button>
                            {currSeller ? (
                                <div className="flex items-center gap-1">
                                    <button onClick={() => { setSelectedSellerId(currSeller.id); setPage('sellerProfile'); }} className="flex items-center gap-1">
                                        <span className="w-8 h-8 rounded-full bg-gray-200 flex items-center justify-center text-sm">{currSeller.avatar}</span>
                                    </button>
                                    <button onClick={handleLogout} className="text-xs text-red-500">خروج</button>
                                </div>
                            ) : (
                                <button onClick={() => setPage('login')} className="text-xs bg-orange-500 text-white px-3 py-1.5 rounded-xl">دخول</button>
                            )}
                        </div>
                    </div>
                )}
                {renderPage()}
                {imagePreview && <ImagePreviewModal emoji={imagePreview.emoji} name={imagePreview.name} onClose={() => setImagePreview(null)} />}
            </div>
        );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
</script>
