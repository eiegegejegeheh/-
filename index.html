<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VICKS MARKET | PRO EDITION</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --orange: #ff6600;
            --gold: #FFD700;
            --bg-dark: #0a0a0a;
            --card-bg: #121212;
            --border: #2a2a2a;
        }

        body {
            background-color: var(--bg-dark);
            color: white;
            font-family: sans-serif;
            overflow-x: hidden;
        }

        /* 1. تعديلات الهيدر */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-left { display: flex; gap: 18px; order: -1; }
        .header-right { display: flex; gap: 18px; align-items: center; }

        /* 2. تصميم البروفايل الملكي */
        .owner-profile { text-align: center; padding: 20px; position: relative; }
        .avatar-container {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 15px;
        }
        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid var(--gold);
            object-fit: cover;
        }
        .owner-crown {
            position: absolute;
            top: -18px;
            left: -12px;
            font-size: 32px;
            color: var(--gold);
            transform: rotate(-20deg);
        }
        .verified-gold {
            position: absolute;
            bottom: 2px;
            right: 2px;
            background: var(--gold);
            color: black;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
        }
        .pts-inf { position: absolute; top: 10px; right: 20px; color: var(--gold); font-weight: 900; }

        /* 3. بطاقة المنتج الماركت */
        .product-scroll-container {
            display: flex;
            overflow-x: auto;
            gap: 12px;
            padding: 15px;
            scroll-snap-type: x mandatory;
        }
        .product-card {
            min-width: 260px;
            background: var(--card-bg);
            border-radius: 18px;
            padding: 12px;
            border: 1px solid var(--border);
        }
        .product-img {
            width: 100%;
            height: 190px;
            background: #1a1a1a;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
        }
        .price-stars-row { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }

        /* 4. واجهة البوت */
        .ai-chat-box {
            position: fixed;
            inset: 0;
            background: var(--bg-dark);
            z-index: 500;
            display: none;
            flex-direction: column;
        }
        .ai-watermark {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 5rem;
            color: rgba(255, 102, 0, 0.04);
            pointer-events: none;
            z-index: 0;
        }
        .ai-bottom-bar {
            padding: 12px;
            background: var(--card-bg);
            display: flex;
            align-items: center;
            gap: 10px;
            border-top: 1px solid var(--border);
        }

        /* ماكينة النقاط */
        .points-box {
            background: #181818;
            border: 1px solid var(--orange);
            border-radius: 15px;
            padding: 15px;
            margin: 20px auto;
            max-width: 350px;
        }
    </style>
</head>
<body>

<div id="app">
    <header class="header">
        <div class="header-left">
            <i class="fas fa-search text-xl cursor-pointer"></i>
            <i class="fas fa-th-large text-xl cursor-pointer"></i>
        </div>
        <div class="text-orange-500 font-black text-2xl">V-FIX</div>
        <div class="header-right">
            <i class="fas fa-crown text-gold cursor-pointer"></i>
            <i class="fas fa-percentage cursor-pointer"></i>
            <i class="fas fa-user-circle text-2xl cursor-pointer" onclick="showProfile()"></i>
        </div>
    </header>

    <main id="content" class="p-4">
        <h2 class="text-lg font-bold mb-2">أحدث العروض</h2>
        <div id="product-list" class="product-scroll-container"></div>
    </main>
</div>

<div id="ai-chat" class="ai-chat-box">
    <div class="ai-watermark">VICKS AI</div>
    <div class="p-4 bg-orange-600 flex justify-between font-bold">
        <span>VICKS AI SUPPORT</span>
        <i class="fas fa-times cursor-pointer" onclick="toggleChat(false)"></i>
    </div>
    <div class="flex-1 p-4 overflow-y-auto" id="chat-content"></div>
    <div class="ai-bottom-bar">
        <i class="fas fa-plus text-gray-500 text-xl cursor-pointer"></i>
        <i class="fas fa-camera text-gray-500 text-xl cursor-pointer"></i>
        <input type="text" placeholder="اكتب رسالتك..." class="flex-1 bg-transparent outline-none">
        <i class="fas fa-paper-plane text-orange-500 text-xl cursor-pointer"></i>
    </div>
</div>

<button class="fixed bottom-6 right-6 w-14 h-14 bg-orange-600 rounded-full shadow-lg z-50 flex items-center justify-center text-2xl" onclick="toggleChat(true)">
    <i class="fas fa-robot"></i>
</button>

<script>
    // بيانات تجريبية
    const userEmail = "mom1113694362@gmail.com"; 

    function renderProducts() {
        const list = document.getElementById('product-list');
        for(let i=1; i<=10; i++) {
            list.innerHTML += `
                <div class="product-card">
                    <div class="product-img">📱</div>
                    <div class="mt-2 font-bold text-center">آيفون 15 برو ماكس</div>
                    <div class="price-stars-row">
                        <span class="text-orange-500 font-black">1200 دينار</span>
                        <div class="text-gold text-xs">
                            <i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i>
                        </div>
                    </div>
                    <div class="flex justify-between items-center mt-3">
                        <div class="flex items-center gap-1 text-[10px] text-gray-400">
                             <div class="w-4 h-4 bg-gray-600 rounded-full"></div> متجر زيرو
                        </div>
                        <div class="flex gap-2 text-gray-400 text-sm">
                            <i class="fas fa-heart"></i><i class="fas fa-comment"></i><i class="fab fa-telegram"></i>
                        </div>
                    </div>
                </div>`;
        }
    }

    function showProfile() {
        const main = document.getElementById('content');
        main.innerHTML = `
            <div class="owner-profile">
                <div class="pts-inf">النقاط: ∞</div>
                <div class="avatar-container">
                    <i class="fas fa-crown owner-crown"></i>
                    <img src="https://via.placeholder.com/150" class="avatar-img">
                    <div class="verified-gold"><i class="fas fa-check"></i></div>
                </div>
                <h1 class="text-2xl font-bold">Z҉E҉R҉O҉</h1>
                <p class="text-gray-500 text-sm">الإيميل: ${userEmail}</p>
                <p class="text-gray-500 text-sm">ID: 1000000000</p>

                <div class="points-box">
                    <h3 class="text-orange-500 font-bold mb-3">ماكينة تحويل النقاط</h3>
                    <input type="text" id="target" placeholder="ID المستخدم" class="w-full bg-black p-2 rounded border border-gray-800 mb-3 text-center">
                    <div class="flex justify-center gap-2 items-center mb-4">
                        <button onclick="change(10)" class="bg-orange-700 px-3 py-1 rounded">+10</button>
                        <button onclick="change(1)" class="bg-orange-500 px-3 py-1 rounded">+1</button>
                        <span id="val" class="font-bold mx-2">0</span>
                        <button onclick="change(-1)" class="bg-red-500 px-3 py-1 rounded">-1</button>
                        <button onclick="change(-10)" class="bg-red-700 px-3 py-1 rounded">-10</button>
                    </div>
                    <button class="w-full bg-white text-black font-bold py-2 rounded">تأكيد التحويل</button>
                </div>
            </div>`;
    }

    let currentVal = 0;
    function change(v) { currentVal += v; document.getElementById('val').innerText = currentVal; }
    function toggleChat(show) { document.getElementById('ai-chat').style.display = show ? 'flex' : 'none'; }

    renderProducts();
</script>

</body>
</html>
