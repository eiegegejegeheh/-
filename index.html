<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>VICKS MARKET | منصة تجارة عالمية</title>
    <script src="https://cdn.tailwindcss.com">
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js">
    </script>
    <style>
        :root {
            --orange: #ff6600;
            --orange-light: #fff7ed;
            --bg-light: #f9fafb;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-sub: #6b7280;
            --border: #e5e7eb;
            --input-bg: #f3f4f6;
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        body.dark {
            --bg-light: #0a0a0a;
            --card-bg: #121212;
            --text-main: #ffffff;
            --text-sub: #cccccc;
            --border: #2a2a2a;
            --orange-light: #1a1006;
            --input-bg: #1e1e1e;
            --shadow: 0 2px 8px rgba(255, 255, 255, 0.04);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-light);
            color: var(--text-main);
            max-width: 100vw;
            overflow-x: hidden;
            transition: background 0.3s, color 0.3s;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 100vw;
            overflow-x: hidden;
        }

        .header {
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 30;
            gap: 8px;
            box-shadow: var(--shadow);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .logo-text {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--orange);
            white-space: nowrap;
        }

        .content-scroll {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding-bottom: 20px;
            -webkit-overflow-scrolling: touch;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            padding: 8px;
        }

        .product-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 8px;
        }

        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            overflow: hidden;
            cursor: pointer;
            transition: box-shadow 0.2s, transform 0.15s;
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow);
        }

        .product-card:active {
            transform: scale(0.98);
        }

        .product-card.list-view {
            flex-direction: row;
            gap: 12px;
            padding: 10px;
            align-items: stretch;
        }

        .product-image {
            background: #f3f4f6;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            cursor: pointer;
            transition: background 0.2s;
            position: relative;
            overflow: hidden;
        }

        body.dark .product-image {
            background: #1a1a1a;
        }

        .grid-card .product-image {
            height: 150px;
            font-size: 4.5rem;
            border-radius: 0;
        }

        .list-card .product-image {
            width: 85px;
            height: 85px;
            font-size: 2.8rem;
            border-radius: 12px;
        }

        .card-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 8px 10px 10px;
            gap: 6px;
            min-width: 0;
        }

        .list-view .card-body {
            padding: 0;
            gap: 4px;
        }

        .product-name {
            font-weight: 700;
            font-size: 0.82rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: center;
            color: var(--text-main);
            line-height: 1.3;
        }

        .list-view .product-name {
            text-align: right;
            font-size: 0.85rem;
        }

        .stars {
            display: flex;
            gap: 2px;
            flex-shrink: 0;
            direction: ltr;
            justify-content: center;
        }

        .list-view .stars {
            justify-content: flex-start;
        }

        .stars i {
            font-size: 11px;
            cursor: pointer;
            transition: color 0.15s;
        }

        .seller-info {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            max-width: 95px;
            overflow: hidden;
            flex-shrink: 0;
            font-size: 0.68rem;
            color: var(--text-sub);
        }

        .seller-avatar {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.65rem;
            flex-shrink: 0;
        }

        .seller-name-text {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-weight: 500;
        }

        .bottom-row {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
            gap: 6px;
            flex-wrap: wrap;
            max-width: 100%;
        }

        .action-btns {
            display: flex;
            gap: 7px;
            flex-shrink: 0;
            flex-wrap: wrap;
            order: -1;
        }

        .action-btn {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
            position: relative;
            flex-shrink: 0;
        }

        .action-btn:active {
            transform: scale(0.9);
        }

        .price {
            font-weight: 800;
            color: var(--orange);
            font-size: 0.9rem;
            white-space: nowrap;
            flex-shrink: 0;
            order: 1;
            text-align: left;
        }

        .search-overlay {
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            padding: 10px 14px;
            animation: slideDown 0.25s ease;
            flex-shrink: 0;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .search-wrapper {
            display: flex;
            align-items: center;
            background: var(--input-bg);
            border-radius: 24px;
            padding: 0 12px;
            gap: 8px;
            border: 1px solid var(--border);
        }

        .search-wrapper input {
            flex: 1;
            border: none;
            background: transparent;
            padding: 10px 4px;
            outline: none;
            font-size: 0.85rem;
            color: var(--text-main);
            min-width: 0;
        }

        .search-icon-btn {
            background: none;
            border: none;
            color: var(--text-sub);
            cursor: pointer;
            font-size: 1rem;
            padding: 6px;
            border-radius: 50%;
            transition: background 0.2s;
            flex-shrink: 0;
        }

        .icon-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--input-bg);
            color: var(--text-sub);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            transition: background 0.2s;
            flex-shrink: 0;
        }

        .icon-btn:hover {
            background: #e5e7eb;
        }
        body.dark .icon-btn:hover {
            background: #333;
        }

        .btn-primary {
            background: var(--orange);
            color: white;
            border: none;
            border-radius: 14px;
            padding: 12px 24px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9rem;
            width: 100%;
            transition: background 0.2s;
        }

        .btn-primary:hover {
            background: #e55d00;
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 12px;
            border-radius: 14px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid var(--border);
            background: var(--card-bg);
            color: var(--text-main);
            font-size: 0.85rem;
            transition: background 0.2s;
            margin-bottom: 8px;
        }

        .social-btn.google {
            border-color: #ea4335;
            color: #ea4335;
        }
        .social-btn.facebook {
            border-color: #1877f2;
            color: #1877f2;
        }
        .social-btn.email-signup {
            border-color: var(--orange);
            color: var(--orange);
        }
        .social-btn:hover {
            background: var(--input-bg);
        }

        .category-btn {
            padding: 7px 15px;
            border-radius: 20px;
            border: 1px solid var(--border);
            cursor: pointer;
            white-space: nowrap;
            font-size: 0.78rem;
            flex-shrink: 0;
            background: var(--card-bg);
            color: var(--text-sub);
            transition: all 0.2s;
            font-weight: 500;
        }

        .category-btn.active {
            background: var(--orange) !important;
            color: white !important;
            border-color: var(--orange) !important;
            font-weight: 700;
        }

        .comments-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            z-index: 90;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .comments-panel {
            background: var(--card-bg);
            border-radius: 18px 18px 0 0;
            width: 100%;
            max-height: 35vh;
            display: flex;
            flex-direction: column;
            animation: slideUp 0.3s ease;
            overflow: hidden;
        }

        @keyframes slideUp {
            from {
                transform: translateY(100%);
            }
            to {
                transform: translateY(0);
            }
        }

        .comments-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .comments-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 22vh;
        }

        .comment-bubble {
            background: var(--input-bg);
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 0.8rem;
            line-height: 1.4;
            color: var(--text-main);
            max-width: 90%;
            align-self: flex-start;
            border: 1px solid var(--border);
        }

        .comment-input-row {
            display: flex;
            gap: 8px;
            padding: 10px 16px;
            border-top: 1px solid var(--border);
            flex-shrink: 0;
            align-items: center;
        }

        .comment-input-row input {
            flex: 1;
            padding: 10px 14px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: var(--input-bg);
            outline: none;
            font-size: 0.8rem;
            color: var(--text-main);
            min-width: 0;
        }

        .send-comment-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--orange);
            color: white;
            border: none;
            cursor: pointer;
            flex-shrink: 0;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .toast {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: #1f2937;
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 0.8rem;
            z-index: 200;
            animation: toastIn 0.3s ease, toastOut 0.3s ease 1.8s forwards;
            pointer-events: none;
            white-space: nowrap;
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
        @keyframes toastOut {
            from {
                opacity: 1;
            }
            to {
                opacity: 0;
                transform: translateX(-50%) translateY(-10px);
            }
        }

        .hidden-file-input {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
            pointer-events: none;
        }

        .chat-fullscreen {
            position: fixed;
            inset: 0;
            z-index: 80;
            background: var(--bg-light);
            display: flex;
            flex-direction: column;
            animation: fadeIn 0.2s ease;
        }

        .chat-fullscreen .chat-header-bar {
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: var(--orange);
            color: white;
            font-weight: bold;
            font-size: 1rem;
        }

        .chat-fullscreen .chat-messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .chat-fullscreen .chat-input-bar {
            flex-shrink: 0;
            display: flex;
            gap: 8px;
            padding: 10px 16px;
            border-top: 1px solid var(--border);
            background: var(--card-bg);
            align-items: center;
        }

        .chat-fullscreen .chat-input-bar input {
            flex: 1;
            padding: 10px 14px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: var(--input-bg);
            outline: none;
            font-size: 0.85rem;
            color: var(--text-main);
            min-width: 0;
        }

        .msg-user {
            background: var(--orange);
            color: white;
            padding: 10px 14px;
            border-radius: 16px 16px 4px 16px;
            max-width: 80%;
            align-self: flex-end;
            font-size: 0.82rem;
            line-height: 1.4;
        }

        .msg-bot {
            background: var(--input-bg);
            padding: 10px 14px;
            border-radius: 16px 16px 16px 4px;
            max-width: 80%;
            align-self: flex-start;
            font-size: 0.82rem;
            line-height: 1.4;
            color: var(--text-main);
            border: 1px solid var(--border);
        }

        .floating-ai-btn {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--orange);
            color: white;
            border: none;
            cursor: pointer;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            box-shadow: 0 6px 20px rgba(255, 102, 0, 0.5);
            transition: transform 0.2s, box-shadow 0.2s;
            animation: pulse-orange 2s infinite;
        }

        .floating-ai-btn:active {
            transform: scale(0.9);
            box-shadow: 0 3px 10px rgba(255, 102, 0, 0.4);
        }

        @keyframes pulse-orange {
            0% {
                box-shadow: 0 0 0 0 rgba(255, 102, 0, 0.7);
            }
            70% {
                box-shadow: 0 0 0 14px rgba(255, 102, 0, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(255, 102, 0, 0);
            }
        }

        .separator-text {
            text-align: center;
            color: var(--text-sub);
            font-size: 0.78rem;
            font-weight: 400;
            margin: 12px 0 8px;
            opacity: 0.8;
        }

        .vip-card {
            background: var(--card-bg);
            border: 2px solid var(--border);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            margin-bottom: 12px;
        }
        .vip-card.platinum {
            border-color: #ffd700;
            background: linear-gradient(135deg, #1a1a1a, #2d2410);
        }
        body:not(.dark) .vip-card.platinum {
            background: linear-gradient(135deg, #fffef0, #fff7e0);
        }
        .vip-card.gold {
            border-color: #ffaa00;
        }
        .vip-card.silver {
            border-color: #a0a0a0;
        }
        .offer-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: #ef4444;
            color: white;
            padding: 4px 10px;
            border-radius: 14px;
            font-size: 0.7rem;
            font-weight: 800;
        }
        .offer-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            display: flex;
            gap: 12px;
            padding: 12px;
            margin-bottom: 10px;
            align-items: center;
            position: relative;
        }
        .old-price {
            text-decoration: line-through;
            color: #9ca3af;
            font-size: 0.75rem;
            margin-right: 6px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-sub);
        }
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--input-bg);
            font-size: 0.9rem;
            color: var(--text-main);
            outline: none;
        }
        .form-group input:focus {
            border-color: var(--orange);
        }
        .image-preview-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            cursor: pointer;
        }
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .info-box {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
        }
        .info-box label {
            font-weight: 600;
            color: var(--text-sub);
            margin-left: 8px;
        }
        .info-box div {
            color: var(--text-main);
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .quick-pts-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.85rem;
            color: white;
            transition: opacity 0.2s;
        }
        .quick-pts-btn:active {
            opacity: 0.8;
        }
        .quick-pts-btn.add {
            background: var(--orange);
        }
        .quick-pts-btn.sub {
            background: #ef4444;
        }
    </style>
</head>
<body>
    <div id="app" class="app-container"></div>
    <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden-file-input">
    <input type="file" id="galleryInput" accept="image/*" class="hidden-file-input">
    <button class="floating-ai-btn" onclick="if(window.openChatFullscreen)window.openChatFullscreen()" title="المساعد الذكي VICKS AI">
        <i class="fas fa-robot"></i>
    </button>

    <script>
        (function() {
            // ==================== تهيئة Firebase ====================
            const firebaseConfig = {
                apiKey: "AIzaSyXXXXXXXXXXXXXXXXXXXXXXXXXX",
                authDomain: "vicks-market.firebaseapp.com",
                projectId: "vicks-market",
                storageBucket: "vicks-market.appspot.com",
                messagingSenderId: "000000000000",
                appId: "1:000000000000:web:xxxxxxxxxxxxxxxxxxxx"
            };

            let firebaseInitialized = false;
            let auth = null;
            let db = null;

            try {
                firebase.initializeApp(firebaseConfig);
                auth = firebase.auth();
                db = firebase.firestore();
                firebaseInitialized = true;
                console.log('✅ Firebase initialized successfully');
            } catch (e) {
                console.warn('⚠️ Firebase config placeholder detected. Social login will show a demo message.', e.message);
            }

            // ==================== مفاتيح التخزين ====================
            const STORAGE_KEY = 'vicks_final_v4';
            const THEME_KEY = 'vicks_theme_v4';
            const GUEST_LIKES_KEY = 'vicks_guest_likes_v4';
            const CONTACT_KEY = 'vicks_contact_method_v4';

            function getGuestLikes() { try { return JSON.parse(localStorage.getItem(GUEST_LIKES_KEY) ||
            '[]'); } catch { return []; } }

            function isGuestLiked(pid) { return getGuestLikes().includes(pid); }

            function toggleGuestLike(pid) { const likes = getGuestLikes(); const idx = likes.indexOf(pid); if (idx >=
                    0) likes.splice(idx, 1); else likes.push(pid); localStorage.setItem(GUEST_LIKES_KEY, JSON.stringify(
                    likes)); return idx < 0; }

            function getContactMethod() { return localStorage.getItem(CONTACT_KEY) || 'whatsapp'; }

            function setContactMethod(m) { localStorage.setItem(CONTACT_KEY, m); }

            // ==================== دالة حفظ المستخدم في Firestore ====================
            function saveUserToFirestore(userData) {
                if (!firebaseInitialized || !db) {
                    console.log('📦 Firestore غير مهيأ – تم الحفظ محلياً فقط.');
                    return Promise.resolve();
                }
                return db.collection('users').doc(userData.id).set({
                    id: userData.id,

            // ==================== دوال المصادقة عبر Firebase ====================
            function signInWithGoogle(isSignUp = false) {
                if (!firebaseInitialized || !auth) {
                    showToast('⚠️ Firebase غير مهيأ. الرجاء إعداد المشروع أولاً.');
                    return;
                }
                const provider = new firebase.auth.GoogleAuthProvider();
                provider.setCustomParameters({ prompt: 'select_account' });
                auth.signInWithPopup(provider).then(result => {
                    const user = result.user;
                    const displayName = user.displayName || 'مستخدم';
                    const email = user.email || '';
                    const photoURL = user.photoURL || '';
                    if (isSignUp) {
                        handleSocialSignUp(user.uid, email, displayName, photoURL, 'google');
                    } else {
                        handleSocialSignIn(user.uid, email, displayName, photoURL, 'google');
                    }
                }).catch(err => {
                    console.error('Google sign-in error:', err);
                    if (err.code === 'auth/popup-closed-by-user') {
                        showToast('تم إغلاق نافذة تسجيل الدخول.');
                    } else if (err.code === 'auth/configuration-not-found') {
                        showToast('⚠️ Google Sign-In غير مفعل في Firebase. راجع الإعدادات.');
                    } else {
                        showToast('❌ فشل تسجيل الدخول: ' + err.message);
                    }
                });
            }

            function signInWithFacebook(isSignUp = false) {
                if (!firebaseInitialized || !auth) {
                    showToast('⚠️ Firebase غير مهيأ. الرجاء إعداد المشروع أولاً.');
                    return;
                }
                const provider = new firebase.auth.FacebookAuthProvider();
                provider.setCustomParameters({ display: 'popup' });
                auth.signInWithPopup(provider).then(result => {
                    const user = result.user;
                    const displayName = user.displayName || 'مستخدم';
                    const email = user.email || '';
                    const photoURL = user.photoURL || '';
                    if (isSignUp) {
                        handleSocialSignUp(user.uid, email, displayName, photoURL, 'facebook');
                    } else {
                        handleSocialSignIn(user.uid, email, displayName, photoURL, 'facebook');
                    }
                }).catch(err => {
                    console.error('Facebook sign-in error:', err);
                    if (err.code === 'auth/popup-closed-by-user') {
                        showToast('تم إغلاق نافذة تسجيل الدخول.');
                    } else if (err.code === 'auth/configuration-not-found') {
                        showToast('⚠️ Facebook Sign-In غير مفعل في Firebase. راجع الإعدادات.');
                    } else if (err.code === 'auth/account-exists-with-different-credential') {
                        showToast('⚠️ يوجد حساب مسجل مسبقاً بنفس البريد الإلكتروني.');
                    } else {
                        showToast('❌ فشل تسجيل الدخول: ' + err.message);
                    }
                });
            }

            function handleSocialSignUp(uid, email, displayName, photoURL, provider) {
                const existingId = Object.keys(state.sellers).find(
                    sid => state.sellers[sid].email === email && state.sellers[sid].id !== 'admin1'
                );
                if (existingId) {
                    state.currentSellerId = existingId;
                    saveState(state);
                    showToast('مرحباً بعودتك ' + displayName + '!');
                    navigate('home');
                    return;
                }
                const sellerId = 's' + uid.replace(/[^a-zA-Z0-9]/g, '').slice(0, 10);
                state.sellers[sellerId] = {
                    id: sellerId,
                    email: email,
                    password: '',
                    storeName: displayName,
                    ownerName: displayName,
                    phone: '',
                    country: 'مصر',
                    avatar: photoURL || '👤',
                    photoURL: photoURL || '',
                    provider: provider,
                    points: 0,
                    verified: true,
                    subscription: 'free',
                    verificationBadge: true,
                    accountType: 'seller',
                    maxProducts: 10
                };
                state.currentSellerId = sellerId;
                saveState(state);
                saveUserToFirestore(state.sellers[sellerId]);
                showToast('🎉 تم إنشاء الحساب بنجاح! مرحباً ' + displayName);
                navigate('home');
            }

            function handleSocialSignIn(uid, email, displayName, photoURL, provider) {
                let existingSellerId = null;
                for (const sid in state.sellers) {
                    if (state.sellers[sid].email === email && sid !== 'admin1') {
                        existingSellerId = sid;
                        break;
                    }
                }
                if (existingSellerId) {
                    state.currentSellerId = existingSellerId;
                    if (photoURL && !state.sellers[existingSellerId].photoURL) {
                        state.sellers[existingSellerId].photoURL = photoURL;
                        state.sellers[existingSellerId].avatar = photoURL;
                    }
                    saveState(state);
                    showToast('مرحباً بعودتك ' + displayName + '!');
                    navigate('home');
                } else {
                    handleSocialSignUp(uid, email, displayName, photoURL, provider);
                }
            }
