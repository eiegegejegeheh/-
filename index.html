<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>VICKS MARKET | منصة تجارة عالمية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --orange: #ff6600;
            --orange-light: #fff7ed;
            --bg-light: #f9fafb;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-sub: #6b7280;
            --border: #e5e7eb;
            --input-bg: #f3f4f6;
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        body.dark {
            --bg-light: #0a0a0a;
            --card-bg: #121212;
            --text-main: #ffffff;
            --text-sub: #cccccc;
            --border: #2a2a2a;
            --orange-light: #1a1006;
            --input-bg: #1e1e1e;
            --shadow: 0 2px 8px rgba(255, 255, 255, 0.04);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-light);
            color: var(--text-main);
            max-width: 100vw;
            overflow-x: hidden;
            transition: background 0.3s, color 0.3s;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 100vw;
            overflow-x: hidden;
        }

        .header {
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 30;
            gap: 8px;
            box-shadow: var(--shadow);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .logo-text {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--orange);
            white-space: nowrap;
        }

        .content-scroll {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding-bottom: 20px;
            -webkit-overflow-scrolling: touch;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            padding: 8px;
        }

        .product-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 8px;
        }

        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            overflow: hidden;
            cursor: pointer;
            transition: box-shadow 0.2s, transform 0.15s;
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow);
        }

        .product-card:active {
            transform: scale(0.98);
        }

        .product-card.list-view {
            flex-direction: row;
            gap: 12px;
            padding: 10px;
            align-items: stretch;
        }

        .product-image {
            background: #f3f4f6;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            cursor: pointer;
            transition: background 0.2s;
            position: relative;
            overflow: hidden;
        }

        body.dark .product-image {
            background: #1a1a1a;
        }

        .grid-card .product-image {
            height: 150px;
            font-size: 4.5rem;
            border-radius: 0;
        }

        .list-card .product-image {
            width: 85px;
            height: 85px;
            font-size: 2.8rem;
            border-radius: 12px;
        }

        .card-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 8px 10px 10px;
            gap: 6px;
            min-width: 0;
        }

        .list-view .card-body {
            padding: 0;
            gap: 4px;
        }

        .product-name {
            font-weight: 700;
            font-size: 0.82rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: center;
            color: var(--text-main);
            line-height: 1.3;
        }

        .list-view .product-name {
            text-align: right;
            font-size: 0.85rem;
        }

        .stars {
            display: flex;
            gap: 2px;
            flex-shrink: 0;
            direction: ltr;
            justify-content: center;
        }

        .list-view .stars {
            justify-content: flex-start;
        }

        .stars i {
            font-size: 11px;
            cursor: pointer;
            transition: color 0.15s;
        }

        .seller-info {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            max-width: 95px;
            overflow: hidden;
            flex-shrink: 0;
            font-size: 0.68rem;
            color: var(--text-sub);
        }

        .seller-avatar {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.65rem;
            flex-shrink: 0;
        }

        .seller-name-text {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-weight: 500;
        }

        .bottom-row {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
            gap: 6px;
            flex-wrap: wrap;
            max-width: 100%;
        }

        .action-btns {
            display: flex;
            gap: 7px;
            flex-shrink: 0;
            flex-wrap: wrap;
            order: -1;
        }

        .action-btn {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
            position: relative;
            flex-shrink: 0;
        }

        .action-btn:active {
            transform: scale(0.9);
        }

        .price {
            font-weight: 800;
            color: var(--orange);
            font-size: 0.9rem;
            white-space: nowrap;
            flex-shrink: 0;
            order: 1;
            text-align: left;
        }

        .search-overlay {
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            padding: 10px 14px;
            animation: slideDown 0.25s ease;
            flex-shrink: 0;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .search-wrapper {
            display: flex;
            align-items: center;
            background: var(--input-bg);
            border-radius: 24px;
            padding: 0 12px;
            gap: 8px;
            border: 1px solid var(--border);
        }

        .search-wrapper input {
            flex: 1;
            border: none;
            background: transparent;
            padding: 10px 4px;
            outline: none;
            font-size: 0.85rem;
            color: var(--text-main);
            min-width: 0;
        }

        .search-icon-btn {
            background: none;
            border: none;
            color: var(--text-sub);
            cursor: pointer;
            font-size: 1rem;
            padding: 6px;
            border-radius: 50%;
            transition: background 0.2s;
            flex-shrink: 0;
        }

        .icon-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--input-bg);
            color: var(--text-sub);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            transition: background 0.2s;
            flex-shrink: 0;
        }

        .icon-btn:hover { background: #e5e7eb; }
        body.dark .icon-btn:hover { background: #333; }

        .btn-primary {
            background: var(--orange);
            color: white;
            border: none;
            border-radius: 14px;
            padding: 12px 24px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9rem;
            width: 100%;
            transition: background 0.2s;
        }

        .btn-primary:hover { background: #e55d00; }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 12px;
            border-radius: 14px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid var(--border);
            background: var(--card-bg);
            color: var(--text-main);
            font-size: 0.85rem;
            transition: background 0.2s;
            margin-bottom: 8px;
        }

        .social-btn.google { border-color: #ea4335; color: #ea4335; }
        .social-btn.facebook { border-color: #1877f2; color: #1877f2; }
        .social-btn.email-signup { border-color: var(--orange); color: var(--orange); }
        .social-btn:hover { background: var(--input-bg); }

        .category-btn {
            padding: 7px 15px;
            border-radius: 20px;
            border: 1px solid var(--border);
            cursor: pointer;
            white-space: nowrap;
            font-size: 0.78rem;
            flex-shrink: 0;
            background: var(--card-bg);
            color: var(--text-sub);
            transition: all 0.2s;
            font-weight: 500;
        }

        .category-btn.active {
            background: var(--orange) !important;
            color: white !important;
            border-color: var(--orange) !important;
            font-weight: 700;
        }

        .comments-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            z-index: 90;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .comments-panel {
            background: var(--card-bg);
            border-radius: 18px 18px 0 0;
            width: 100%;
            max-height: 35vh;
            display: flex;
            flex-direction: column;
            animation: slideUp 0.3s ease;
            overflow: hidden;
        }

        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        .comments-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .comments-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 22vh;
        }

        .comment-bubble {
            background: var(--input-bg);
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 0.8rem;
            line-height: 1.4;
            color: var(--text-main);
            max-width: 90%;
            align-self: flex-start;
            border: 1px solid var(--border);
        }

        .comment-input-row {
            display: flex;
            gap: 8px;
            padding: 10px 16px;
            border-top: 1px solid var(--border);
            flex-shrink: 0;
            align-items: center;
        }

        .comment-input-row input {
            flex: 1;
            padding: 10px 14px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: var(--input-bg);
            outline: none;
            font-size: 0.8rem;
            color: var(--text-main);
            min-width: 0;
        }

        .send-comment-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--orange);
            color: white;
            border: none;
            cursor: pointer;
            flex-shrink: 0;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .toast {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: #1f2937;
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 0.8rem;
            z-index: 200;
            animation: toastIn 0.3s ease, toastOut 0.3s ease 1.8s forwards;
            pointer-events: none;
            white-space: nowrap;
        }

        @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
        @keyframes toastOut { from { opacity: 1; } to { opacity: 0; transform: translateX(-50%) translateY(-10px); } }

        .hidden-file-input { position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none; }

        .chat-fullscreen {
            position: fixed;
            inset: 0;
            z-index: 80;
            background: var(--bg-light);
            display: flex;
            flex-direction: column;
            animation: fadeIn 0.2s ease;
        }

        .chat-fullscreen .chat-header-bar {
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: var(--orange);
            color: white;
            font-weight: bold;
            font-size: 1rem;
        }

        .chat-fullscreen .chat-messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .chat-fullscreen .chat-input-bar {
            flex-shrink: 0;
            display: flex;
            gap: 8px;
            padding: 10px 16px;
            border-top: 1px solid var(--border);
            background: var(--card-bg);
            align-items: center;
        }

        .chat-fullscreen .chat-input-bar input {
            flex: 1;
            padding: 10px 14px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: var(--input-bg);
            outline: none;
            font-size: 0.85rem;
            color: var(--text-main);
            min-width: 0;
        }

        .msg-user {
            background: var(--orange);
            color: white;
            padding: 10px 14px;
            border-radius: 16px 16px 4px 16px;
            max-width: 80%;
            align-self: flex-end;
            font-size: 0.82rem;
            line-height: 1.4;
        }

        .msg-bot {
            background: var(--input-bg);
            padding: 10px 14px;
            border-radius: 16px 16px 16px 4px;
            max-width: 80%;
            align-self: flex-start;
            font-size: 0.82rem;
            line-height: 1.4;
            color: var(--text-main);
            border: 1px solid var(--border);
        }

        .floating-ai-btn {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--orange);
            color: white;
            border: none;
            cursor: pointer;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            box-shadow: 0 6px 20px rgba(255, 102, 0, 0.5);
            transition: transform 0.2s, box-shadow 0.2s;
            animation: pulse-orange 2s infinite;
        }

        .floating-ai-btn:active { transform: scale(0.9); box-shadow: 0 3px 10px rgba(255, 102, 0, 0.4); }

        @keyframes pulse-orange {
            0% { box-shadow: 0 0 0 0 rgba(255, 102, 0, 0.7); }
            70% { box-shadow: 0 0 0 14px rgba(255, 102, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 102, 0, 0); }
        }

        .separator-text {
            text-align: center;
            color: var(--text-sub);
            font-size: 0.78rem;
            font-weight: 400;
            margin: 12px 0 8px;
            opacity: 0.8;
        }

        .vip-card { background: var(--card-bg); border: 2px solid var(--border); border-radius: 20px; padding: 20px; text-align: center; margin-bottom: 12px; }
        .vip-card.platinum { border-color: #ffd700; background: linear-gradient(135deg, #1a1a1a, #2d2410); }
        body:not(.dark) .vip-card.platinum { background: linear-gradient(135deg, #fffef0, #fff7e0); }
        .vip-card.gold { border-color: #ffaa00; }
        .vip-card.silver { border-color: #a0a0a0; }
        .offer-badge { position: absolute; top: 12px; left: 12px; background: #ef4444; color: white; padding: 4px 10px; border-radius: 14px; font-size: 0.7rem; font-weight: 800; }
        .offer-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; display: flex; gap: 12px; padding: 12px; margin-bottom: 10px; align-items: center; position: relative; }
        .old-price { text-decoration: line-through; color: #9ca3af; font-size: 0.75rem; margin-right: 6px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 6px; color: var(--text-sub); }
        .form-group input, .form-group select { width: 100%; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--input-bg); font-size: 0.9rem; color: var(--text-main); outline: none; }
        .form-group input:focus { border-color: var(--orange); }
    </style>
</head>
<body>
    <div id="app" class="app-container"></div>
    <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden-file-input">
    <input type="file" id="galleryInput" accept="image/*" class="hidden-file-input">
    <button class="floating-ai-btn" onclick="if(window.openChatFullscreen)window.openChatFullscreen()" title="المساعد الذكي VICKS AI">
        <i class="fas fa-robot"></i>
    </button>

    <script>
        (function() {
            const STORAGE_KEY = 'vicks_final_v4';
            const THEME_KEY = 'vicks_theme_v4';
            const GUEST_LIKES_KEY = 'vicks_guest_likes_v4';
            const CONTACT_KEY = 'vicks_contact_method_v4';

            function getGuestLikes() { try { return JSON.parse(localStorage.getItem(GUEST_LIKES_KEY) || '[]'); } catch { return []; } }
            function isGuestLiked(pid) { return getGuestLikes().includes(pid); }
            function toggleGuestLike(pid) { const likes = getGuestLikes(); const idx = likes.indexOf(pid); if (idx >= 0) likes.splice(idx, 1); else likes.push(pid); localStorage.setItem(GUEST_LIKES_KEY, JSON.stringify(likes)); return idx < 0; }
            function getContactMethod() { return localStorage.getItem(CONTACT_KEY) || 'whatsapp'; }
            function setContactMethod(m) { localStorage.setItem(CONTACT_KEY, m); }

            function createInitialData() {
                const sellers = {
                    admin: { id: 'admin1', email: 'admin@vicks.com', password: 'admin123', storeName: 'VICKS MARKET', ownerName: 'محمد المالك', phone: '01113694362', points: 50000, verified: true, subscription: 'platinum', country: 'مصر', avatar: '👑', verificationBadge: true, accountType: 'seller', maxProducts: Infinity },
                    s1: { id: 's1', email: 'seller1@test.com', password: '123456', storeName: 'متجر النور', ownerName: 'أحمد', phone: '01012345678', points: 350, verified: true, subscription: 'silver', country: 'مصر', avatar: '🌟', verificationBadge: true, accountType: 'seller', maxProducts: Infinity },
                    s2: { id: 's2', email: 'seller2@test.com', password: '123456', storeName: 'سوبر ماركت الفرح', ownerName: 'فاطمة', phone: '01198765432', points: 120, verified: false, subscription: 'free', country: 'السعودية', avatar: '🛒', verificationBadge: false, accountType: 'seller', maxProducts: 10 },
                    cust1: { id: 'cust1', email: 'customer@test.com', password: '123456', storeName: '', ownerName: 'عميل عادي', phone: '01000000000', points: 50, verified: false, subscription: 'free', country: 'مصر', avatar: '👤', verificationBadge: false, accountType: 'customer' }
                };
                const products = {};
                const names = ['ايفون 14 Pro', 'زيت زيتون', 'شاشة سامسونج', 'بلاي ستيشن 5', 'لاب توب ديل', 'عطر فاخر', 'ساعة ذكية', 'سماعة لاسلكية', 'طقم مطبخ', 'لعبة فيفا', 'سوار ذهبي', 'كاميرا مراقبة'];
                const emojis = ['📱', '🫒', '📺', '🎮', '💻', '🧴', '⌚', '🎧', '🍳', '⚽', '💎', '📷'];
                const cats = ['electronics', 'fashion', 'home', 'smart', 'games', 'accessories'];
                for (let i = 1; i <= 14; i++) {
                    const sid = i % 2 === 0 ? 's2' : 's1';
                    products['p' + i] = {
                        id: 'p' + i,
                        name: names[(i - 1) % 12] + (i > 10 ? ' ' + i : ''),
                        price: 80 + i * 50,
                        category: cats[(i - 1) % 6],
                        emoji: emojis[(i - 1) % 12],
                        sellerId: sid,
                        sellerName: sid === 's1' ? 'متجر النور' : 'سوبر ماركت الفرح',
                        likes: (i * 7) % 19,
                        likedBy: [],
                        comments: ['جيد جداً 👍', 'ممتاز وسرعة في التوصيل', 'سعر مناسب وجودة عالية'].slice(0, (i % 3) + 1),
                        rating: i % 5
                    };
                }
                return { sellers, products, currentSellerId: null, chatMessages: [{ id: '1', role: 'bot', text: 'أهلاً بك في VICKS MARKET! كيف أقدر أساعدك؟', ts: Date.now() }] };
            }

            function loadState() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (raw) { const st = JSON.parse(raw); if (!st.chatMessages) st.chatMessages = [{ id: '1', role: 'bot', text: 'أهلاً بك في VICKS MARKET!', ts: Date.now() }]; return st; }
                    return createInitialData();
                } catch { return createInitialData(); }
            }

            function saveState(st) { localStorage.setItem(STORAGE_KEY, JSON.stringify(st)); }
            let state = loadState();
            let currentPage = 'home';
            let viewMode = 'grid';
            let activeCategory = 'all';
            let searchQuery = '';
            let showSearch = false;
            let showChatFullscreen = false;
            let commentsProduct = null;
            let previewProduct = null;
            const appEl = document.getElementById('app');

            function showToast(msg) {
                const existing = document.querySelector('.toast');
                if (existing) existing.remove();
                const toast = document.createElement('div');
                toast.className = 'toast';
                toast.textContent = msg;
                document.body.appendChild(toast);
                setTimeout(() => toast.remove(), 2200);
            }

            function render() {
                appEl.innerHTML = '';
                if (showChatFullscreen) { appEl.appendChild(buildChatFullscreen()); return; }
                if (currentPage === 'login') { appEl.appendChild(buildLoginPage()); return; }
                if (currentPage === 'join') { appEl.appendChild(buildJoinPage()); return; }
                if (currentPage === 'vip') { appEl.appendChild(buildVIPPage()); return; }
                if (currentPage === 'offers') { appEl.appendChild(buildOffersPage()); return; }

            function registerSeller() {
                const storeName = document.getElementById('joinStoreName')?.value.trim();
                const ownerName = document.getElementById('joinOwnerName')?.value.trim();
                const phone = document.getElementById('joinPhone')?.value.trim();
                const country = document.getElementById('joinCountry')?.value;
                const email = document.getElementById('joinEmail')?.value.trim();
                const password = document.getElementById('joinPassword')?.value.trim();
                if (!storeName || !ownerName || !phone || !email || !password) return showToast('يرجى ملء جميع الحقول المطلوبة');
                const id = 's' + Date.now();
                state.sellers[id] = { id, email, password, storeName, ownerName, phone, country, points: 0, verified: false, subscription: 'free', avatar: '👤', verificationBadge: false, accountType: 'seller', maxProducts: 10 };
                state.currentSellerId = id;
                saveState(state);
                showToast('تم إنشاء حساب التاجر بنجاح!');
                navigate('home');
            }

            function createProductCard(prod) {
                const seller = state.sellers[prod.sellerId] || {};
                const isLoggedIn = !!state.currentSellerId;
                const liked = isLoggedIn ? prod.likedBy.includes(state.currentSellerId) : isGuestLiked(prod.id);
                const shortName = (seller.storeName || 'متجر').length > 10 ? (seller.storeName || 'متجر').slice(0, 8) + '..' : (seller.storeName || 'متجر');
                const contactMethod = getContactMethod();
                const contactIconClass = contactMethod === 'telegram' ? 'fa-telegram-plane' : 'fa-whatsapp';
                const contactBtnBg = contactMethod === 'telegram' ? '#e0f4ff' : '#dcfce7';
                const contactBtnColor = contactMethod === 'telegram' ? '#0088cc' : '#16a34a';
                const card = document.createElement('div');
                card.className = `product-card ${viewMode === 'list' ? 'list-view' : 'grid-card'}`;
                const imgDiv = document.createElement('div');
                imgDiv.className = 'product-image';
                imgDiv.textContent = prod.emoji;
                imgDiv.onclick = (e) => { e.stopPropagation(); previewProduct = prod; render(); };
                card.appendChild(imgDiv);
                const cardBody = document.createElement('div');
                cardBody.className = 'card-body';
                const nameEl = document.createElement('div');
                nameEl.className = 'product-name';
                nameEl.textContent = prod.name;
                cardBody.appendChild(nameEl);
                const starsDiv = document.createElement('div');
                starsDiv.className = 'stars';
                for (let i = 0; i < 5; i++) {
                    const star = document.createElement('i');
                    star.className = `fas fa-star ${i < prod.rating ? 'text-yellow-400' : 'text-gray-300'}`;
                    star.onclick = (e) => { e.stopPropagation(); prod.rating = i + 1; saveState(state); render(); };
                    starsDiv.appendChild(star);
                }
                cardBody.appendChild(starsDiv);
                const sellerDiv = document.createElement('div');
                sellerDiv.className = 'seller-info';
                sellerDiv.innerHTML = `<span class="seller-avatar">${seller.avatar||'🏪'}</span><span class="seller-name-text">${shortName}</span>${seller.verificationBadge ? '<i class="fas fa-check-circle" style="color:#3b82f6;font-size:9px;"></i>' : ''}`;
                sellerDiv.onclick = (e) => { e.stopPropagation(); showToast(`ملف التاجر: ${seller.storeName||'مستخدم'}`); };
                cardBody.appendChild(sellerDiv);
                const bottomRow = document.createElement('div');
                bottomRow.className = 'bottom-row';
                const actions = document.createElement('div');
                actions.className = 'action-btns';
                const contactBtn = document.createElement('button');
                contactBtn.className = 'action-btn';
                contactBtn.style.cssText = `background:${contactBtnBg};color:${contactBtnColor};`;
                contactBtn.innerHTML = `<i class="fab ${contactIconClass}"></i>`;
                contactBtn.onclick = (e) => { e.stopPropagation(); const phone = seller.phone || '01113694362'; const msg = encodeURIComponent(`مرحباً، أنا مهتم بمنتج: ${prod.name}`); window.open(getContactMethod() === 'telegram' ? `https://t.me/+2${phone}?text=${msg}` : `https://wa.me/+2${phone}?text=${msg}`, '_blank'); };
                actions.appendChild(contactBtn);
                const commBtn = document.createElement('button');
                commBtn.className = 'action-btn';
                commBtn.style.cssText = 'background:#dbeafe;color:#2563eb;';
                commBtn.innerHTML = '<i class="fas fa-comment"></i>';
                commBtn.onclick = (e) => { e.stopPropagation(); commentsProduct = prod; render(); };
                actions.appendChild(commBtn);
                const likeBtn = document.createElement('button');
                likeBtn.className = 'action-btn';
                likeBtn.style.cssText = `background:${liked ? '#ff6600' : '#f3f4f6'};color:${liked ? 'white' : '#6b7280'};`;
                likeBtn.innerHTML = '<i class="fas fa-heart"></i>';
                likeBtn.onclick = (e) => { e.stopPropagation(); if (isLoggedIn) { const idx = prod.likedBy.indexOf(state.currentSellerId); if (idx >= 0) { prod.likedBy.splice(idx, 1); prod.likes = Math.max(0, prod.likes - 1); } else { prod.likedBy.push(state.currentSellerId); prod.likes++; } } else { const nowLiked = toggleGuestLike(prod.id); if (nowLiked) prod.likes++; else prod.likes = Math.max(0, prod.likes - 1); } saveState(state); render(); };
                actions.appendChild(likeBtn);
                bottomRow.appendChild(actions);
                const priceEl = document.createElement('span');
                priceEl.className = 'price';
                priceEl.textContent = prod.price.toLocaleString() + ' ج.م';
                bottomRow.appendChild(priceEl);
                cardBody.appendChild(bottomRow);
                card.appendChild(cardBody);
                return card;
            }

                if (!commentsProduct) return;
                const input = document.getElementById('commentInputField');
                if (input && input.value.trim()) { commentsProduct.comments.push(input.value.trim()); saveState(state); input.value = ''; render(); }
            };
            window.sendFullChat = () => {
                const input = document.getElementById('fullChatInput');
                if (!input || !input.value.trim()) return;
                state.chatMessages.push({ id: 'm'+Date.now(), role: 'user', text: input.value.trim(), ts: Date.now() });
                input.value = '';
                setTimeout(() => { state.chatMessages.push({ id: 'm'+Date.now(), role: 'bot', text: 'شكراً لتواصلك، سأقوم بمساعدتك قريباً.', ts: Date.now() }); saveState(state); render(); }, 800);
                saveState(state); render();
            };
            window.toggleTheme = () => { document.body.classList.toggle('dark'); localStorage.setItem(THEME_KEY, document.body.classList.contains('dark') ? 'dark' : 'light'); };
            window.openCamera = () => document.getElementById('cameraInput').click();
            window.openGallery = () => document.getElementById('galleryInput').click();
            window.switchContact = () => { const newMethod = getContactMethod() === 'whatsapp' ? 'telegram' : 'whatsapp'; setContactMethod(newMethod); showToast('تم التبديل إلى ' + (newMethod === 'telegram' ? 'تليجرام' : 'واتساب')); render(); };
            window.logout = () => { state.currentSellerId = null; saveState(state); showToast('تم تسجيل الخروج'); navigate('home'); };

            if (localStorage.getItem(THEME_KEY) === 'dark') document.body.classList.add('dark');
            render();
        })();
    </script>
</body>
</html>
