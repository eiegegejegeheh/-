<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>VICKS MARKET | سوق الكتروني متكامل</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
    <style>
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .chat-watermark { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 3rem; font-weight: bold; color: rgba(0,0,0,0.06); white-space: nowrap; pointer-events: none; z-index: 5; user-select: none; }
        .logo-frame { border: 2px solid #f97316; border-radius: 24px; padding: 6px 14px; background-color: white; display: inline-flex; align-items: center; gap: 8px; }
        body.dark { background-color: #0f172a; }
        body.dark .bg-white { background-color: #1e293b; }
        body.dark .bg-gray-50 { background-color: #0f172a; }
        body.dark .bg-gray-100 { background-color: #1e293b; }
        body.dark .text-gray-800 { color: #f1f5f9; }
        body.dark .text-gray-600 { color: #cbd5e1; }
        body.dark .text-gray-500 { color: #94a3b8; }
        body.dark .border-gray-100 { border-color: #334155; }
        body.dark .logo-frame { background-color: #1e293b; border-color: #f97316; }
        body.dark .bg-indigo-50 { background-color: #2d2a5c; }
        body.dark .bg-green-50 { background-color: #1a3c2c; }
        body.dark .bg-blue-50 { background-color: #1a2c4c; }
        body.dark .bg-yellow-50 { background-color: #3d3510; }
        body.dark .bg-orange-50 { background-color: #3d2610; }
    </style>
</head>
<body class="bg-gray-50 font-sans antialiased">
    <div id="root"></div>

    <script type="text/babel" data-presets="react,typescript">
        // ==================== البيانات الأساسية (مع إضافة بلد) ====================
        const STORAGE_KEY = 'vicks_market_state';
        const THEME_KEY = 'vicks_theme';
        const LANG_KEY = 'vicks_lang';
        const COUNTRY_KEY = 'vicks_country';
        const ADMIN_EMAIL = 'mom1113694362@gmail.com';
        const ADMIN_PASS = 'momMOM2023#';
        const ADMIN_ID = '10000000000';
        function generateId() { return Math.random().toString(36).slice(2) + Date.now().toString(36); }

        // نمونه بيانات
        const SAMPLE_SELLERS = {
            admin: { id: ADMIN_ID, email: ADMIN_EMAIL, password: ADMIN_PASS, storeName: 'VICKS MARKET', ownerName: 'Mohamed', phone: '01113694362', district: 'موغورة 6', points: 50000, verified: true, subscription: 'platinum', products: [], createdAt: Date.now(), country: 'مصر', isAdmin: true },
            s1: { id: 's1', email: 'seller1@test.com', password: '123456', storeName: 'متجر النور', ownerName: 'أحمد علي', phone: '01012345678', district: 'المتميز', points: 350, verified: true, subscription: 'silver', products: ['p1','p3','p5'], createdAt: Date.now() - 86400000 * 10, country: 'مصر' },
            s2: { id: 's2', email: 'seller2@test.com', password: '123456', storeName: 'سوبر ماركت الفرح', ownerName: 'فاطمة حسن', phone: '01198765432', district: 'الأحياء 1', points: 120, verified: false, subscription: 'free', products: ['p2','p4','p6'], createdAt: Date.now() - 86400000 * 5, country: 'السعودية' },
        };
        const SAMPLE_PRODUCTS = {
            p1: { id: 'p1', name: 'ايفون 14 Pro مستعمل', price: 18000, category: 'used', emoji: '📱', sellerId: 's1', sellerName: 'متجر النور', sellerCountry: 'مصر', likes: 8, likedBy: [], description: 'بطارية 92%', createdAt: Date.now() - 86400000 * 2, vip: true, comments: [], rating: 0 },
            p2: { id: 'p2', name: 'زيت زيتون بكر 1 لتر', price: 185, category: 'screens', emoji: '🫒', sellerId: 's2', sellerName: 'سوبر ماركت الفرح', sellerCountry: 'السعودية', likes: 5, likedBy: [], description: 'زيت طبيعي', createdAt: Date.now() - 86400000, vip: false, comments: [], rating: 0 },
            p3: { id: 'p3', name: 'شاشة سامسونج 55 بوصة', price: 4500, category: 'used', emoji: '📺', sellerId: 's1', sellerName: 'متجر النور', sellerCountry: 'مصر', likes: 12, likedBy: [], description: 'شاشة ممتازة', createdAt: Date.now() - 86400000 * 3, vip: true, comments: [], rating: 0 },
            p4: { id: 'p4', name: 'تمر عجوة السوبر', price: 45, category: 'screens', emoji: '🥮', sellerId: 's2', sellerName: 'سوبر ماركت الفرح', sellerCountry: 'السعودية', likes: 9, likedBy: [], description: 'تمر فاخر', createdAt: Date.now() - 86400000 * 1, vip: false, comments: [], rating: 0 },
            p5: { id: 'p5', name: 'لاب توب ديل Inspiron', price: 12000, category: 'used', emoji: '💻', sellerId: 's1', sellerName: 'متجر النور', sellerCountry: 'مصر', likes: 7, likedBy: [], description: 'Core i7', createdAt: Date.now() - 86400000 * 6, vip: true, comments: [], rating: 0 },
            p6: { id: 'p6', name: 'عطر عود الملكي', price: 320, category: 'new', emoji: '🧴', sellerId: 's2', sellerName: 'سوبر ماركت الفرح', sellerCountry: 'السعودية', likes: 15, likedBy: [], description: 'عطر خشبي', createdAt: Date.now() - 86400000 * 2, vip: false, comments: [], rating: 0 },
        };
        SAMPLE_SELLERS.admin.products = [];
        SAMPLE_SELLERS.s1.products = ['p1','p3','p5'];
        SAMPLE_SELLERS.s2.products = ['p2','p4','p6'];

        function getDefaultState() { return { sellers: JSON.parse(JSON.stringify(SAMPLE_SELLERS)), products: JSON.parse(JSON.stringify(SAMPLE_PRODUCTS)), currentSellerId: null, chatMessages: [{ id: '1', role: 'bot', text: 'أهلاً بك في VICKS MARKET! كيف أستطيع مساعدتك اليوم؟', ts: Date.now() - 1000 }], notifications: [] }; }
        function loadState() { try { const raw = localStorage.getItem(STORAGE_KEY); if (!raw) return getDefaultState(); const parsed = JSON.parse(raw); return parsed.sellers ? parsed : getDefaultState(); } catch { return getDefaultState(); } }
        function saveState(state) { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
        function isAdmin(seller) { return seller?.isAdmin === true; }
        function createSeller(data) { return { id: 's_' + generateId(), ...data, points: 0, verified: false, subscription: 'free', products: [], createdAt: Date.now(), isAdmin: false }; }
        function createProduct(data) { return { id: 'p_' + generateId(), ...data, likes: 0, likedBy: [], createdAt: Date.now(), vip: false, comments: [], rating: 0 }; }
        function addChatMessage(state, msg) { return { ...state, chatMessages: [...state.chatMessages, { ...msg, id: generateId(), ts: Date.now() }] }; }
        function getBotResponse(msg) {
            const m = msg.toLowerCase();
            if (m.includes('سعر')) return 'يمكنك الاطلاع على الأسعار من الصفحة الرئيسية. هل تبحث عن منتج معين؟';
            if (m.includes('بائع')) return 'للانضمام كبائع: اضغط "حسابي" ثم "انضم كتاجر جديد". مجاني!';
            if (m.includes('نقاط')) return 'يمكنك شراء النقاط من صفحة المتجر (حسابي ← المتجر والنقاط).';
            if (m.includes('مرحب') || m.includes('هلا')) return 'أهلاً بك! أنا مساعد VICKS MARKET. كيف أقدر أخدمك؟';
            return 'شكراً لتواصلك! يمكنني مساعدتك في البحث عن منتجات، التسجيل كبائع، أو أي استفسار آخر.';
        }

        const { useState, useEffect, useCallback, useRef } = React;

        // ==================== مكون بطاقة المنتج (اسم المتجر على سطرين) ====================
        const ProductCard = ({ product, isLiked, onLike, onWhatsApp, onClick, listMode, onComment, onRate, t }) => {
            const vipIcon = product.vip ? <i className="fas fa-crown text-yellow-500 text-sm ml-1"></i> : null;
            const ratingStars = (rating) => {
                let stars = [];
                for (let i = 1; i <= 5; i++) {
                    stars.push(<i key={i} className={`fas fa-star ${i <= rating ? 'text-yellow-400' : 'text-gray-300'} text-xs cursor-pointer`} onClick={(e) => { e.stopPropagation(); onRate(i); }}></i>);
                }
                return stars;
            };
            const sellerNameStyle = "text-xs text-gray-500 whitespace-normal break-words max-w-[90px] leading-tight";
            if (listMode) {
                return (
                    <div onClick={onClick} className="flex gap-4 p-3 bg-white rounded-xl border shadow-sm cursor-pointer hover:shadow-md transition">
                        <div className="w-20 h-20 bg-gray-50 rounded-lg flex justify-center items-center text-5xl relative">
                            {product.emoji}
                            {product.vip && <span className="absolute -top-2 -right-2 bg-yellow-400 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs"><i className="fas fa-crown"></i></span>}
                        </div>
                        <div className="flex-1">
                            <h3 className="font-semibold flex items-center gap-1">{vipIcon} {product.name}</h3>
                            <p className="text-blue-600 font-bold">{product.price.toLocaleString()} {t('currency')}</p>
                            <div className={sellerNameStyle} title={product.sellerName}>{product.sellerName}</div>
                            <div className="flex gap-1 mt-1">{ratingStars(product.rating)}</div>
                        </div>
                        <div className="flex flex-col gap-2 items-end">
                            <button onClick={(e) => { e.stopPropagation(); onLike(); }} className={`p-2 rounded-full w-9 h-9 flex items-center justify-center transition ${isLiked ? 'bg-orange-500 text-white' : 'bg-gray-100 text-gray-600 hover:bg-orange-100 hover:text-orange-500'}`}>
                                <i className={`fas fa-heart ${isLiked ? 'text-white' : ''}`}></i>
                            </button>
                            <button onClick={(e) => { e.stopPropagation(); onWhatsApp(); }} className="p-2 rounded-full bg-green-100 text-green-600 w-9 h-9 flex items-center justify-center hover:bg-orange-500 hover:text-white transition">
                                <i className="fab fa-whatsapp"></i>
                            </button>
                            <button onClick={(e) => { e.stopPropagation(); onComment(); }} className="p-2 rounded-full bg-blue-100 text-blue-600 w-9 h-9 flex items-center justify-center hover:bg-orange-500 hover:text-white transition">
                                <i className="fas fa-comment"></i>
                            </button>
                            {product.vip && <div className="text-xs bg-yellow-100 text-yellow-700 px-2 py-0.5 rounded-full">VIP</div>}
                        </div>
                    </div>
                );
            }
            return (
                <div onClick={onClick} className="bg-white rounded-xl border shadow-sm overflow-hidden cursor-pointer hover:shadow-md transition relative">
                    {product.vip && <span className="absolute top-2 right-2 bg-yellow-400 text-white rounded-full px-2 py-0.5 text-xs z-10"><i className="fas fa-crown"></i> VIP</span>}
                    <div className="aspect-square flex items-center justify-center bg-gray-50 text-7xl">{product.emoji}</div>
                    <div className="p-3">
                        <h3 className="font-semibold line-clamp-2 flex items-center gap-1">{vipIcon} {product.name}</h3>
                        <p className="text-blue-600 font-bold mt-1">{product.price.toLocaleString()} {t('currency')}</p>
                        <div className="flex justify-between items-start mt-2 pt-2 border-t gap-1">
                            <div className={sellerNameStyle}>{product.sellerName}</div>
                            <div className="flex gap-2 shrink-0">
                                <button onClick={(e) => { e.stopPropagation(); onLike(); }} className={`p-1.5 rounded-full transition ${isLiked ? 'bg-orange-500 text-white' : 'bg-gray-100 text-gray-600 hover:bg-orange-100 hover:text-orange-500'}`}>
                                    <i className={`fas fa-heart text-sm ${isLiked ? 'text-white' : ''}`}></i>
                                </button>
                                <button onClick={(e) => { e.stopPropagation(); onWhatsApp(); }} className="p-1.5 rounded-full bg-green-100 text-green-600 hover:bg-orange-500 hover:text-white transition">
                                    <i className="fab fa-whatsapp text-sm"></i>
                                </button>
                                <button onClick={(e) => { e.stopPropagation(); onComment(); }} className="p-1.5 rounded-full bg-blue-100 text-blue-600 hover:bg-orange-500 hover:text-white transition">
                                    <i className="fas fa-comment text-sm"></i>
                                </button>
                            </div>
                        </div>
                        <div className="flex gap-1 mt-2 justify-center">{ratingStars(product.rating)}</div>
                    </div>
                </div>
            );
        };

        // ==================== صفحة الرئيسية (مع فلتر البلد) ====================
        const HomePage = ({ products, currentSellerId, selectedCountry, onChangeCountry, onLike, onWhatsApp, onProductClick, onAccountBtn, onShowOffers, onShowVIPPage, imgSearchResults, onClearImgSearch, onComment, onRate, searchText, onSearchChange, showSearchBar, t }) => {
            const [category, setCategory] = useState('all');
            const [viewMode, setViewMode] = useState('grid');
            const categories = [
                { id: 'all', label: t('all'), icon: 'fa-grid' },
                { id: 'used', label: t('used'), icon: 'fa-tag' },
                { id: 'screens', label: t('supermarket'), icon: 'fa-store' },
                { id: 'new', label: t('beauty'), icon: 'fa-spa' }
            ];
            const filteredByCountry = React.useMemo(() => {
                let arr = Object.values(products);
                arr = arr.filter(p => p.sellerCountry === selectedCountry);
                if (category !== 'all') arr = arr.filter(p => p.category === category);
                return arr;
            }, [products, category, selectedCountry]);
            const display = imgSearchResults || filteredByCountry;
            const isImg = imgSearchResults !== null;
            const isLiked = (p) => currentSellerId ? p.likedBy.includes(currentSellerId) : false;
            return (
                <div className="flex flex-col h-full">
                    <div className="bg-white px-4 py-2 border-b flex justify-between items-center">
                        <span className="text-sm font-medium">{t('your_country')}</span>
                        <select value={selectedCountry} onChange={(e) => onChangeCountry(e.target.value)} className="bg-gray-100 rounded-lg p-2 text-sm">
                            <option value="مصر">مصر (EGP)</option>
                            <option value="السعودية">السعودية (SAR)</option>
                        </select>
                    </div>
                    {showSearchBar && (
                        <div className="bg-white px-4 pb-3 pt-2 border-b">
                            <div className="relative">
                                <i className="fas fa-search absolute right-3 top-3 text-gray-400"></i>
                                <input type="text" placeholder={t('search_placeholder')} className="w-full p-3 pr-10 bg-gray-100 rounded-xl focus:ring-2 focus:ring-orange-300 outline-none" value={searchText} onChange={(e) => onSearchChange(e.target.value)} autoFocus />
                                {searchText && <button onClick={() => onSearchChange('')} className="absolute left-3 top-3 text-gray-400"><i className="fas fa-times"></i></button>}
                            </div>
                        </div>
                    )}
                    <div className="sticky top-0 z-10 bg-white border-b px-2 py-2">
                        <div className="flex gap-2 overflow-x-auto scrollbar-hide">
                            {categories.map(cat => (
                                <button key={cat.id} onClick={() => { setCategory(cat.id); onClearImgSearch(); }} className={`flex items-center gap-1 px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap transition ${category === cat.id && !isImg ? 'bg-orange-500 text-white shadow-md' : 'bg-gray-100 text-gray-700 hover:bg-orange-100 hover:text-orange-500'}`}>
                                    <i className={`fas ${cat.icon} text-xs`}></i> {cat.label}
                                </button>
                            ))}
                        </div>
                    </div>
                    <div className="flex items-center gap-3 px-4 py-3 bg-white border-b">
                        <button onClick={onAccountBtn} className="flex gap-2 px-4 py-2 rounded-xl bg-gray-100 text-gray-800 text-sm hover:bg-orange-100 hover:text-orange-600 transition"><i className="fas fa-user-circle"></i> {t('my_account')}</button>
                        <button onClick={onShowOffers} className="flex gap-2 px-4 py-2 rounded-xl bg-orange-50 text-orange-600 text-sm hover:bg-orange-500 hover:text-white transition"><i className="fas fa-tag"></i> {t('offers')}</button>
                        <button onClick={onShowVIPPage} className="flex gap-2 px-4 py-2 rounded-xl bg-yellow-50 text-yellow-700 text-sm hover:bg-orange-500 hover:text-white transition"><i className="fas fa-crown"></i> {t('vip_subscriptions')}</button>
                        <div className="flex-1"></div>
                        <button onClick={() => { setViewMode('grid'); onClearImgSearch(); }} className={`p-2 rounded-xl transition ${viewMode === 'grid' && !isImg ? 'bg-orange-500 text-white' : 'bg-gray-100 text-gray-600 hover:bg-orange-100 hover:text-orange-500'}`}><i className="fas fa-th-large"></i></button>
                        <button onClick={() => { setViewMode('list'); onClearImgSearch(); }} className={`p-2 rounded-xl transition ${viewMode === 'list' && !isImg ? 'bg-orange-500 text-white' : 'bg-gray-100 text-gray-600 hover:bg-orange-100 hover:text-orange-500'}`}><i className="fas fa-list-ul"></i></button>
                    </div>
                    {isImg && <div className="bg-blue-50 px-4 py-2 text-sm flex justify-between"><span><i className="fas fa-camera"></i> {t('image_results')} ({display.length})</span><button onClick={onClearImgSearch} className="font-bold">{t('clear')}</button></div>}
                    <div className="flex-1 overflow-auto p-4">
                        {display.length === 0 ? <div className="text-center py-20 text-gray-400"><i className="fas fa-box-open text-5xl"></i><p>{t('no_products')}</p></div> :
                            viewMode === 'grid' || isImg ?
                                <div className="grid grid-cols-2 gap-4">{display.map(p => <ProductCard key={p.id} product={p} isLiked={isLiked(p)} onLike={() => onLike(p.id)} onWhatsApp={() => onWhatsApp(p)} onClick={() => onProductClick(p)} listMode={false} onComment={() => onComment(p.id)} onRate={(rating) => onRate(p.id, rating)} t={t} />)}</div> :
                                <div className="flex flex-col gap-3">{display.map(p => <ProductCard key={p.id} product={p} isLiked={isLiked(p)} onLike={() => onLike(p.id)} onWhatsApp={() => onWhatsApp(p)} onClick={() => onProductClick(p)} listMode={true} onComment={() => onComment(p.id)} onRate={(rating) => onRate(p.id, rating)} t={t} />)}</div>
                        }
                    </div>
                </div>
            );
        };

        // ==================== باقي المكونات (مبسطة وآمنة) ====================
        const OffersPage = ({ products, selectedCountry, onProductClick, onBack, t }) => {
            const offerProducts = Object.values(products).filter(p => (p.likes > 0 || p.price < 300) && p.sellerCountry === selectedCountry);
            return (
                <div className="flex flex-col h-full bg-white">
                    <div className="flex items-center p-4 border-b"><button onClick={onBack} className="hover:text-orange-500"><i className="fas fa-arrow-right ml-2"></i> {t('back')}</button><h1 className="flex-1 text-center font-bold"><i className="fas fa-tag text-orange-500 ml-2"></i> {t('special_offers')}</h1></div>
                    <div className="flex-1 overflow-auto p-4"><div className="grid grid-cols-2 gap-4">{offerProducts.map(p => (<div key={p.id} onClick={() => onProductClick(p)} className="bg-white rounded-xl border shadow-sm overflow-hidden cursor-pointer hover:shadow-md transition"><div className="aspect-square flex items-center justify-center bg-gray-50 text-6xl">{p.emoji}</div><div className="p-3"><h3 className="font-semibold line-clamp-2">{p.name}</h3><p className="text-orange-600 font-bold mt-1">{p.price.toLocaleString()} {t('currency')}</p><div className="text-xs text-gray-500 truncate">{p.sellerName}</div></div></div>))}</div></div>
                </div>
            );
        };
        const VIPPage = ({ seller, onBack, onPurchaseSubscription, t }) => {
            const plans = [
                { id: 'silver', name: t('silver'), price: 99, features: ['50 منتج', 'دعم أساسي', 'نقاط مضاعفة'] },
                { id: 'gold', name: t('gold'), price: 199, features: ['منتجات غير محدودة', 'دعم أولوية', 'نقاط ×2', 'ظهور مميز'] },
                { id: 'platinum', name: t('platinum'), price: 299, features: ['كل ميزات الذهبي', 'استشارات تسويقية', 'توثيق مجاني'] }
            ];
            return (<div className="flex flex-col h-full bg-white"><div className="flex items-center p-4 border-b"><button onClick={onBack} className="hover:text-orange-500"><i className="fas fa-arrow-right ml-2"></i> {t('back')}</button><h1 className="flex-1 text-center font-bold"><i className="fas fa-crown text-yellow-500 ml-2"></i> {t('vip_membership')}</h1></div><div className="p-4 space-y-4 overflow-auto"><p className="text-gray-600 text-center">{t('vip_desc')}</p>{plans.map(plan => (<div key={plan.id} className="rounded-2xl p-5 shadow-md bg-gray-50"><h2 className="text-xl font-bold text-gray-800">{plan.name}</h2><p className="text-3xl font-bold mt-2 text-orange-600">{plan.price} {t('currency')} <span className="text-sm">{t('monthly')}</span></p><ul className="mt-3 space-y-1">{plan.features.map((f, idx) => <li key={idx} className="text-sm flex items-center gap-2"><i className="fas fa-check-circle text-green-500"></i> {f}</li>)}</ul><button onClick={() => onPurchaseSubscription(plan.id, plan.price)} className="mt-4 w-full py-3 bg-orange-500 text-white rounded-xl font-semibold">{t('subscribe_now')}</button></div>))}<p className="text-xs text-center text-gray-400 mt-4">{t('free_plan_note')}</p></div></div>);
        };
        const AdminDashboard = ({ sellers, products, onBack, onDeleteSeller, onDeleteProduct, onAddProductForSeller, t }) => {
            const [selectedSellerId, setSelectedSellerId] = useState('');
            const [newProductName, setNewProductName] = useState('');
            const [newProductPrice, setNewProductPrice] = useState('');
            const sellersList = Object.values(sellers).filter(s => !s.isAdmin);
            const allProducts = Object.values(products);

            const handlePurchaseComplete = (type, amt, pts) => { updateState(s => { const seller = s.sellers[currentSeller.id]; return { ...s, sellers: { ...s.sellers, [currentSeller.id]: { ...seller, points: seller.points + (pts || 0), verified: type === 'verify' ? true : seller.verified } } }; }); };
            const handleSubscriptionPurchase = (planId, price) => { updateState(s => { const seller = s.sellers[currentSeller.id]; return { ...s, sellers: { ...s.sellers, [currentSeller.id]: { ...seller, subscription: planId } } }; }); alert(`تم الترقية إلى باقة ${planId} بنجاح!`); setPage('seller'); };
            const handleDeleteSeller = (sellerId) => { if (confirm('حذف البائع وجميع منتجاته؟')) updateState(s => { const newSellers = { ...s.sellers }; delete newSellers[sellerId]; const newProducts = { ...s.products }; Object.keys(newProducts).forEach(pid => { if (newProducts[pid].sellerId === sellerId) delete newProducts[pid]; }); return { ...s, sellers: newSellers, products: newProducts }; }); };
            const handleAdminDeleteProduct = (pid) => { if (confirm('حذف المنتج نهائياً؟')) updateState(s => { const newProducts = { ...s.products }; delete newProducts[pid]; return { ...s, products: newProducts }; }); };
            const handleAddProductForSeller = (sellerId, prodName, prodPrice) => { updateState(s => { const seller = s.sellers[sellerId]; if(!seller) return s; const newP = createProduct({ name: prodName, price: prodPrice, category: 'used', emoji: '📦', description: '', sellerId: seller.id, sellerName: seller.storeName, sellerCountry: seller.country, vip: false }); return { ...s, products: { ...s.products, [newP.id]: newP }, sellers: { ...s.sellers, [sellerId]: { ...seller, products: [...seller.products, newP.id] } } }; }); alert('تمت الإضافة'); };
            const handleCameraSearch = (e) => { const file = e.target.files[0]; if (!file) return; setImgSearchLoading(true); setTimeout(() => { const filtered = Object.values(state.products).filter(p => p.name.includes(searchText) || (!searchText)); setImgSearchResults(filtered.slice(0, 12)); setImgSearchLoading(false); }, 1000); if (cameraInputRef.current) cameraInputRef.current.value = ''; };
            const handleSearchChange = (val) => { setSearchText(val); if (val.trim() === '') setImgSearchResults(null); else { const filtered = Object.values(state.products).filter(p => p.name.includes(val) || p.sellerName.includes(val)); setImgSearchResults(filtered); } };
            const showHome = () => { setPage('home'); setDetailProduct(null); setImgSearchResults(null); setSearchText(''); setShowSearchBar(false); };
            const handleComment = (pid, commentText) => { updateState(s => { const p = s.products[pid]; const newComments = [...(p.comments || []), commentText]; return { ...s, products: { ...s.products, [pid]: { ...p, comments: newComments } } }; }); };
            const handleRate = (pid, rating) => { updateState(s => { const p = s.products[pid]; return { ...s, products: { ...s.products, [pid]: { ...p, rating: rating } } }; }); };
            const isLiked = (p) => currentSeller ? p.likedBy.includes(currentSeller.id) : false;

            return (
                <div className="min-h-screen flex flex-col transition-colors duration-300">
                    {page === 'home' && (
                        <>
                            <header className="sticky top-0 z-20 bg-white border-b px-3 py-2 flex items-center justify-between">
                                <div className="logo-frame"><i className="fas fa-store text-orange-500 text-base"></i><span className="text-sm font-bold text-orange-600">VICKS MARKET</span></div>
                                <div className="flex gap-2">
                                    <button onClick={() => cameraInputRef.current?.click()} className="p-1.5 rounded-xl bg-gray-100 text-gray-700 hover:bg-orange-500 hover:text-white transition"><i className="fas fa-camera text-sm"></i></button>
                                    <button onClick={() => setShowSearchBar(!showSearchBar)} className="p-1.5 rounded-xl bg-gray-100 text-gray-700 hover:bg-orange-500 hover:text-white transition"><i className="fas fa-search text-sm"></i></button>
                                    <button onClick={() => setDarkMode(!darkMode)} className="p-1.5 rounded-xl bg-gray-100 text-gray-700 hover:bg-orange-500 hover:text-white transition"><i className={`fas fa-${darkMode ? 'sun' : 'moon'} text-sm`}></i></button>
                                    {isAdminUser && <button onClick={() => setPage('admin')} className="p-1.5 rounded-xl bg-gray-100 text-gray-700 hover:bg-orange-500 hover:text-white"><i className="fas fa-cogs"></i></button>}
                                    <button onClick={() => currentSeller ? setPage('seller') : setPage('login')} className="p-1.5 rounded-xl bg-gray-100 text-gray-700 hover:bg-orange-500 hover:text-white transition"><i className="fas fa-user-circle text-sm"></i></button>
                                </div>
                                <input ref={cameraInputRef} type="file" accept="image/*" capture="environment" className="hidden" onChange={handleCameraSearch} />
                            </header>
                            {imgSearchLoading && <div className="bg-blue-50 p-2 text-center text-sm"><i className="fas fa-spinner fa-pulse"></i> {t('image_results')}...</div>}
                            <main className="flex-1 overflow-hidden">
                                <HomePage products={state.products} currentSellerId={state.currentSellerId} selectedCountry={selectedCountry} onChangeCountry={setSelectedCountry} onLike={handleLike} onWhatsApp={handleWhatsApp} onProductClick={p => { setDetailProduct(p); setPage('detail'); }} onAccountBtn={() => currentSeller ? setPage('seller') : setPage('login')} onShowOffers={() => setPage('offers')} onShowVIPPage={() => setPage('vip')} imgSearchResults={imgSearchResults} onClearImgSearch={() => { setImgSearchResults(null); setSearchText(''); setShowSearchBar(false); }} onComment={(pid) => { const comment = prompt(t('write_comment')); if (comment) handleComment(pid, comment); }} onRate={(pid, rating) => handleRate(pid, rating)} searchText={searchText} onSearchChange={handleSearchChange} showSearchBar={showSearchBar} t={t} />
                            </main>
                            <button onClick={() => setPage('chat')} className="fixed bottom-6 right-6 w-14 h-14 rounded-full bg-orange-500 text-white shadow-lg flex items-center justify-center hover:bg-orange-600 z-30"><i className="fas fa-robot text-2xl"></i></button>
                        </>
                    )}
                    {page === 'offers' && <OffersPage products={state.products} selectedCountry={selectedCountry} onProductClick={p => { setDetailProduct(p); setPage('detail'); }} onBack={showHome} t={t} />}
                    {page === 'vip' && currentSeller && <VIPPage seller={currentSeller} onBack={showHome} onPurchaseSubscription={handleSubscriptionPurchase} t={t} />}
                    {page === 'admin' && currentSeller && isAdminUser && <AdminDashboard sellers={state.sellers} products={state.products} onBack={showHome} onDeleteSeller={handleDeleteSeller} onDeleteProduct={handleAdminDeleteProduct} onAddProductForSeller={handleAddProductForSeller} t={t} />}
                    {page === 'login' && <LoginPage sellers={state.sellers} onLogin={handleLogin} onGoJoin={() => setPage('join')} onBack={showHome} t={t} />}
                    {page === 'join' && <JoinPage sellers={state.sellers} onRegister={handleRegister} onBack={() => setPage('login')} t={t} />}
                    {page === 'seller' && currentSeller && <SellerPage seller={state.sellers[currentSeller.id]} products={state.products} onGoStore={() => setPage('store')} onGoChat={() => setPage('chat')} onAddProduct={() => { setEditingProduct(null); setPage('addProduct'); }} onEditProduct={p => { setEditingProduct(p); setPage('addProduct'); }} onDeleteProduct={handleDeleteProduct} onLogout={handleLogout} onBack={showHome} onChangeLang={setLang} currentLang={lang} t={t} />}
                    {page === 'store' && currentSeller && <StorePage seller={state.sellers[currentSeller.id]} onBack={() => setPage('seller')} onPurchaseComplete={handlePurchaseComplete} t={t} />}
                    {page === 'chat' && <ChatPage messages={state.chatMessages} onSendMessage={handleSendMessage} onBack={() => setPage(currentSeller ? 'seller' : 'home')} t={t} />}
                    {page === 'addProduct' && currentSeller && <AddProductPage onSave={handleAddProduct} onBack={() => { setEditingProduct(null); setPage('seller'); }} editProduct={editingProduct} sellerCountry={currentSeller.country} t={t} />}
                    {page === 'detail' && detailProduct && <ProductDetailPage product={state.products[detailProduct.id] || detailProduct} seller={state.sellers[detailProduct.sellerId] || null} isLiked={isLiked(state.products[detailProduct.id] || detailProduct)} onLike={() => handleLike(detailProduct.id)} onBack={showHome} onComment={(text) => handleComment(detailProduct.id, text)} onRate={(rating) => handleRate(detailProduct.id, rating)} t={t} />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
    </html>
