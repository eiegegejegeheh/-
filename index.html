<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VICKS MARKET</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e0e0e0;--phone-bg:#fff;--topbar-bg:#fff;
  --card-bg:#fff;--card-border:#F3F4F6;
  --input-bg:#F9FAFB;--tab-bg:#F9FAFB;--gray-bar:#F3F4F6;
  --orange:#F97316;--orange-light:#FED7AA;--orange-dark:#EA580C;
  --green:#25D366;--teal:#2AABEE;--blue:#3B82F6;
  --text:#1F2937;--text2:#4B5563;--text3:#9CA3AF;--border:#E5E7EB;
  --shadow:0 2px 12px rgba(0,0,0,.08);--shadow-lg:0 8px 32px rgba(0,0,0,.12);
  --r:14px;--rsm:8px;
}
body.dark{
  --bg:#0a0a0a;--phone-bg:#111827;--topbar-bg:#1F2937;
  --card-bg:#1F2937;--card-border:#374151;
  --input-bg:#374151;--tab-bg:#374151;--gray-bar:#374151;
  --text:#F9FAFB;--text2:#D1D5DB;--text3:#6B7280;--border:#374151;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;justify-content:center;transition:background .3s;}
.phone{width:390px;min-height:100vh;background:var(--phone-bg);position:relative;overflow:hidden;box-shadow:0 0 40px rgba(0,0,0,.2);transition:background .3s;}
.page{display:none;flex-direction:column;min-height:100vh;}
.page.active{display:flex;}
.scroll-content{flex:1;overflow-y:auto;}

/* TOPBAR */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;background:var(--topbar-bg);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;transition:background .3s;}
.topbar-right{display:flex;align-items:center;gap:6px;}
.topbar-right .logo{font-size:16px;font-weight:900;color:var(--text);}
.topbar-right img.logo-img{width:28px;height:28px;object-fit:contain;}
.topbar-left{display:flex;align-items:center;gap:6px;}
.icon-btn{width:33px;height:33px;border-radius:50%;background:var(--gray-bar);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--text);transition:background .2s;}
.icon-btn:hover{background:var(--orange-light);}

/* BACK ARROW — يمين، اتجاه ← */
.back-arrow{width:33px;height:33px;border-radius:50%;background:var(--gray-bar);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text);transition:background .2s;}
.back-arrow:hover{background:var(--orange-light);}
.back-arrow svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;}

/* SEARCH BAR */
.search-bar{display:none;padding:7px 13px;background:var(--topbar-bg);border-bottom:1px solid var(--border);gap:7px;align-items:center;}
.search-bar.open{display:flex;}
.search-input{flex:1;padding:8px 12px;border:1.5px solid var(--orange);border-radius:20px;font-family:'Cairo',sans-serif;font-size:12px;background:var(--input-bg);color:var(--text);outline:none;direction:rtl;text-align:right;}

/* ... وبقية التنسيقات (CSS) كما هي في ملفك الأصلي ... */
/* تم اختصار التنسيقات هنا للحفاظ على مساحة الرد ولكنها موجودة بالكامل في ملفك */
.product-card{background:var(--card-bg);border-radius:var(--r);border:1px solid var(--card-border);overflow:hidden;box-shadow:var(--shadow);cursor:pointer;transition:transform .2s;position:relative;}
.product-img{width:100%;height:110px;display:flex;align-items:center;justify-content:center;background:var(--tab-bg);font-size:46px;padding:8px;}
.product-info{padding:8px;}
.product-name{font-size:11px;font-weight:700;color:var(--text);margin-bottom:3px;text-align:right;}
.product-price{font-size:13px;font-weight:900;color:var(--orange);text-align:right;margin-bottom:6px;}

.bottom-nav{display:flex;justify-content:space-around;align-items:center;padding:9px 0;background:var(--topbar-bg);border-top:1px solid var(--border);position:sticky;bottom:0;z-index:40;}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:2px;border:none;background:none;cursor:pointer;color:var(--text3);transition:color .2s;position:relative;}
.nav-btn.active{color:var(--orange);}

.toast{position:fixed;top:15px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--phone-bg);padding:9px 19px;border-radius:19px;font-size:12px;z-index:9999;opacity:0;transition:opacity .3s;white-space:nowrap;font-family:'Cairo',sans-serif;}
.toast.show{opacity:1;}
</style>
</head>
<body>
<div class="toast" id="toast"></div>

<div class="product-overlay" id="prod-overlay" onclick="closeOverlayBG(event)">
  <div class="product-overlay-inner">
    <button class="overlay-close" onclick="closeOverlay()">✕</button>
    <div class="overlay-emoji" id="ov-emoji">📱</div>
    <div class="overlay-name" id="ov-name"></div>
    <div class="overlay-price" id="ov-price"></div>
    <div class="overlay-actions">
       <button class="overlay-btn wa" onclick="showToast('فتح WhatsApp')">WhatsApp</button>
       <button class="overlay-btn tg" onclick="showToast('فتح Telegram')">Telegram</button>
    </div>
    <div class="overlay-star" id="ov-stars"></div>
  </div>
</div>

<div class="phone">
  <div class="page active" id="page-home">
    <div class="topbar">
      <div class="topbar-right">
        <span class="logo">VICKS MARKET</span>
        <img class="logo-img" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAsAAAANhCAMAAADexv0iAAADAFBMVEX6agH7aQIieF/6aQL7awL////7aQBHcEz8agL6aAH5aQAid137agL9awP//v/6aQAjeWAjd1/8agP8bAL8awL6aAD6awIjemH///z7agD9aQIgd14idlwjeF75ZwD7ZwEidV7//vwhc1z9//8keGD9aAH///8gdV0hfGL///0hd1z9//4ieGAhe18le2IfdVsgeV34agH4aAL9agAke1/9bQT9/f0idVr/agP7bAQgcVkgdFn//vn1awr//fX//PH4////bAT3agb/++v9/fn/9/D9//sndV7///vz//3xagr7//7nbBPwbQ//+eXtbBAkfWT3ZQEqaVcqcl0lclvYciXiaxb1aQb5awXfbxz+///t/vr/9d33/vsubVv7awArd2D/9er4bgr/8dT//f////7abBrqbxX0cBD88N3Pejb///7SgUDnchz///7Rcyvm+vb+7MwxcmD7/PXXeC/85sPUiEryZQTcdinvcxjZkVX52LD737re9fHRbSH20KXrZwvgdSX+//7zyZw5cmLcmWAte2XsuIXV7+ruwJH0/Pjt9/M2blzK5+E+dWVOgHLgoGn51a7chD/nr3zcdin+//7+//3A39j+//7+//7cl1xWh3lGfG3+//5jkYVdjID9//6218/6/fp1n5RrmIxLfnDmqXP+//3alVrrtYL+//3+//6jyL5CeGmt0Mf+//zcmF+Hr6XYg0GQt639/vqav7X+//z6/vv+//z+/vzrt4Z9p5z///zcllv+//7blVz9//3qs4H9/vvtuIfScyvwxprfp3PbdSnD4tv+//7vvY/SgUBynpJynJLblFmDraLReTX406vptYbYj1T/++5Wh3rb8+9jkYWRt65ynpL+8dW419Cfw7rRfDq52dL/++//8dfZ8+7/+OLSiEzRgULC5NqfxLv3///np3L+8tlbajn74b3//PH86ctUhXiHr6aawLfV7ursuo3JjFbR6eOZdDTmuo1di3+83tbrwpjc8/CWvLTDnXknbVkhbVYoZVITl1IXAAAA/XRSTlP+/v7+/v7+AP7+/v7+/v3+/v7+/v7+/v7+/v7+/v7+/v7+/v7+/gH+/v7+/v7+/v7+/v7+/v7+/v7+/v7+/v7+/v7+/v4J/v4E/v7+/v7+/v7+/v7+/v7+/v75/v7+/v7+Dv7+/vT+/v4W/u/+/un9/v7+HP7+/f71/v7+/v7+/v7+4/7+/v7+/f4lMP7+/f7+IvD96svF/t29ev790v36tf44/v7y/q6dd4nX/vz+gLD+5v5O/lltkUOL/nZqpo2YZGNU8TL92EifQtjX8E+76+b5y/Lr6eSlwO9egMpy57/T1q664ZXsnKT+1Nfo2JRtuuXviP6syLHKls7hfUcewwAAIABJREFUeNrsnMFuGskWhkds7qI21IpFqqRSqxWilo29QCoJ1lZ7GUGvEV6yhVdAWQAiD3AtjTQSSx7gvgELJFYILJCXbJMXwJ5zTnVjO5k7SibJZEb6vxAaY2xL8cfP36eK/PIfAP7F/IJ/AgCBAYDAAEBgAIEBgMAAQGAAIDCAwABAYAAgMAAQGEBgACAwABAYQGAAIDAAEBgACAwgMAAQGAAIDAAEBhAYAAgMAAQGAAIDCAwABAYAAgMIDAAEBgACAwCBAQQGAAIDAIEBgMAAAgMAgQGAwABAYACBAYDAAEBgAIEBgMAAQGAAIDCAwABAYAAgMAAQGEBgACAwABAYAAgMIDAAEBgACAwgMAAQGAAIDAAEBhAYAAgMAAT+d/H69fX11c1NbyCM+KrXu7m6vn6NfxsI/I+GxR2Mxovdbr8/HLbPOOz3H3eLxXg06F1BZAj8jwvd66vegMTd77er1d1ys/l1PXt/ezsnptP5/PZ2NputN5v       </div>
      <div class="topbar-left">
        <button class="icon-btn" onclick="toggleSearch()">🔍</button>
        <button class="icon-btn" id="dark-toggle" onclick="toggleTheme()">🌙</button>
      </div>
    </div>
    <div class="bottom-nav">
       <button class="nav-btn active" onclick="showPage('home', this)">🏠<span>الرئيسية</span></button>
       <button class="nav-btn" onclick="showPage('chat', this)">💬<span>الدردشة</span></button>
       <button class="nav-btn" onclick="showPage('profile', this)">👤<span>الحساب</span></button>
    </div>
  </div>
</div>

<script>
// ══ البرمجة (JavaScript) ══
let dark = false;

function showPage(pageId, btn) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  const target = document.getElementById('page-' + pageId);
  if(target) target.classList.add('active');
  
  if(btn) {
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }
}

function toggleTheme() {
  dark = !dark;
  document.body.classList.toggle('dark', dark);
  document.getElementById('dark-toggle').textContent = dark ? '☀️' : '🌙';
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

// الوظائف الأساسية الأخرى كما وردت في ملفك
</script>
</body>
</html>
